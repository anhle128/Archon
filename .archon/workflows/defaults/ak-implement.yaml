name: ak-implement
description: |
  Use when: User already has an implementation plan and wants it executed
  unattended in a worktree (no /ak:plan).
  Triggers: "ak implement", "implement plan", "ralph implement plan",
            "run existing plan", "implement from plans/".
  Does: resolve the plan source from $ARGUMENTS — a GitHub issue (URL or #N) whose
        body links the plan, or a local plan dir / .md file ->
        convert plan into a Ralph PRD (prd.md + prd.json) CO-LOCATED with it ->
        autonomous story-by-story implementation via archon-ralph-dag-project-aware ->
        audit-only plan-coverage gate (verify-audit); on FAIL a fix-gaps pass
        loops back to the gate (max 3); on exhaustion one final fix pass -> create PR.
        Never trusts ralph-implement.
  Input: REQUIRED. A GitHub issue URL / #N whose body links a plan path, OR a plan
        directory (plans/<slug>/, specs/<slug>/) or a .md plan file
        (e.g. docs/superpowers/plans/<name>.md).
  NOT for: creating a plan from scratch (use ck-feature), quick one-file fixes,
        bug fixes, or PR reviews.

# Default provider. build-ralph-prd / verify-audit / fix-gaps / fix-gaps-final override to codex.
# ralph-implement runs archon-ralph-dag-project-aware as authored (its own per-node providers).
provider: omp

nodes:
  # ───────────────────────────────────────────────────────────────────
  # STEP 1 / 5 — Setup
  # ───────────────────────────────────────────────────────────────────
  - id: setup
    bash: |
      set -euo pipefail
      echo "=== AK IMPLEMENT (EXISTING PLAN) ==="
      echo "ARGUMENTS=${ARGUMENTS:-}"
      echo "PROJECT_ROOT=$(pwd)"
      echo "HEAD=$(git rev-parse --short HEAD 2>/dev/null || echo 'no-git')"
      echo "ARTIFACTS_DIR=$ARTIFACTS_DIR"
      git fetch --all --prune 2>/dev/null || true
      mkdir -p plans
      echo ""
      echo "Pipeline: resolve plan  ->  plan->Ralph PRD (co-located)  ->  archon-ralph-dag-project-aware  ->  verify-audit gate <-> fix-gaps loop  ->  PR"
      echo "Starting Step 1 of 5: resolve plan..."

  # ───────────────────────────────────────────────────────────────────
  # STEP 1b / 5 — Resolve the plan SOURCE to a local path
  # $ARGUMENTS may be a GitHub issue (URL or #N) whose body links the plan, OR a
  # local plan path already. This AI step returns the LOCAL plan path (never a URL).
  # ───────────────────────────────────────────────────────────────────
  - id: resolve-plan-source
    prompt: |
      ## Task — resolve the plan SOURCE to a local path

      `$ARGUMENTS` is the ak-implement input. Output the LOCAL path of the plan to
      implement as `plan_path`. Do NOT read or summarize the plan contents here —
      only resolve the path.

      Classify `$ARGUMENTS`:

      1. **A GitHub issue reference** — a github.com issues URL
         (`https://github.com/<owner>/<repo>/issues/<N>`), or `#<N>`, or `issue <N>`:
         - Repo: use the URL's `<owner>/<repo>` for a full URL; otherwise the current
           repo (`gh repo view --json nameWithOwner -q .nameWithOwner`).
         - Read it: `gh issue view <N> --repo <owner>/<repo> --json title,body`.
         - From the body, extract the CANONICAL plan path it links — prefer a line
           labelled like "Plan (canonical, files-first)" — one of:
           `plans/<...>/plan.md`, `plans/<...>.md`, `specs/<...>/...`,
           `docs/superpowers/plans/<...>.md`, or a plan directory. Return that path
           EXACTLY as written in the issue (repo-relative) — never the issue URL.
         - If the issue links no such plan path, STOP and fail (do not guess one).
      2. **A local path already** (a directory or a `.md` file) → return it unchanged.

      Output `plan_path` (the local path string, no backticks or markdown).
    depends_on: [setup]
    effort: medium
    provider: claude
    model: "sonnet"
    allowed_tools: [Bash, Read]
    context: fresh
    output_format:
      type: object
      properties:
        plan_path:
          type: string
      required: [plan_path]

  # ───────────────────────────────────────────────────────────────────
  # STEP 2 / 5 — Resolve + co-locate from the resolved plan source
  # Input: $resolve-plan-source.output.plan_path (a local dir or .md file).
  # A canonical `.../plan.md` file is normalized to its DIRECTORY (so the whole
  # plan dir — plan.md + phase-*.md — is read, and the PRD co-locates in it).
  # Any other `.md` file -> sibling <dirname(dirname)>/ralph/<name>/.
  # Diagnostics -> stderr; stdout is ONLY JSON {"plan_path","prd_dir"}.
  # ───────────────────────────────────────────────────────────────────
  - id: resolve-plan
    bash: |
      set -euo pipefail

      RAW=$resolve-plan-source.output.plan_path
      # trim surrounding whitespace and any stray backticks a markdown link carried
      RAW="${RAW#"${RAW%%[![:space:]]*}"}"
      RAW="${RAW%"${RAW##*[![:space:]]}"}"
      RAW="${RAW#\`}"; RAW="${RAW%\`}"

      if [ -z "$RAW" ]; then
        echo "ERROR: no plan path resolved from the input." >&2
        exit 1
      fi

      if [ -d "$RAW" ]; then
        # Directory plan (plans/<slug>/, specs/<slug>/, …) — PRD co-locates in it.
        PLAN_PATH="$(cd "$RAW" && pwd)"
        PRD_DIR="$PLAN_PATH"
      elif [ -f "$RAW" ]; then
        BASE="$(basename "$RAW")"
        DIR_ABS="$(cd "$(dirname "$RAW")" && pwd)"
        if [ "$BASE" = "plan.md" ]; then
          # Canonical plan.md -> the plan IS its directory (plan.md + phase-*.md);
          # PRD co-locates in that directory.
          PLAN_PATH="$DIR_ABS"
          PRD_DIR="$DIR_ABS"
        else
          case "$RAW" in
            *.md) : ;;
            *) echo "ERROR: a file plan must be a .md file, got: $RAW" >&2; exit 1 ;;
          esac
          # Single-file plan -> sibling ralph/<name>/: replace the file's parent dir
          # name with 'ralph' and append the basename.
          #   docs/superpowers/plans/foo.md -> docs/superpowers/ralph/foo/
          #   plans/architectures/bar.md    -> plans/ralph/bar/
          PLAN_PATH="$DIR_ABS/$BASE"
          PRD_DIR="$(dirname "$DIR_ABS")/ralph/${BASE%.md}"
        fi
      else
        echo "ERROR: resolved plan path does not exist: $RAW" >&2
        exit 1
      fi

      mkdir -p "$PRD_DIR"
      PRD_DIR="$(cd "$PRD_DIR" && pwd)"

      echo "Resolved plan: $PLAN_PATH" >&2
      echo "PRD dir (co-located): $PRD_DIR" >&2
      if [ -d "$PLAN_PATH" ]; then ls -la "$PLAN_PATH" >&2; fi
      # stdout = ONLY this JSON object (consumed as $resolve-plan.output.{plan_path,prd_dir}).
      printf '{"plan_path":"%s","prd_dir":"%s"}' "$PLAN_PATH" "$PRD_DIR"
    depends_on: [resolve-plan-source]
    always_run: true

  - id: verify-and-fix-plan
    prompt: |
      Review and revise the complete plan at `$resolve-plan.output.plan_path`.
      Treat the current plan as an unverified draft.
      Do not trust its claims, assumptions, scope, file references, technical decisions, or conclusions.

      Independently inspect the repository, documentation, code, tests, configuration, and existing behavior.
      Use repository evidence to verify every material part of the plan.

      Determine:

      - What goal the plan is trying to achieve.
      - Whether that goal matches the actual project need.
      - Whether the proposed solution fully meets that goal.
      - Whether the scope is correct and complete.
      - Whether any requirements, decisions, or steps conflict.
      - Whether the plan conflicts with existing behavior, contracts, architecture, conventions, or repository rules.
      - Whether the design is correct, simple, maintainable, secure, scalable, and reliable.
      - Whether the named files, components, dependencies, and code paths are accurate.
      - Whether the implementation order is practical and complete.
      - Whether compatibility, migration, rollout, failure handling, and operational concerns are covered.
      - Whether the test and validation strategy can prove the result.
      - Whether the acceptance criteria are complete, measurable, and tied to the goal.
      - Whether the plan contains unsupported assumptions, gaps, unnecessary work, duplication, or premature abstractions.

      Trace the affected behavior end to end.
      Check direct and indirect effects outside the files named by the plan.
      Look for important cases that the plan author may have missed.

      Fix every verified problem directly in the plan.
      Add missing details that an implementing engineer needs.
      Remove incorrect, conflicting, redundant, or unnecessary content.
      Keep the solution focused and proportional to the goal.

      Do not implement production code.
      Your task is to make the plan ready for implementation.

      After revising the plan, review it again from these perspectives:

      1. Product goal and user outcome.
      2. Architecture and technical correctness.
      3. Public and internal contracts.
      4. Security, reliability, and data integrity.
      5. Performance and scalability.
      6. Implementation completeness.
      7. Testing and verification.
      8. Operations, compatibility, migration, and rollback.
      9. Simplicity and long-term maintainability.

      Finish with a concise report that states:

      - Your interpretation of the goal.
      - The evidence you inspected.
      - The important problems you found.
      - The changes you made.
      - Any remaining risks, assumptions, or unresolved questions.
      - Whether the plan is ready to implement.
    depends_on: [resolve-plan]
    provider: codex
    effort: xhigh
    model: gpt-5.6-sol
    context: fresh

  # ───────────────────────────────────────────────────────────────────
  # STEP 3 / 5 — Convert the plan into a Ralph PRD, CO-LOCATED with the plan
  # Dir plan -> prd.{md,json} written in that dir. File plan -> written in a
  # sibling <dirname(dirname(file))>/ralph/<name>/ dir. NEVER .archon/ralph/.
  # ───────────────────────────────────────────────────────────────────
  - id: build-ralph-prd
    prompt: |
      ## Persona

      You are a SHARP SOLUTION ARCHITECT who lives by KISS and YAGNI. You do not
      invent work that isn't in the plan, and you do not drop work that is.

      ## Headless mode — NO human is available

      Resolve every decision yourself from the plan plus the actual codebase.
      Do not stop to ask.

      ## Task

      The plan to implement is at:

        $resolve-plan.output.plan_path

      It is EITHER a directory (holds `plan.md` + optional `phase-*.md`) OR a single
      `.md` plan file. The Ralph PRD directory has ALREADY been chosen and created
      for you (co-located with the plan):

        $resolve-plan.output.prd_dir

      Convert that ENTIRE plan into a Ralph PRD so the archon-ralph-dag-project-aware
      loop can implement it one story per iteration. Do NOT implement the feature
      itself — only produce the PRD files. Write ONLY inside
      `$resolve-plan.output.prd_dir` (never `.archon/ralph/`).

      1. Read the plan at `$resolve-plan.output.plan_path`:
         - If it is a directory: read `plan.md` and EVERY `phase-*.md` in it (the
           phase files carry the real detail — do not rely on plan.md alone). If
           `verification-report.md` exists, fold in its fixes too.
         - If it is a single `.md` file: read that file.
      2. Break the plan into right-sized Ralph user stories — each completable in a
         single fresh-context iteration (roughly one phase or one coherent unit of
         work per story). Map the plan's TDD structure (tests-before / implement /
         tests-after / regression gate) into concrete, pass/fail acceptance
         criteria. Order stories by dependency (lower priority runs first) and set
         `dependsOn` to only lower-priority story ids. No cycles, no forward refs.
      3. Write `$resolve-plan.output.prd_dir/prd.md` — a self-contained context
         document (overview / problem / solution, goals + success metrics, non-goals,
         technical context with real file:line references drawn from the plan, and a
         story-overview table). A fresh-context agent re-reads this each iteration.
      4. Write `$resolve-plan.output.prd_dir/prd.json` using EXACTLY this schema
         (story-level `passes`, all `false` at start):

         ```json
         {
           "feature": "<feature name>",
           "userStories": [
             {
               "id": "US-001",
               "title": "<short title>",
               "description": "As a..., I want..., so that...",
               "acceptanceCriteria": ["<verifiable criterion>", "..."],
               "technicalNotes": "<real files, patterns, and phase refs to follow>",
               "dependsOn": [],
               "priority": 1,
               "passes": false,
               "notes": ""
             }
           ]
         }
         ```

      5. Verify both files exist and prd.json is valid JSON whose `userStories` is a
         non-empty array with every story `passes: false`.

      Report `$resolve-plan.output.prd_dir` as `prd_dir`.
    depends_on: [verify-and-fix-plan]
    provider: omp
    effort: xhigh
    model: openai-codex/gpt-5.5
    context: fresh
    output_format:
      type: object
      properties:
        prd_dir:
          type: string
        slug:
          type: string
        feature:
          type: string
        story_count:
          type: number
      required: [prd_dir, slug, story_count]

  # ───────────────────────────────────────────────────────────────────
  # STEP 4 / 5 — Implement via archon-ralph-dag-project-aware (sub-run)
  # Governed child run in this SAME worktree (isolation: inherit).
  # Ready Ralph PRD => detect-input -> "ready" (generation skipped).
  # Loops one story per iteration (fresh context, validate + commit).
  # Next node audits original-plan coverage; PR creation is a later node.
  # ───────────────────────────────────────────────────────────────────
  - id: ralph-implement
    workflow: archon-ralph-dag-project-aware
    input: '$build-ralph-prd.output.prd_dir'
    isolation: inherit
    depends_on: [build-ralph-prd]

  # ───────────────────────────────────────────────────────────────────
  # STEP 5a / 5 — Verify/fix loop: audit-only gate + route_loop
  # verify-audit AUDITS ONLY -> PASS/FAIL. verify-gate (route_loop): FAIL -> fix-gaps
  # (loops back to the gate, max 3); PASS -> plan-verified; exhausted -> fix-gaps-final.
  # Never trust ralph-implement or prd.json passes flags; audit the plan vs the codebase.
  # ───────────────────────────────────────────────────────────────────
  - id: verify-audit
    prompt: |
      ## Persona

      You are a skeptical staff engineer doing a delivery audit. Ralph claimed the
      work is done. You do NOT trust that claim. Prove, with evidence, whether every
      task in the ORIGINAL plan is actually implemented in the codebase. You AUDIT
      ONLY — you do NOT implement, fix, or commit anything in this node.

      ## Headless mode — NO human is available

      Resolve every decision yourself. Do not stop to ask.

      ## Inputs

      - Original plan (directory or .md file): `$resolve-plan.output.plan_path`
      - Ralph PRD directory: `$build-ralph-prd.output.prd_dir`
      - Ralph sub-run output (untrusted): `$ralph-implement.output`

      ## Mandatory procedure

      1. Read the plan at `$resolve-plan.output.plan_path` (if a directory: `plan.md`
         and EVERY `phase-*.md`; if a single `.md` file: that file). Build a complete
         checklist of concrete deliverables / acceptance criteria / tasks from the
         plan (not from prd.json).
      2. Optionally read `$build-ralph-prd.output.prd_dir/prd.json` and `progress.txt`
         as hints only. Treat every `passes: true` as a claim to verify, never proof.
      3. For EACH plan checklist item, inspect the real codebase and tests. Mark it
         `done`, `partial`, or `missing` with file:line evidence.
      4. Do NOT implement anything. This node only judges.
      5. Write `$build-ralph-prd.output.prd_dir/implementation-audit.md` with:

         ```markdown
         # Implementation Audit
         - Plan: <relative plan dir>
         - Auditor: codex gpt-5.5
         - Verdict: <complete | gaps-remain>
         - Summary: <2-4 sentences>

         ## Checklist
         | ID | Plan item | Status | Evidence |
         |----|-----------|--------|----------|
         | P-001 | ... | done/partial/missing | file:line |

         ## Remaining Gaps
         (partial/missing items; or "None")
         ```

      6. Decide the gate: `PASS` when every checklist item is `done`; `FAIL` when any
         item is `partial` or `missing`. Set `gaps_count` = count of partial+missing.
         Set `audit_path` = absolute path of the implementation-audit.md you wrote.
      7. End with `AUDIT_DONE` and a one-line verdict.

      ## Hard rules

      - Source of truth = the ORIGINAL plan files, not Ralph story status.
      - Do NOT implement, fix, or commit in this node — a separate fix node does that.
      - Do not rewrite the plan or expand scope.
      - If a gap cannot be decided from evidence, prefer `FAIL` (a fix pass is cheaper
        than shipping an unverified gap).
    depends_on: [ralph-implement, fix-gaps]
    trigger_rule: one_success
    provider: omp
    effort: xhigh
    model: openai-codex/gpt-5.5
    context: fresh
    output_format:
      type: object
      properties:
        gate:
          type: string
          enum: [PASS, FAIL]
        gaps_count:
          type: number
        audit_path:
          type: string
      required: [gate, audit_path]

  - id: verify-gate
    depends_on: [verify-audit]
    route_loop:
      condition: "$verify-audit.output.gate == 'PASS'"
      max_iterations: 3
      routes:
        positive: plan-verified
        negative: fix-gaps
        exhausted: fix-gaps-final

  - id: fix-gaps
    prompt: |
      ## Persona

      You are a senior engineer closing delivery gaps. A skeptical audit just found the
      implementation does NOT yet satisfy the ORIGINAL plan. Implement the smallest
      durable changes that make every flagged gap `done`.

      ## Headless mode — NO human is available

      Resolve every decision yourself. Do not stop to ask.

      ## Inputs

      - Latest audit report (authoritative gap list):
        `$build-ralph-prd.output.prd_dir/implementation-audit.md`
      - Original plan (directory or .md file): `$resolve-plan.output.plan_path`
      - Ralph PRD directory: `$build-ralph-prd.output.prd_dir`

      ## Mandatory procedure

      1. Read the audit at `$build-ralph-prd.output.prd_dir/implementation-audit.md`.
         Take every item marked `partial` or `missing` as the work to do.
      2. Re-read the relevant plan parts at `$resolve-plan.output.plan_path` (directory:
         `plan.md` + every `phase-*.md`; single file: that file) so each fix matches the
         plan's intent.
      3. For EACH `partial`/`missing` item, IMPLEMENT the remaining work now:
         - Prefer the smallest durable change that fully satisfies the plan item.
         - Follow repo patterns; keep KISS / YAGNI; do not expand scope beyond the plan.
         - Add/update tests when the plan requires them.
         - Run the project's relevant typecheck / lint / tests for the touched area.
         - Commit only the files you changed (never `git add -A` / `git add .`) with a
           clear message like `fix: complete plan gaps — <short summary>`.
         - Never commit scratch/review/PR-body artifacts or anything under
           `$ARTIFACTS_DIR` / `.archon/artifacts` / `.archon/logs` / `.archon/state`.
      4. Do NOT re-audit or write the audit report — the verify-audit node re-runs after
         you and re-checks the plan.
      5. End with `FIX_DONE` and a one-line summary of what you implemented.
    provider: omp
    effort: xhigh
    model: openai-codex/gpt-5.5
    context: fresh

  - id: plan-verified
    depends_on: [verify-gate]
    bash: |
      echo "Plan fully implemented — audit clean; proceeding to PR."

  - id: fix-gaps-final
    prompt: |
      ## Persona

      You are a senior engineer on the FINAL fix pass. The verify/fix loop exhausted its
      retry budget with gaps still open. Implement every remaining gap now. NO further
      audit or fix pass runs after you — the PR is created immediately after this node.

      ## Headless mode — NO human is available

      Resolve every decision yourself. Do not stop to ask.

      ## Inputs

      - Latest audit report (authoritative gap list):
        `$build-ralph-prd.output.prd_dir/implementation-audit.md`
      - Original plan (directory or .md file): `$resolve-plan.output.plan_path`
      - Ralph PRD directory: `$build-ralph-prd.output.prd_dir`

      ## Mandatory procedure

      1. Read the audit at `$build-ralph-prd.output.prd_dir/implementation-audit.md` and
         take every `partial`/`missing` item as the work to do.
      2. Re-read the relevant plan parts at `$resolve-plan.output.plan_path` (directory:
         `plan.md` + every `phase-*.md`; single file: that file).
      3. For EACH `partial`/`missing` item, IMPLEMENT the remaining work now:
         - Smallest durable change that fully satisfies the plan item; repo patterns;
           KISS / YAGNI; no scope expansion.
         - Add/update tests when the plan requires them.
         - Run the project's relevant typecheck / lint / tests for the touched area.
         - Commit only the files you changed (never `git add -A` / `git add .`) with a
           message like `fix: complete plan gaps (final pass) — <short summary>`.
         - Never commit scratch/review/PR-body artifacts or anything under
           `$ARTIFACTS_DIR` / `.archon/artifacts` / `.archon/logs` / `.archon/state`.
      4. Do NOT write the audit report. After this node the PR is created directly.
      5. If any gap is a genuine hard blocker outside the repo (missing secret, external
         service, product decision), document it in one line so the PR body surfaces it.
      6. End with `FINAL_FIX_DONE` and a one-line summary.
    depends_on: [verify-gate]
    provider: omp
    effort: xhigh
    model: openai-codex/gpt-5.5
    context: fresh

  # ───────────────────────────────────────────────────────────────────
  # STEP 5b / 5 — Create PR (after either exit path: plan-verified or fix-gaps-final)
  # ───────────────────────────────────────────────────────────────────
  - id: create-pull-request
    command: archon-create-pr
    provider: codex
    effort: medium
    depends_on: [plan-verified, fix-gaps-final]
    trigger_rule: one_success
    context: fresh
    model: gpt-5.5
    idle_timeout: 900000
    output_type: pull-request
