name: archon-superpower-feature-verify-loop
description: |
  Use when: Manual Superpowers brainstorming is complete and the user wants the
            feature built, then proved with project-local verify-archon before
            any pull request.
  Triggers: "superpower feature verify", "superpower verify loop",
            "archon-superpower-feature-verify-loop".
  Does: Same early Superpowers pipeline as superpower-feature (plan → Codex plan
        repair → Ralph PRD → in-parent Ralph implement, no PR). Then selects
        verify-archon feature-map ids, runs `verify-archon prove <id>` fail-closed
        on a local bun instance, and on failure runs a max-3 fix → re-prove
        route_loop. Positive (all ids PASS) creates a PR that names the proved
        ids and evidence paths. Exhaustion writes a blocked report and stops
        with a non-zero exit — it does not open a green PR.
  NOT for: Brainstorming itself, verify-only without implementation, Mini/PM2/
        Tailscale proofs, or review-only work. Never start or stop Oceanlabs Mini.
  Input: The approved brainstorm result, product notes, design spec path, or
         requirements from the manual Superpowers brainstorming step. Run from
         the anhle128/Archon checkout that contains `.cursor/skills/verify-archon/`.
provider: omp
model: "xai-oauth/grok-4.6"
effort: high
tags:
  - Superpowers
  - Feature
  - TDD
  - Verify

nodes:
  - id: setup
    description: Prepare Superpowers + verify-archon artifacts and preflight the helper.
    bash: |
      set -euo pipefail
      mkdir -p "$ARTIFACTS_DIR/superpowers" "$ARTIFACTS_DIR/verify" docs/superpowers/plans
      git rev-parse HEAD > "$ARTIFACTS_DIR/superpowers/base-sha.txt"
      {
        echo "Archon Superpowers feature + verify-archon loop"
        echo "Base SHA: $(cat "$ARTIFACTS_DIR/superpowers/base-sha.txt")"
        echo "Brainstorming is manual and must already be complete."
        echo "Local bun verify only. Never Mini / PM2 / Tailscale."
      } > "$ARTIFACTS_DIR/superpowers/setup.md"

      VERIFY_BIN=".cursor/skills/verify-archon/bin/verify-archon"
      if [ ! -f "$VERIFY_BIN" ]; then
        echo "ERROR: $VERIFY_BIN is missing." >&2
        echo "Run this workflow from anhle128/Archon after verify-archon landed on develop." >&2
        exit 1
      fi
      chmod +x "$VERIFY_BIN" || true
      printf '%s\n' "$VERIFY_BIN" > "$ARTIFACTS_DIR/verify/helper-path.txt"
      echo "VERIFY_BIN=$VERIFY_BIN"

  - id: write-plan
    description: Write the Superpowers implementation plan with Grok 4.6.
    provider: claude
    model: "opus"
    effort: xhigh
    context: fresh
    skills:
      - writing-plans
    depends_on:
      - setup
    prompt: |
      User input:
      $ARGUMENTS

      Use the Superpowers writing-plans method.
      Read the repository instructions before you plan.
      If the user input names a file or directory, read it before you plan.

      Write one complete implementation plan.
      Save it as docs/superpowers/plans/YYYY-MM-DD-<feature>.md.
      Use the current local date for YYYY-MM-DD.
      Use a short slug for <feature>.

      The plan must be executable by another agent.
      Include exact files to change, interfaces to add or change, tests to write, and commands to run.
      Include TDD red, green, and refactor steps for code changes.
      Include all known requirements from the approved brainstorm.
      Include acceptance criteria and validation commands.
      Include which verify-archon feature-map ids (under `.cursor/skills/verify-archon/features/`)
      a later node should prove after implementation.
      Do not leave placeholders.
      If a product decision is missing, add an Open Questions section and choose a safe provisional default.
      Keep each full Markdown sentence on its own physical line.

      Return only JSON.
    output_format:
      type: object
      required:
        - plan_path
        - task_count
        - summary
        - open_questions_count
        - validation_commands
      properties:
        plan_path:
          type: string
        task_count:
          type: number
        summary:
          type: string
        open_questions_count:
          type: number
        validation_commands:
          type: string

  - id: review-fix-plan
    description: Review and repair the plan directly with Codex.
    provider: codex
    model: gpt-5.6-sol
    effort: xhigh
    context: fresh
    depends_on:
      - write-plan
    prompt: |
      Review and repair the Superpowers implementation plan directly.
      Do not implement code in this step.

      Plan path:
      $write-plan.output.plan_path

      Original user input:
      $ARGUMENTS

      Read the plan, repository instructions, and the source files that the plan mentions.
      Check the plan against the approved brainstorm input, repository facts, Superpowers writing-plans rules, and TDD.
      Fix every concrete issue in the plan file itself.
      Make the plan complete enough for Grok to implement without more questions.
      Add missing exact file paths, tests, commands, acceptance criteria, and implementation order.
      Keep or add a short list of verify-archon feature-map ids the later prove step should run.
      Allowed ids: discover-workflows, web-console, diagnose-install, run-deterministic-workflow, inspect-run.
      Remove vague work, placeholders, and tasks that do not match the request.
      If a decision cannot be inferred, keep an Open Questions section with a safe provisional default.
      Keep each full Markdown sentence on its own physical line.

      Return only JSON.
    output_format:
      type: object
      required:
        - plan_path
        - verdict
        - fixes_count
        - open_questions_count
        - review_report
        - summary
      properties:
        plan_path:
          type: string
        verdict:
          type: string
          enum:
            - clean
            - fixed-with-changes
            - needs-human-decision
        fixes_count:
          type: number
        open_questions_count:
          type: number
        review_report:
          type: string
        summary:
          type: string

  - id: build-ralph-prd
    description: Convert the Superpowers plan into a co-located Ralph PRD.
    depends_on:
      - review-fix-plan
    provider: omp
    model: cursor/gemini-3.8-flash
    effort: high
    context: fresh
    prompt: |
      ## Persona

      You are a SHARP SOLUTION ARCHITECT who lives by KISS and YAGNI. You do not
      invent work that isn't in the plan, and you do not drop work that is.

      ## Headless mode — NO human is available

      Resolve every decision yourself from the plan plus the actual codebase.
      Do not stop to ask.

      ## Task

      The Superpowers plan to implement is the file:

        $review-fix-plan.output.plan_path

      Convert that ENTIRE plan into a Ralph PRD so an in-parent project-aware
      Ralph loop can implement it one story per iteration. Do NOT implement the
      feature itself — only produce the PRD files.

      1. Read the plan file. Confirm it exists.
      2. Derive `<name>` as the plan filename without `.md`
         (e.g. `docs/superpowers/plans/2026-09-02-foo.md` → `2026-09-02-foo`).
      3. Create the Ralph directory next to the plans folder:
         `docs/superpowers/ralph/<name>/` via `mkdir -p`. Never `.archon/ralph/`.
      4. Break the plan into right-sized Ralph user stories — each completable in a
         single fresh-context iteration. Map the plan's TDD structure into concrete,
         pass/fail acceptance criteria. Order stories by dependency (lower priority
         runs first) and set `dependsOn` to only lower-priority story ids. No cycles,
         no forward refs.
      5. Write `docs/superpowers/ralph/<name>/prd.md` — a self-contained context
         document (overview / problem / solution, goals + success metrics, non-goals,
         technical context with real file:line references drawn from the plan, and a
         story-overview table).
      6. Write `docs/superpowers/ralph/<name>/prd.json` using EXACTLY this schema
         (story-level `passes`, all `false` at start):

         ```json
         {
           "feature": "<feature name>",
           "userStories": [
             {
               "id": "US-001",
               "title": "<short title>",
               "description": "As a..., I want..., so that...",
               "acceptanceCriteria": ["<verifiable criterion>", "..."],
               "technicalNotes": "<real files, patterns, and plan refs to follow>",
               "dependsOn": [],
               "priority": 1,
               "passes": false,
               "notes": ""
             }
           ]
         }
         ```

      7. Verify both files exist and prd.json is valid JSON whose `userStories` is a
         non-empty array with every story `passes: false`.
      8. Resolve `prd_dir` with `realpath` so it is an absolute path.

      Return only JSON.
    output_format:
      type: object
      properties:
        prd_dir:
          type: string
        slug:
          type: string
        feature:
          type: string
        story_count:
          type: number
      required: [prd_dir, slug, story_count]

  - id: validate-prd
    description: Record PRD dir and confirm prd.json is ready for Ralph.
    depends_on:
      - build-ralph-prd
    bash: |
      set -euo pipefail
      PRD_DIR=$build-ralph-prd.output.prd_dir
      if [ -z "$PRD_DIR" ] || [ ! -f "$PRD_DIR/prd.json" ]; then
        echo "ERROR: no prd.json in build-ralph-prd prd_dir ('$PRD_DIR')." >&2
        exit 1
      fi
      if [ ! -f "$PRD_DIR/prd.md" ]; then
        echo "ERROR: prd.md not found in $PRD_DIR" >&2
        exit 1
      fi
      mkdir -p "$ARTIFACTS_DIR/superpowers"
      printf '%s\n' "$PRD_DIR" > "$ARTIFACTS_DIR/superpowers/prd-dir.txt"
      echo "PRD_DIR=$PRD_DIR"
      echo "BRANCH=$(git branch --show-current)"
      TOTAL=$(jq '.userStories | length' "$PRD_DIR/prd.json")
      DONE=$(jq '[.userStories[] | select(.passes == true)] | length' "$PRD_DIR/prd.json")
      echo "STORIES_TOTAL=$TOTAL"
      echo "STORIES_DONE=$DONE"
      echo "STORIES_REMAINING=$((TOTAL - DONE))"

  - id: ralph-loop-run
    description: In-parent project-aware Ralph loop (no PR until verify-archon passes).
    depends_on:
      - validate-prd
    idle_timeout: 3600000
    provider: omp
    effort: high
    model: cursor/cursor-grok-4.6
    output_format:
      type: object
      properties:
        done:
          type: boolean
          description: true ONLY when every story in prd.json has passes true; false otherwise.
        mode:
          type: string
        story_id:
          type: string
        note:
          type: string
      required:
        - done
    loop:
      command: archon-ralph-project-aware-iteration
      fresh_context: true
      max_iterations: 35
      until_bash: |
        set -euo pipefail
        PRD_FILE="$ARTIFACTS_DIR/superpowers/prd-dir.txt"
        [ -f "$PRD_FILE" ] || exit 1
        PRD_DIR=$(cat "$PRD_FILE")
        [ -n "$PRD_DIR" ] && [ -f "$PRD_DIR/prd.json" ] || exit 1
        jq -e '.userStories | type == "array" and length > 0 and all(.[]; .passes == true)' "$PRD_DIR/prd.json" >/dev/null

  - id: select-verify-targets
    description: Choose verify-archon feature-map ids from the plan, diff, and feature map.
    depends_on:
      - ralph-loop-run
    provider: omp
    model: cursor/gemini-3.8-flash
    effort: high
    context: fresh
    prompt: |
      Choose one or more verify-archon feature-map ids to prove after this Superpowers
      implementation. Do not implement product code. Do not start Mini, PM2, or Tailscale.

      Plan path:
      $review-fix-plan.output.plan_path

      Base SHA file:
      $ARTIFACTS_DIR/superpowers/base-sha.txt

      User input:
      $ARGUMENTS

      Required reads:
      - `.cursor/skills/verify-archon/SKILL.md`
      - `.cursor/skills/verify-archon/features/README.md`
      - Every file under `.cursor/skills/verify-archon/features/`
      - The Superpowers plan
      - `git diff` from the recorded base SHA to HEAD, plus unstaged and staged changes

      Allowed ids (exact, one per line later):
      - discover-workflows
      - web-console
      - diagnose-install
      - run-deterministic-workflow
      - inspect-run

      Selection rules:
      - Pick every id whose mapped user path this change can break.
      - If anything under `packages/web` changed, include `web-console`.
      - Always include at least one id.
      - If nothing else is justified, use `discover-workflows`.
      - Prefer the smallest set that still covers the changed user paths.
      - Local bun verify only.

      Write the proposed ids (one id per line, no commentary) to
      `$ARTIFACTS_DIR/verify/feature-ids.proposed.txt`.
      A later bash node is the source of truth and may add `web-console` or the
      `discover-workflows` fallback.

      Return only JSON.
    output_format:
      type: object
      required:
        - feature_ids
        - rationale
        - web_changed
      properties:
        feature_ids:
          type: string
          description: Space- or newline-separated allowed feature-map ids.
        rationale:
          type: string
        web_changed:
          type: boolean

  - id: normalize-verify-targets
    description: Canonicalize feature-ids.txt (allowed ids, web-console rule, fallback).
    depends_on:
      - select-verify-targets
    bash: |
      set -euo pipefail
      OUT_DIR="$ARTIFACTS_DIR/verify"
      mkdir -p "$OUT_DIR"
      IDS_FILE="$OUT_DIR/feature-ids.txt"
      PROPOSED="$OUT_DIR/feature-ids.proposed.txt"
      BASE_SHA_FILE="$ARTIFACTS_DIR/superpowers/base-sha.txt"
      BASE_SHA=$(cat "$BASE_SHA_FILE")
      SELECTED=$select-verify-targets.output.feature_ids

      {
        if [ -f "$PROPOSED" ]; then
          cat "$PROPOSED"
        fi
        printf '%s\n' "$SELECTED"
      } > "$OUT_DIR/feature-ids.raw.txt"

      : > "$IDS_FILE"
      while IFS= read -r raw || [ -n "$raw" ]; do
        id=$(printf '%s' "$raw" | tr -d '\r' | awk '{print $1}')
        case "$id" in
          discover-workflows|web-console|diagnose-install|run-deterministic-workflow|inspect-run)
            if ! grep -qx "$id" "$IDS_FILE"; then
              printf '%s\n' "$id" >> "$IDS_FILE"
            fi
            ;;
        esac
      done < "$OUT_DIR/feature-ids.raw.txt"

      web_changed=0
      if git diff --name-only "$BASE_SHA" HEAD | grep -q '^packages/web/'; then
        web_changed=1
      fi
      if git diff --name-only | grep -q '^packages/web/'; then
        web_changed=1
      fi
      if git diff --name-only --cached | grep -q '^packages/web/'; then
        web_changed=1
      fi
      if [ "$web_changed" -eq 1 ] && ! grep -qx 'web-console' "$IDS_FILE"; then
        printf '%s\n' 'web-console' >> "$IDS_FILE"
      fi

      if [ ! -s "$IDS_FILE" ]; then
        printf '%s\n' 'discover-workflows' > "$IDS_FILE"
      fi

      echo "FEATURE_IDS_FILE=$IDS_FILE"
      echo "WEB_CHANGED=$web_changed"
      echo "SELECTED_IDS=$(tr '\n' ' ' < "$IDS_FILE")"
    timeout: 60000

  - id: prove
    description: Fail-closed local verify-archon prove for each selected feature-map id.
    depends_on:
      - normalize-verify-targets
      - fix-verify
    trigger_rule: one_success
    always_run: true
    timeout: 2700000
    bash: |
      set -uo pipefail

      OUT_DIR="$ARTIFACTS_DIR/verify"
      IDS_FILE="$OUT_DIR/feature-ids.txt"
      VERIFY_BIN=".cursor/skills/verify-archon/bin/verify-archon"
      mkdir -p "$OUT_DIR/evidence" "$OUT_DIR/runs"

      unset ARCHON_VERIFY_TARGET ARCHON_VERIFY_BASE_URL || true
      export ARCHON_VERIFY_TARGET=local
      export ARCHON_VERIFY_EVIDENCE="$OUT_DIR/runs"
      export ARCHON_TELEMETRY_DISABLED=1

      write_fail() {
        printf 'FAIL\n' > "$OUT_DIR/result.txt"
        printf '%s\n' "${1:-verify failed}" > "$OUT_DIR/last-error.txt"
      }

      if [ ! -f "$VERIFY_BIN" ]; then
        write_fail "missing $VERIFY_BIN"
        echo "ERROR: verify-archon helper is missing." >&2
        exit 1
      fi
      chmod +x "$VERIFY_BIN" || true

      if [ ! -f "$IDS_FILE" ] || [ ! -s "$IDS_FILE" ]; then
        printf '%s\n' 'discover-workflows' > "$IDS_FILE"
      fi

      if grep -qx 'web-console' "$IDS_FILE"; then
        if [ ! -f .cursor/skills/verify-archon/harness/package.json ]; then
          write_fail "web-console selected but harness/package.json is missing"
          echo "ERROR: Playwright harness README/package.json missing for web-console." >&2
          exit 1
        fi
        echo "Installing verify-archon Playwright harness deps (web-console)." >&2
        if ! (cd .cursor/skills/verify-archon/harness && bun install) >&2; then
          write_fail "bun install failed in verify-archon/harness"
          exit 1
        fi
      fi

      : > "$OUT_DIR/exit-codes.txt"
      failed=0
      while IFS= read -r id || [ -n "$id" ]; do
        id=$(printf '%s' "$id" | tr -d '\r')
        [ -z "$id" ] && continue
        case "$id" in
          \#*) continue ;;
        esac
        echo "verify-archon prove $id" >&2
        set +e
        "$VERIFY_BIN" prove "$id"
        code=$?
        set -e
        printf '%s=%s\n' "$id" "$code" >> "$OUT_DIR/exit-codes.txt"

        dest="$OUT_DIR/evidence/$id"
        mkdir -p "$dest"
        src_last="$OUT_DIR/runs/last-proof/$id"
        if [ ! -d "$src_last" ]; then
          src_last=".cursor/skills/verify-archon/evidence/last-proof/$id"
        fi
        if [ -d "$src_last" ]; then
          cp -a "$src_last/." "$dest/"
        fi
        if [ "$code" -ne 0 ]; then
          failed=1
          printf 'prove %s exited %s\n' "$id" "$code" > "$OUT_DIR/last-error.txt"
        fi
      done < "$IDS_FILE"

      {
        echo '{'
        echo "  \"gate\": \"$([ "$failed" -eq 0 ] && echo PASS || echo FAIL)\","
        echo "  \"ids_file\": \"$IDS_FILE\","
        echo "  \"evidence_dir\": \"$OUT_DIR/evidence\","
        echo "  \"exit_codes_file\": \"$OUT_DIR/exit-codes.txt\""
        echo '}'
      } > "$OUT_DIR/result.json"

      if [ "$failed" -eq 0 ]; then
        printf 'PASS\n' > "$OUT_DIR/result.txt"
        echo "All selected verify-archon ids passed." >&2
        exit 0
      fi
      printf 'FAIL\n' > "$OUT_DIR/result.txt"
      echo "One or more verify-archon prove commands failed. See $OUT_DIR/exit-codes.txt" >&2
      exit 1

  - id: record-verify
    description: Read prove artifacts and emit PASS or FAIL for the route_loop gate.
    depends_on:
      - prove
    trigger_rule: all_done
    always_run: true
    bash: |
      set -euo pipefail
      RESULT="$ARTIFACTS_DIR/verify/result.txt"
      if [ -f "$RESULT" ]; then
        gate=$(tr -d '\r\n' < "$RESULT")
      else
        gate=FAIL
        printf 'FAIL\n' > "$RESULT"
      fi
      case "$gate" in
        PASS|FAIL) ;;
        *)
          gate=FAIL
          printf 'FAIL\n' > "$RESULT"
          ;;
      esac
      printf '%s\n' "$gate"
    timeout: 30000

  - id: verify-gate
    description: PASS → PR; FAIL → fix-verify (max 3); exhaustion → blocked report.
    depends_on:
      - record-verify
    route_loop:
      condition: "$record-verify.output == 'PASS'"
      max_iterations: 3
      routes:
        positive: create-pull-request
        negative: fix-verify
        exhausted: verify-blocked

  - id: fix-verify
    description: Fix product code (or harness drift) from failing verify-archon evidence.
    provider: omp
    model: cursor/gpt-5.6-sol
    effort: xhigh
    context: fresh
    idle_timeout: 3600000
    when: "$record-verify.output == 'FAIL'"
    prompt: |
      verify-archon prove failed. Fix the product so the next prove pass can succeed.
      Do not create a pull request.
      Do not start, stop, or talk to Mini / PM2 / Tailscale.
      Local bun verify only.

      User input:
      $ARGUMENTS

      Plan path:
      $review-fix-plan.output.plan_path

      Feature ids file:
      $ARTIFACTS_DIR/verify/feature-ids.txt

      Result file:
      $ARTIFACTS_DIR/verify/result.txt

      Exit codes:
      $ARTIFACTS_DIR/verify/exit-codes.txt

      Last error:
      $ARTIFACTS_DIR/verify/last-error.txt

      Evidence directory:
      $ARTIFACTS_DIR/verify/evidence/

      Required reads before editing:
      - `.cursor/skills/verify-archon/SKILL.md`
      - `.cursor/skills/verify-archon/features/README.md`
      - The feature files for every id in `$ARTIFACTS_DIR/verify/feature-ids.txt`
      - Every `summary.json`, `PROOF.md`, `ui-assertions.json`, and failing transcript
        under `$ARTIFACTS_DIR/verify/evidence/`
      - The Superpowers plan and the current git diff

      Rules:
      - Prefer a product-code fix when observed behavior is wrong.
      - Edit the verify-archon harness or feature map only when the product is
        correct and the map/harness drifted.
      - Do not weaken assertions to get a green proof.
      - Do not change selected feature ids unless an id is invalid; the bash
        normalize node already applied the web-console and fallback rules.
      - After edits, write `$ARTIFACTS_DIR/verify/fix-report.md` describing
        files changed, why, and which asserts you expect to pass next.
      - Leave the next `prove` node to re-run `verify-archon prove`.

      Return only JSON.
    output_format:
      type: object
      required:
        - fixed
        - files_changed
        - fix_kind
        - summary
      properties:
        fixed:
          type: boolean
        files_changed:
          type: string
        fix_kind:
          type: string
          enum:
            - product
            - harness
            - mixed
        summary:
          type: string

  - id: create-pull-request
    description: Create the pull request only after verify-archon PASS.
    command: archon-create-pr
    provider: omp
    model: cursor/gemini-3.8-flash
    effort: high
    context: fresh
    idle_timeout: 900000
    depends_on:
      - verify-gate
    output_type: pull-request
    prompt_suffix: |
      ## verify-archon proof (required in the PR body)

      This Superpowers run must not look like an unverified feature PR.

      Read and cite:
      - Feature ids: `$ARTIFACTS_DIR/verify/feature-ids.txt`
      - Gate: `$ARTIFACTS_DIR/verify/result.txt` (must be PASS)
      - Exit codes: `$ARTIFACTS_DIR/verify/exit-codes.txt`
      - Evidence: `$ARTIFACTS_DIR/verify/evidence/<id>/`
      - Plan: `$review-fix-plan.output.plan_path`

      In the PR body Validation section, list every proved feature-map id and the
      matching evidence path under `$ARTIFACTS_DIR/verify/evidence/`.
      State that positive path = prove passed; negative path = fix then re-prove
      (max 3); this PR exists only because the gate is PASS.
      Do not claim Mini/PM2/Tailscale was used.

  - id: verify-blocked
    description: Exhausted fix budget — write a blocked report and stop (no green PR).
    depends_on:
      - verify-gate
    bash: |
      set -euo pipefail
      OUT_DIR="$ARTIFACTS_DIR/verify"
      REPORT="$OUT_DIR/BLOCKED.md"
      IDS_FILE="$OUT_DIR/feature-ids.txt"
      RESULT_FILE="$OUT_DIR/result.txt"
      CODES_FILE="$OUT_DIR/exit-codes.txt"
      ERR_FILE="$OUT_DIR/last-error.txt"
      EVIDENCE_DIR="$OUT_DIR/evidence"

      {
        echo "# verify-archon gate blocked"
        echo
        echo "The fix → re-prove route_loop exhausted its budget (max 3)."
        echo "No pull request was created."
        echo
        echo "## Selected feature ids"
        if [ -f "$IDS_FILE" ]; then
          cat "$IDS_FILE"
        else
          echo "(missing $IDS_FILE)"
        fi
        echo
        echo "## Last gate"
        if [ -f "$RESULT_FILE" ]; then
          cat "$RESULT_FILE"
        else
          echo "FAIL (result.txt missing)"
        fi
        echo
        echo "## Exit codes"
        if [ -f "$CODES_FILE" ]; then
          cat "$CODES_FILE"
        else
          echo "(missing $CODES_FILE)"
        fi
        echo
        echo "## Last error"
        if [ -f "$ERR_FILE" ]; then
          cat "$ERR_FILE"
        else
          echo "(none recorded)"
        fi
        echo
        echo "## Evidence"
        echo "$EVIDENCE_DIR"
        if [ -d "$EVIDENCE_DIR" ]; then
          find "$EVIDENCE_DIR" -type f | sort
        fi
      } > "$REPORT"

      echo "VERIFY_BLOCKED_REPORT=$REPORT"
      echo "verify-archon fix budget exhausted. See $REPORT" >&2
      exit 1
    timeout: 60000
