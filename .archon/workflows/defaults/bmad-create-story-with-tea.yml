name: bmad-create-story-with-tea
description: |
  Use when: User provides a BMAD story_name/story selector and wants to create that story, validate readiness, then run TEA test design and ATDD before dev.
  Triggers: "bmad create story with tea <story_name>", "create bmad story with tea <story_name>", "CS VS TD AT <story_name>".
  Does: Triggers existing BMAD and TEA commands in order against the user-provided story_name, passes the created story_file into the readiness gate, risk-based test design, red ATDD generation, then creates the pull request.
  NOT for: Implementing the story or running post-dev review and fix loops.

provider: codex
effort: xhigh
model: gpt-5.5
tags: [BMad, TEA, Planning]

nodes:
  - id: validate-story-name-input
    bash: |
      set -e

      if [ -z "${ARGUMENTS:-}" ]; then
        echo "Missing required story_name input."
        echo "Run this workflow with a BMAD story key, story id, title, or story file path."
        exit 1
      fi

      for required in \
        ".agents/skills/bmad-create-story/SKILL.md" \
        ".agents/skills/bmad-create-story/scripts/validate_story_readiness.py" \
        ".agents/skills/bmad-testarch-test-design/SKILL.md" \
        ".agents/skills/bmad-testarch-atdd/SKILL.md" \
        "_bmad/bmm/config.yaml" \
        "_bmad/tea/config.yaml"
      do
        if [ ! -f "$required" ]; then
          echo "Missing required BMAD or TEA file: $required"
          echo "Run this workflow from a BMAD-enabled project checkout."
          exit 1
        fi
      done

      echo "story_name=$ARGUMENTS"
    timeout: 60000
    output_type: story-name-input

  - id: create-story
    prompt: |
      Act as the story author. Keep validation independent.

      Inspect `$ARTIFACTS_DIR/story-readiness/latest.json` first.
      - If it does not exist, run `$bmad-create-story create $ARGUMENTS`.
      - If it exists with `gate: FAIL`, run `$bmad-create-story repair <report.story_file> $ARTIFACTS_DIR/story-readiness/latest.json`.
      - If it exists with `gate: BLOCKED`, stop with the blocker; do not invent a decision, scope, or owner.

      Read every source required by the skill. Return the skill's structured result.
    provider: codex
    depends_on: [validate-story-name-input]
    context: fresh
    model: gpt-5.5
    idle_timeout: 900000
    output_format:
      type: object
      properties:
        story_name:
          type: string
        status:
          type: string
          enum: [draft, repaired, blocked]
        story_key:
          type: string
        story_file:
          type: string
        sprint_status:
          type: string
        validation_summary:
          type: string
        risk_profile:
          type: array
          items:
            type: string
      required:
        - status
        - story_name
        - story_key
        - story_file
        - sprint_status
        - validation_summary
        - risk_profile
    output_type: create-story

  - id: record-story-readiness-state
    depends_on: [create-story]
    script: |
      import { createHash } from "node:crypto";
      import { existsSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
      import { dirname, join } from "node:path";

      const storyFile = $create-story.output.story_file;
      const authorStatus = $create-story.output.status;
      if (authorStatus === "blocked") {
        throw new Error("BMAD create-story is blocked by unresolved authority, scope, or ownership; inspect the create-story node output");
      }
      if (!existsSync(storyFile)) throw new Error("Created story file is missing");

      const statePath = join(process.env.ARTIFACTS_DIR, "story-readiness", "state.json");
      const state = existsSync(statePath)
        ? JSON.parse(readFileSync(statePath, "utf8"))
        : { lastStoryHash: "" };
      const storyHash = createHash("sha256").update(readFileSync(storyFile)).digest("hex");
      if (authorStatus === "repaired" && state.lastStoryHash === storyHash) {
        throw new Error("Story repair produced no content diff; stopping readiness loop");
      }
      state.lastStoryHash = storyHash;
      mkdirSync(dirname(statePath), { recursive: true });
      writeFileSync(statePath, `${JSON.stringify(state, null, 2)}\n`);
      console.log(JSON.stringify({ storyFile, authorStatus, storyHash }));
    runtime: bun
    timeout: 60000
    output_type: story-readiness-state

  - id: validate-story-readiness
    prompt: |
      $bmad-create-story validate $create-story.output.story_file

      This is an independent fresh-context gate.
      Write the exact returned object to `$ARTIFACTS_DIR/story-readiness/latest.json`.
      Return PASS only with zero findings and full deterministic coverage.
    provider: codex
    depends_on: [record-story-readiness-state]
    context: fresh
    model: gpt-5.5
    output_format: &story_readiness_gate_schema
      type: object
      properties:
        gate:
          type: string
          enum: [PASS, FAIL, BLOCKED]
        story_file:
          type: string
        findings_count:
          type: number
        findings:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              fingerprint:
                type: string
              severity:
                type: string
                enum: [critical, high, medium, low]
              invariant:
                type: string
              surface:
                type: string
              problem:
                type: string
              evidence:
                type: array
                items:
                  type: string
              required_fix:
                type: string
              authority:
                type: string
              repairable:
                type: boolean
            required: [id, fingerprint, severity, invariant, surface, problem, evidence, required_fix, authority, repairable]
        decision_coverage:
          type: string
        ac_coverage:
          type: string
        invariant_coverage:
          type: string
        summary:
          type: string
      required: [gate, story_file, findings_count, findings, decision_coverage, ac_coverage, invariant_coverage, summary]
    output_type: story-readiness-gate

  - id: persist-story-readiness-report
    depends_on: [validate-story-readiness]
    script: |
      import { existsSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
      import { dirname, join } from "node:path";

      const report = $validate-story-readiness.output;
      const reportPath = join(process.env.ARTIFACTS_DIR, "story-readiness", "latest.json");
      const previousReport = existsSync(reportPath)
        ? JSON.parse(readFileSync(reportPath, "utf8"))
        : null;
      const fingerprint = candidate => [...new Set((candidate?.findings ?? []).map(finding => finding.fingerprint).filter(Boolean))]
        .sort()
        .join("|");
      mkdirSync(dirname(reportPath), { recursive: true });
      writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`);
      const currentFingerprint = fingerprint(report);
      if (
        report.gate === "FAIL" &&
        previousReport?.gate === "FAIL" &&
        currentFingerprint &&
        currentFingerprint === fingerprint(previousReport)
      ) {
        throw new Error(`Story readiness findings repeated after repair: ${currentFingerprint}`);
      }
      console.log(report.gate);
    runtime: bun
    timeout: 60000
    output_type: story-readiness-report

  - id: story-readiness-gate
    depends_on: [persist-story-readiness-report]
    route_loop:
      condition: "$persist-story-readiness-report.output == 'PASS'"
      max_iterations: 3
      routes:
        positive: design-risk-based-tests
        negative: create-story
        exhausted: story-readiness-error

  - id: design-risk-based-tests
    prompt: |
      $bmad-testarch-test-design $create-story.output.story_file
      Run the workflow as a Master Test Architect.
      In Step 3 risk assessment:
      - Treat every known reviewer concern as evidence, not optional advice.
      - Convert each concern into a risk or explicit non-risk with rationale.
      - Score probability and impact.
      - Mark P0/P1 when the issue can break core behavior, security, data integrity, compatibility, or cross-process contract behavior.

      In Step 4 coverage plan:
      - Every acceptance criterion must map to atomic test scenarios.
      - Every high-risk item must map to P0/P1 scenarios.
      - Every known reviewer concern must map to scenarios or explicit waiver.
      - Include happy path, negative path, boundary cases, malformed input, stale data, duplicate actions, out-of-order events, partial failure, dependency failure, timeout, cancellation, concurrency/
      race, rollback, permission/auth, and regression cases where applicable.
      - Use the project’s real test levels and existing test patterns.
      - Avoid duplicate coverage unless the risk justifies multiple levels.

      Mandatory output rule:
      For every acceptance criterion, high-risk item, and reviewer concern:
      - create a scenario, or
      - write a waiver with reason, owner, residual risk, and follow-up trigger.

      Do not stop at happy paths.
      Do not mark coverage complete if P0/P1 edge cases are only implied.
    provider: codex
    depends_on: [story-readiness-gate]
    context: fresh
    model: gpt-5.5
    output_type: risk-based-test-design

  - id: story-readiness-error
    depends_on: [story-readiness-gate]
    bash: |
      set -euo pipefail

      REPORT="$ARTIFACTS_DIR/story-readiness/latest.json"
      echo "BMAD story readiness did not pass within the repair budget."
      echo "Report: $REPORT"
      if [ -f "$REPORT" ]; then
        cat "$REPORT"
      fi
      exit 1
    timeout: 60000
    output_type: story-readiness-error

  - id: generate-red-acceptance-tests
    prompt: |
      $bmad-testarch-atdd $create-story.output.story_file
      Generate red-phase acceptance scaffolds only.
      Do not implement production code.

      Use the repository’s existing test framework, directories, helpers, and naming patterns discovered during preflight.
      Do not blindly use generic `tests/api` or Playwright examples if the project uses another structure.

      Mandatory mapping:
      - Every P0/P1 scenario from the TD artifact must become one of:
        - executable red test,
        - skipped red scaffold with expected failure reason,
        - waiver with reason, owner, residual risk, and follow-up trigger.
      - Every known reviewer concern must be represented the same way.
      - Every acceptance criterion must be traceable to generated tests or waiver.

      Red-phase requirements:
      - Use `test.skip()` only when the target module, route, harness, or dependency seam does not exist yet.
      - Prefer executable red tests when the boundary already exists.
      - Each skipped scaffold must state why it is skipped and what implementation should make it activatable.
      - Assertions must describe expected behavior, not placeholders.
      - Add deterministic fixtures, builders, spies, mutation counters, or sentinels where needed.

      Coverage requirements:
      - Include API/contract tests for cross-process or service contracts.
      - Include E2E or first-party consumer scaffolds when the story exposes behavior through a real user/client surface.
      - For non-UI backend/API stories, browser UI E2E can be N/A, but first-party consumer E2E must be generated or explicitly waived.
      - Include no-side-effect checks when behavior is preview/read-only.
      - Include malformed input, stale state, dependency failure, concurrency/race, and regression cases when present in TD P0/P1.

      Completion:
      - Produce the ATDD checklist.
      - List generated files.
      - List skipped scaffolds and expected failure reasons.
      - List waivers with owner and residual risk.
      - Provide exact commands to run the generated tests.
    provider: codex
    depends_on: [design-risk-based-tests]
    context: fresh
    model: gpt-5.5
    output_type: red-acceptance-tests

  - id: create-pull-request
    command: archon-create-pr
    provider: codex
    depends_on: [generate-red-acceptance-tests]
    context: fresh
    model: gpt-5.5
    idle_timeout: 900000
    output_type: pull-request
