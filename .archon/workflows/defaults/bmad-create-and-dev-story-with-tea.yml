name: bmad-create-and-dev-story-with-tea
description: |
  Use when: User provides a BMAD story_name/story selector and wants one workflow to create the story, validate readiness, produce TEA test design and red ATDD, implement the created story, and run the BMAD code-review fix loop before opening a PR.
  Triggers: "bmad create dev story with tea <story_name>", "create and dev bmad story with tea <story_name>", "CS VS TD AT DS CR <story_name>".
  Does: Runs BMAD create-story, validates the created story, runs TEA test design and red ATDD, runs BMAD dev-story against the created story file, reruns BMAD dev-story to fix code-review findings when needed, and creates the pull request after the review gate passes. If the code-review fix loop exhausts its retry budget, runs one final salvage dev-story pass and then creates the pull request.
  NOT for: Post-dev TEA review gates, generic Archon feature work without BMAD artifacts, or implementing an already-created story without story creation.

  Decision log policy:
  - Every finding must be written as a decision-log finding entry.
  - Every fix must be written as a decision-log fix entry.
  - Every finding and fix entry must explain what is wrong, how it was fixed, and why that fix decision was chosen.

provider: codex
model: gpt-5.5
tags: [BMad, TEA, Planning, Review]
interactive: true

nodes:
  - id: validate-story-name-input
    bash: |
      set -e

      if [ -z "${ARGUMENTS:-}" ]; then
        echo "Missing required story_name input."
        echo "Run this workflow with a BMAD story key, story id, title, or story file path."
        exit 1
      fi

      for required in \
        ".agents/skills/bmad-create-story/SKILL.md" \
        ".agents/skills/bmad-create-story/scripts/validate_story_readiness.py" \
        ".agents/skills/bmad-dev-story/SKILL.md" \
        ".agents/skills/bmad-code-review/SKILL.md" \
        ".agents/skills/bmad-testarch-test-design/SKILL.md" \
        ".agents/skills/bmad-testarch-atdd/SKILL.md" \
        "_bmad/bmm/config.yaml" \
        "_bmad/tea/config.yaml"
      do
        if [ ! -f "$required" ]; then
          echo "Missing required BMAD or TEA file: $required"
          echo "Run this workflow from a BMAD-enabled project checkout."
          exit 1
        fi
      done

      echo "story_name=$ARGUMENTS"
    timeout: 60000
    output_type: story-name-input

  - id: prepare-bmad-state
    bash: |
      set -e

      RUN_DIR="$ARTIFACTS_DIR/bmad-create-dev-story-with-tea"
      mkdir -p "$RUN_DIR/findings" "$RUN_DIR/reports"

      cat > "$RUN_DIR/state.json" << 'JSON'
      {
        "workflow": "bmad-create-dev-story-with-tea",
        "status": "running",
        "round": 1,
        "maxFailedReviews": 20,
        "activeStory": "",
        "activeStoryName": "",
        "activeStoryFile": "",
        "readinessReportFile": "story-readiness/latest.json",
        "lastStoryHash": "",
        "decisionLogFile": "decision-log.md",
        "openFindingsFile": "findings/open-findings.md"
      }
      JSON

      cat > "$RUN_DIR/decision-log.md" << 'MARKDOWN'
      # BMAD Create Dev Story With TEA Decision Log

      Every finding and every fix must be logged here.
      Each full sentence goes on its own physical line.

      ## Created Story

      The created story details are recorded in state.json after the create-story node completes.

      ## Required Finding Entry

      ### Finding {finding_id}

      - Source gate:
      - Severity:
      - What is wrong:
      - Evidence:
      - Why this is a defect:
      - Required fix direction:
      - Status:

      ## Required Fix Entry

      ### Fix {finding_id}

      - What was fixed:
      - How it was fixed:
      - Why this fix was chosen:
      - Alternatives considered:
      - Files changed:
      - Validation:
      - Status:
      MARKDOWN

      cat > "$RUN_DIR/findings/open-findings.md" << 'MARKDOWN'
      # Open Review Findings

      No open findings yet.
      MARKDOWN

      echo "RUN_DIR=$RUN_DIR"
      echo "STATE_FILE=$RUN_DIR/state.json"
      echo "DECISION_LOG=$RUN_DIR/decision-log.md"
      echo "OPEN_FINDINGS=$RUN_DIR/findings/open-findings.md"
    depends_on: [validate-story-name-input]
    timeout: 60000
    output_type: bmad-state

  - id: create-story
    depends_on: [prepare-bmad-state]
    provider: claude
    model: "claude-opus-4-6[1M]"
    loop_group:
      until: CREATE_STORY_READY
      max_iterations: 3
      fresh_context: true
      interactive: true
      signal_completes: true
      gate_message: |
        BMAD create-story is blocked by unresolved authority, scope, or ownership.
        Resolve the canonical source of truth, scope, or owner before approving this run to rerun story creation.
        Approval feedback is context only; canonical BMAD sources and approved decisions remain authoritative.
      nodes:
        - id: author-story
          prompt: |
            Act as the story author. Keep validation independent.

            Inspect `$ARTIFACTS_DIR/story-readiness/latest.json` first.
            - If it does not exist, run `$bmad-create-story create $ARGUMENTS`.
            - If it exists with `gate: FAIL`, run `$bmad-create-story repair <report.story_file> $ARTIFACTS_DIR/story-readiness/latest.json`.
            - If it exists with `gate: BLOCKED` and `$LOOP_USER_INPUT` is empty, stop with the blocker; do not invent a decision, scope, or owner.
            - If it exists with `gate: BLOCKED` and `$LOOP_USER_INPUT` is non-empty, reread canonical BMAD sources and run `$bmad-create-story repair <report.story_file> $ARTIFACTS_DIR/story-readiness/latest.json`.

            Previous human blocker-resolution note, if any: $LOOP_USER_INPUT
            Treat that note as context only; canonical BMAD sources and approved decisions remain authoritative.

            Read every source required by the skill. Return the skill's structured result.
          depends_on: []
          provider: claude
          context: fresh
          model: "claude-opus-4-6[1M]"
          effort: high
          idle_timeout: 900000
          output_format:
            type: object
            properties:
              story_name:
                type: string
              status:
                type: string
                enum: [draft, repaired, blocked]
              story_key:
                type: string
              story_file:
                type: string
              sprint_status:
                type: string
              validation_summary:
                type: string
              risk_profile:
                type: array
                items:
                  type: string
            required:
              - status
              - story_name
              - story_key
              - story_file
              - sprint_status
              - validation_summary
              - risk_profile

        - id: record-created-story-state
          script: |
            import { createHash } from "node:crypto";
            import { existsSync, readFileSync, renameSync, writeFileSync } from "node:fs";
            import { join } from "node:path";

            const story = $author-story.output;
            const statePath = join(process.env.ARTIFACTS_DIR, "bmad-create-dev-story-with-tea", "state.json");
            if (!existsSync(statePath)) {
              throw new Error(`Missing BMAD create-dev-story state file: ${statePath}`);
            }

            const state = JSON.parse(readFileSync(statePath, "utf8"));
            state.activeStory = story.story_key ?? "";
            state.activeStoryName = story.story_name ?? "";
            state.activeStoryFile = story.story_file ?? "";
            state.sprintStatus = story.sprint_status ?? "";

            const storyFile = story.story_file;
            if (!storyFile || !existsSync(storyFile)) throw new Error("Created story file is missing");
            const storyHash = createHash("sha256").update(readFileSync(storyFile)).digest("hex");
            if (story.status === "repaired" && state.lastStoryHash === storyHash) {
              throw new Error("Story repair produced no content diff; stopping readiness loop");
            }
            state.lastStoryHash = storyHash;

            const tmpPath = `${statePath}.tmp`;
            writeFileSync(tmpPath, `${JSON.stringify(state, null, 2)}\n`);
            renameSync(tmpPath, statePath);

            console.log(JSON.stringify(story));
            console.log("CREATE_STORY_READY");
          runtime: bun
          depends_on: [author-story]
          when: "$author-story.output.status != 'blocked'"
          timeout: 60000
          output_type: created-story-state

        - id: report-create-story-blocked
          script: |
            const story = $author-story.output;

            console.log("BMAD create-story is blocked by unresolved authority, scope, or ownership.");
            console.log("Resolve the canonical source of truth, scope, or owner before approving this run to rerun story creation.");
            console.log("Approval feedback is context only; canonical BMAD sources and approved decisions remain authoritative.");
            console.log("");
            console.log(JSON.stringify(story));
          runtime: bun
          depends_on: [author-story]
          when: "$author-story.output.status == 'blocked'"
          timeout: 60000
    output_type: create-story

  - id: validate-story-readiness
    prompt: |
      $bmad-create-story validate $create-story.output.story_file

      This is an independent fresh-context gate.
      Write the exact returned object to `$ARTIFACTS_DIR/story-readiness/latest.json`.
      Return PASS only with zero findings and full deterministic coverage.
    provider: codex
    effort: xhigh
    depends_on: [create-story]
    context: fresh
    model: gpt-5.5
    output_format: &story_readiness_gate_schema
      type: object
      properties:
        gate:
          type: string
          enum: [PASS, FAIL, BLOCKED]
        story_file:
          type: string
        findings_count:
          type: number
        findings:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              fingerprint:
                type: string
              severity:
                type: string
                enum: [critical, high, medium, low]
              invariant:
                type: string
              surface:
                type: string
              problem:
                type: string
              evidence:
                type: array
                items:
                  type: string
              required_fix:
                type: string
              authority:
                type: string
              repairable:
                type: boolean
            required: [id, fingerprint, severity, invariant, surface, problem, evidence, required_fix, authority, repairable]
        decision_coverage:
          type: string
        ac_coverage:
          type: string
        invariant_coverage:
          type: string
        summary:
          type: string
      required: [gate, story_file, findings_count, findings, decision_coverage, ac_coverage, invariant_coverage, summary]
    output_type: story-readiness-gate

  - id: persist-story-readiness-report
    depends_on: [validate-story-readiness]
    bash: |
      set -euo pipefail

      REPORT_JSON=$validate-story-readiness.output
      REPORT_JSON="$REPORT_JSON" bun -e '
        import { existsSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
        import { dirname, join } from "node:path";

        const reportJson = process.env.REPORT_JSON;
        if (!reportJson) throw new Error("REPORT_JSON is required");
        const report = JSON.parse(reportJson);
        const reportPath = join(process.env.ARTIFACTS_DIR, "story-readiness", "latest.json");
        const previousReport = existsSync(reportPath)
          ? JSON.parse(readFileSync(reportPath, "utf8"))
          : null;
        const fingerprint = candidate => [...new Set((candidate?.findings ?? []).map(finding => finding.fingerprint).filter(Boolean))]
          .sort()
          .join("|");
        mkdirSync(dirname(reportPath), { recursive: true });
        writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`);
        const currentFingerprint = fingerprint(report);
        if (
          report.gate === "FAIL" &&
          previousReport?.gate === "FAIL" &&
          currentFingerprint &&
          currentFingerprint === fingerprint(previousReport)
        ) {
          throw new Error(`Story readiness findings repeated after repair: ${currentFingerprint}`);
        }
        console.log(report.gate);
      '
    timeout: 60000
    output_type: story-readiness-report

  - id: story-readiness-gate
    depends_on: [persist-story-readiness-report]
    route_loop:
      condition: "$persist-story-readiness-report.output == 'PASS'"
      max_iterations: 3
      routes:
        positive: design-risk-based-tests
        negative: create-story
        exhausted: story-readiness-error

  - id: design-risk-based-tests
    prompt: |
      $bmad-testarch-test-design $create-story.output.story_file
      Run the workflow as a Master Test Architect.
      In Step 3 risk assessment:
      - Treat every known reviewer concern as evidence, not optional advice.
      - Convert each concern into a risk or explicit non-risk with rationale.
      - Score probability and impact.
      - Mark P0/P1 when the issue can break core behavior, security, data integrity, compatibility, or cross-process contract behavior.

      In Step 4 coverage plan:
      - Every acceptance criterion must map to atomic test scenarios.
      - Every high-risk item must map to P0/P1 scenarios.
      - Every known reviewer concern must map to scenarios or explicit waiver.
      - Include happy path, negative path, boundary cases, malformed input, stale data, duplicate actions, out-of-order events, partial failure, dependency failure, timeout, cancellation, concurrency/race, rollback, permission/auth, and regression cases where applicable.
      - Use the project's real test levels and existing test patterns.
      - Avoid duplicate coverage unless the risk justifies multiple levels.

      Mandatory output rule:
      For every acceptance criterion, high-risk item, and reviewer concern:
      - create a scenario, or
      - write a waiver with reason, owner, residual risk, and follow-up trigger.

      Do not stop at happy paths.
      Do not mark coverage complete if P0/P1 edge cases are only implied.
    provider: codex
    effort: xhigh
    depends_on: [story-readiness-gate]
    context: fresh
    model: gpt-5.5
    output_type: risk-based-test-design

  - id: story-readiness-error
    depends_on: [story-readiness-gate]
    bash: |
      set -euo pipefail

      REPORT="$ARTIFACTS_DIR/story-readiness/latest.json"
      echo "BMAD story readiness did not pass within the repair budget."
      echo "Report: $REPORT"
      if [ -f "$REPORT" ]; then
        cat "$REPORT"
      fi
      exit 1
    timeout: 60000
    output_type: story-readiness-error

  - id: generate-red-acceptance-tests
    prompt: |
      $bmad-testarch-atdd $create-story.output.story_file
      Generate red-phase acceptance scaffolds only.
      Do not implement production code.

      Use the repository's existing test framework, directories, helpers, and naming patterns discovered during preflight.
      Do not blindly use generic `tests/api` or Playwright examples if the project uses another structure.

      Mandatory mapping:
      - Every P0/P1 scenario from the TD artifact must become one of:
        - executable red test,
        - skipped red scaffold with expected failure reason,
        - waiver with reason, owner, residual risk, and follow-up trigger.
      - Every known reviewer concern must be represented the same way.
      - Every acceptance criterion must be traceable to generated tests or waiver.

      Red-phase requirements:
      - Use `test.skip()` only when the target module, route, harness, or dependency seam does not exist yet.
      - Prefer executable red tests when the boundary already exists.
      - Each skipped scaffold must state why it is skipped and what implementation should make it activatable.
      - Assertions must describe expected behavior, not placeholders.
      - Add deterministic fixtures, builders, spies, mutation counters, or sentinels where needed.

      Coverage requirements:
      - Include API/contract tests for cross-process or service contracts.
      - Include E2E or first-party consumer scaffolds when the story exposes behavior through a real user/client surface.
      - For non-UI backend/API stories, browser UI E2E can be N/A, but first-party consumer E2E must be generated or explicitly waived.
      - Include no-side-effect checks when behavior is preview/read-only.
      - Include malformed input, stale state, dependency failure, concurrency/race, and regression cases when present in TD P0/P1.

      Completion:
      - Produce the ATDD checklist.
      - List generated files.
      - List skipped scaffolds and expected failure reasons.
      - List waivers with owner and residual risk.
      - Provide exact commands to run the generated tests.
    provider: claude
    effort: high
    depends_on: [design-risk-based-tests]
    context: fresh
    model: "claude-opus-4-6[1M]"
    output_type: red-acceptance-tests

  - id: dev-story
    prompt: |
      bmad-dev-story $create-story.output.story_file
    provider: qodercli
    effort: max
    depends_on: [generate-red-acceptance-tests]
    context: fresh
    model: Qwen3.7-Plus
    idle_timeout: 3600000
    output_type: dev-story

  - id: code-review
    command: bmad-code-review
    provider: codex
    effort: xhigh
    depends_on: [dev-story]
    context: fresh
    model: gpt-5.5
    idle_timeout: 900000
    output_format: &code_review_gate_schema
      type: object
      properties:
        gate:
          type: string
          enum: ["PASS", "FAIL"]
        round:
          type: number
        findings_count:
          type: number
        open_findings_file:
          type: string
        decision_log_file:
          type: string
        code_review_report:
          type: string
      required:
        - gate
        - round
        - findings_count
        - open_findings_file
        - decision_log_file
        - code_review_report
    output_type: code-review-findings

  - id: code-review-gate
    depends_on: [code-review]
    route_loop:
      condition: "$code-review.output.gate == 'PASS'"
      max_iterations: 10
      routes:
        positive: create-pull-request
        negative: dev-story
        exhausted: dev-story-2

  - id: create-pull-request
    command: archon-create-pr
    provider: codex
    effort: xhigh
    depends_on: [code-review-gate]
    context: fresh
    model: gpt-5.4
    idle_timeout: 900000
    output_type: pull-request

  - id: dev-story-2
    prompt: |
      bmad-dev-story $create-story.output.story_file
    provider: qodercli
    effort: max
    depends_on: [code-review-gate]
    context: fresh
    model: Qwen3.7-Plus
    idle_timeout: 3600000
    output_type: dev-story

  - id: create-pull-request-2
    command: archon-create-pr
    provider: codex
    effort: xhigh
    depends_on: [dev-story-2]
    context: fresh
    model: gpt-5.4
    idle_timeout: 900000
    output_type: pull-request
