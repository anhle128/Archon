name: harness-service-sync-upstream
description: |
  Use when: User wants to port one upstream grok-build commit from a
            harness-service GitHub issue into that repo and open a PR.
            Run from the harness-service checkout (cwd), not the Archon repo.
  Triggers: "sync upstream", "sync upstream commit", "port upstream",
            "harness-service-sync-upstream", "sync grok-build commit",
            "port grok-build", "upstream issue", "upstream-sync issue".
  Does: Parse the GitHub issue URL -> read the grok-build commit from the
        issue body -> fetch the exact object -> run sync-upstream-commit
        (adapt to Gigo, GitNexus impact, coverage, manifest + report,
        commit) -> cargo clean -> create PR into develop that closes the issue.
  NOT for: Intake/ticketizing a commit (scripts/upstream_sync/run_intake.py),
            validating an existing PR (harness-validate-feature-pr),
            bulk-sync of a commit range, or Archon-the-product work.
  Prereq: Codex skill `sync-upstream-commit` installed
          (~/.codex/skills/sync-upstream-commit). GitHub identity for gh.
  Input: A GitHub issue URL from oceanlabs-holding/x10.gigo.harness-service
         (preferred). The issue body must contain the grok-build commit URL
         (intake format: `- Upstream: https://github.com/xai-org/grok-build/commit/<sha>`).
         Example: https://github.com/oceanlabs-holding/x10.gigo.harness-service/issues/176
         Fallback: a raw grok-build commit URL or SHA.
provider: codex
effort: xhigh
requires: [github]

nodes:
  - id: setup
    bash: |
      set -euo pipefail

      echo "=== HARNESS-SERVICE UPSTREAM SYNC ==="
      echo "ARGUMENTS=$ARGUMENTS"
      echo "PROJECT_ROOT=$(pwd)"
      echo "HEAD=$(git rev-parse --short HEAD 2>/dev/null || echo 'no-git')"
      echo "BASE_BRANCH=${BASE_BRANCH:-develop}"
      echo "ARTIFACTS_DIR=$ARTIFACTS_DIR"

      mkdir -p "$ARTIFACTS_DIR"

      ISSUE_URL=$(printf '%s\n' "$ARGUMENTS" | grep -oE 'https://github.com/[^/]+/[^/]+/issues/[0-9]+' | head -1 || true)
      ISSUE_REPO=""
      ISSUE_NUM=""
      if [ -n "$ISSUE_URL" ]; then
        ISSUE_REPO=$(printf '%s\n' "$ISSUE_URL" | sed -E 's|https://github.com/([^/]+/[^/]+)/issues/[0-9]+|\1|')
        ISSUE_NUM=$(printf '%s\n' "$ISSUE_URL" | sed -E 's|.*/issues/||')
      else
        ISSUE_NUM=$(printf '%s\n' "$ARGUMENTS" | grep -oE '#[0-9]+|/issues/[0-9]+|[Ii]ssue[[:space:]]+[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
      fi

      COMMIT_URL=$(printf '%s\n' "$ARGUMENTS" | grep -oE 'https://github.com/[^/]+/[^/]+/commit/[0-9a-fA-F]+' | head -1 || true)
      UPSTREAM_OWNER_REPO=""
      COMMIT_REF=""
      if [ -n "$COMMIT_URL" ]; then
        UPSTREAM_OWNER_REPO=$(printf '%s\n' "$COMMIT_URL" | sed -E 's|https://github.com/([^/]+/[^/]+)/commit/[0-9a-fA-F]+|\1|')
        COMMIT_REF=$(printf '%s\n' "$COMMIT_URL" | sed -E 's|.*/commit/||')
      fi

      if [ -n "$ISSUE_NUM" ]; then
        if [ -z "$ISSUE_REPO" ]; then
          ISSUE_REPO=$(gh repo view "$(git remote get-url "${PR_REMOTE:-origin}")" --json nameWithOwner -q .nameWithOwner)
        fi
        if [ -z "$ISSUE_REPO" ]; then
          echo "ERROR: could not resolve the GitHub issue repository" >&2
          exit 1
        fi
        ISSUE_KIND=$(gh api "repos/${ISSUE_REPO}/issues/${ISSUE_NUM}" --jq 'if .pull_request then "pull-request" else "issue" end')
        if [ "$ISSUE_KIND" != "issue" ]; then
          echo "ERROR: ${ISSUE_REPO}#${ISSUE_NUM} is a pull request, not an upstream-sync issue" >&2
          exit 1
        fi
        ISSUE_JSON=$(gh issue view "$ISSUE_NUM" --repo "$ISSUE_REPO" --json number,title,body,url,labels,state)
        ISSUE_TITLE=$(printf '%s' "$ISSUE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("title") or "")')
        ISSUE_BODY=$(printf '%s' "$ISSUE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("body") or "")')
        ISSUE_URL=$(printf '%s' "$ISSUE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("url") or "")')
        ISSUE_STATE=$(printf '%s' "$ISSUE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("state") or "")')
        if [ -z "$COMMIT_URL" ]; then
          COMMIT_URL=$(printf '%s\n' "$ISSUE_BODY" | grep -oE 'https://github.com/[^/]+/[^/]+/commit/[0-9a-fA-F]+' | head -1 || true)
        fi
        if [ -n "$COMMIT_URL" ]; then
          UPSTREAM_OWNER_REPO=$(printf '%s\n' "$COMMIT_URL" | sed -E 's|https://github.com/([^/]+/[^/]+)/commit/[0-9a-fA-F]+|\1|')
          COMMIT_REF=$(printf '%s\n' "$COMMIT_URL" | sed -E 's|.*/commit/||')
        elif [ -z "$COMMIT_REF" ]; then
          COMMIT_REF=$(printf '%s' "$ISSUE_JSON" | python3 -c 'import json,sys; labels=json.load(sys.stdin).get("labels") or []; names=[(l.get("name") if isinstance(l, dict) else str(l)) for l in labels]; commit=[n.split(":",1)[1] for n in names if isinstance(n, str) and n.startswith("commit:")]; print(commit[0] if commit else "")')
        fi
        printf '%s' "$ISSUE_NUM" > "$ARTIFACTS_DIR/.issue-number"
        printf '%s' "$ISSUE_REPO" > "$ARTIFACTS_DIR/.issue-repo"
        printf '%s' "$ISSUE_URL" > "$ARTIFACTS_DIR/.issue-url"
        printf '%s' "$ISSUE_TITLE" > "$ARTIFACTS_DIR/.issue-title"
        printf '%s\n' "$ISSUE_BODY" > "$ARTIFACTS_DIR/.issue-body"
        printf 'Closes #%s\n' "$ISSUE_NUM" > "$ARTIFACTS_DIR/closes-issue.md"
        echo "ISSUE_URL=$ISSUE_URL"
        echo "ISSUE_TITLE=$ISSUE_TITLE"
        echo "ISSUE_STATE=$ISSUE_STATE"
      fi

      if [ -z "$COMMIT_REF" ]; then
        COMMIT_REF=$(printf '%s\n' "$ARGUMENTS" | grep -oE '\b[0-9a-fA-F]{7,40}\b' | head -1 || true)
      fi

      if [ -z "$COMMIT_REF" ]; then
        echo "ERROR: no GitHub issue with an upstream commit URL, and no commit URL/SHA, in arguments: $ARGUMENTS" >&2
        echo "Usage: archon workflow run harness-service-sync-upstream 'https://github.com/oceanlabs-holding/x10.gigo.harness-service/issues/176'" >&2
        exit 1
      fi

      STATE_UPSTREAM=""
      STATE_LOCAL=""
      if [ -f upstream-sync/state.json ]; then
        STATE_UPSTREAM=$(python3 -c 'import json; print(json.load(open("upstream-sync/state.json")).get("upstreamRepository",""))' 2>/dev/null || true)
        STATE_LOCAL=$(python3 -c 'import json; print(json.load(open("upstream-sync/state.json")).get("upstreamLocalPath",""))' 2>/dev/null || true)
      fi

      if [ -z "$UPSTREAM_OWNER_REPO" ]; then
        if [ -n "$STATE_UPSTREAM" ]; then
          UPSTREAM_OWNER_REPO=$(printf '%s\n' "$STATE_UPSTREAM" | sed -E 's|^https://github.com/||; s|\.git$||')
        else
          UPSTREAM_OWNER_REPO="xai-org/grok-build"
        fi
      fi

      UPSTREAM_FETCH_URL="https://github.com/${UPSTREAM_OWNER_REPO}.git"
      FETCHED=0
      if git fetch --no-tags --depth=2 "$UPSTREAM_FETCH_URL" "$COMMIT_REF"; then
        FETCHED=1
      elif [ -n "$STATE_LOCAL" ] && [ -d "$STATE_LOCAL/.git" ]; then
        echo "GitHub fetch failed; retrying from upstream-sync/state.json upstreamLocalPath"
        git fetch --no-tags --depth=2 "$STATE_LOCAL" "$COMMIT_REF"
        FETCHED=1
      fi

      if [ "$FETCHED" != 1 ]; then
        echo "ERROR: could not fetch $COMMIT_REF from $UPSTREAM_FETCH_URL" >&2
        exit 1
      fi

      FULL_SHA=$(git rev-parse --verify FETCH_HEAD)
      if ! git cat-file -e "${FULL_SHA}^" 2>/dev/null; then
        if ! git fetch --no-tags "$UPSTREAM_FETCH_URL" "${FULL_SHA}^"; then
          if [ -n "$STATE_LOCAL" ] && [ -d "$STATE_LOCAL/.git" ]; then
            git fetch --no-tags "$STATE_LOCAL" "${FULL_SHA}^"
          fi
        fi
      fi
      PARENT_SHA=$(git rev-parse --verify "${FULL_SHA}^")
      COMMIT_URL="https://github.com/${UPSTREAM_OWNER_REPO}/commit/${FULL_SHA}"

      if [ -f "upstream-sync/commits/${FULL_SHA}.json" ]; then
        echo "ERROR: upstream commit $FULL_SHA already has a sync manifest at upstream-sync/commits/${FULL_SHA}.json" >&2
        echo "This workflow ports a commit once. Inspect the existing record or pass an unsynced SHA." >&2
        exit 1
      fi

      printf '%s' "$FULL_SHA" > "$ARTIFACTS_DIR/.upstream-commit"
      printf '%s' "$PARENT_SHA" > "$ARTIFACTS_DIR/.upstream-parent"
      printf '%s' "$COMMIT_URL" > "$ARTIFACTS_DIR/.upstream-url"
      printf '%s' "$UPSTREAM_OWNER_REPO" > "$ARTIFACTS_DIR/.upstream-repo"
      git log -1 --format=%B "$FULL_SHA" > "$ARTIFACTS_DIR/.upstream-message"

      echo "UPSTREAM_REPO=$UPSTREAM_OWNER_REPO"
      echo "COMMIT_URL=$COMMIT_URL"
      echo "FULL_SHA=$FULL_SHA"
      echo "PARENT_SHA=$PARENT_SHA"
      echo "ARTIFACTS_DIR=$ARTIFACTS_DIR"
      echo "Starting Step 1 of 2: porting the upstream commit with sync-upstream-commit..."

  - id: sync
    prompt: |
      ## Autonomous headless mode — NO human is available

      You are running inside an automated Archon workflow. There is NO human to
      answer questions and no interactive chat. The `AskUserQuestion` tool is
      unavailable (denied) — never attempt to use it and never stop to wait.
      Make the simplest durable decisions yourself (KISS / YAGNI), grounded in
      this repository. If a choice is materially ambiguous (merge-commit parent
      or HIGH/CRITICAL GitNexus impact), STOP and fail this node with the
      evidence written under `$ARTIFACTS_DIR/` — do not guess.

      ## Task

      Port the upstream commit resolved by the previous `setup` node into this
      harness-service checkout, then commit the adaptation. Do NOT open a pull
      request — the next node runs `archon-create-pr`.

      The workflow trigger is a GitHub issue URL (intake ticket). Setup already
      fetched that issue and wrote the grok-build commit identity under
      `$ARTIFACTS_DIR/`. Use those files. Do not re-parse `$ARGUMENTS` as a
      commit URL.

      $sync-upstream-commit $ARGUMENTS

      ## Identity files (read these; do not grep setup stdout)

      - `$ARTIFACTS_DIR/.issue-url` / `.issue-number` / `.issue-title` / `.issue-body`
      - `$ARTIFACTS_DIR/closes-issue.md` (`Closes #N` for the PR node)
      - `$ARTIFACTS_DIR/.upstream-url`
      - `$ARTIFACTS_DIR/.upstream-commit` (full SHA)
      - `$ARTIFACTS_DIR/.upstream-parent`
      - `$ARTIFACTS_DIR/.upstream-repo`
      - `$ARTIFACTS_DIR/.upstream-message`

      Default upstream is `https://github.com/xai-org/grok-build` when the
      issue body did not name another GitHub repo.

      ## Repository policy (do not rediscover)

      1. Read `AGENTS.md`, `brain/Gotchas.md`, and `brain/EnvMapping.md` before
         planning or editing.
      2. GitNexus repo id: `x10.gigo.harness-service`. Run upstream impact
         analysis before modifying any existing governed symbol. Fail this node
         when any impact is HIGH or CRITICAL (write the impact report to
         `$ARTIFACTS_DIR/impact.md`).
      3. `source-revision-file` is `SOURCE_REV` at the repository root.
         `target-prefix` is the repository root (empty prefix).
      4. Translate Gigo-owned `GROK_*` product/runtime env keys to `GIGO_*`
         per `brain/EnvMapping.md`. Keep third-party / vendor / protocol names
         (`XAI_*`, `OTEL_*`, `MCP_*`, …). Use `--forbid-added` for leaked
         product env reads:
         `--forbid-added 'env::var\("GROK_'`
         `--forbid-added 'std::env::var\("GROK_'`
      5. Never manually edit changelogs or files marked generated. Omit with:
         `--allow-missing '(^|/)CHANGELOG\.md$'`
         `--allow-missing '(^|/)changelogs/'`
         `--omit '(^|/)CHANGELOG\.md$=Repository policy prohibits manual generated changelog edits.'`
         `--omit '(^|/)changelogs/=Repository policy prohibits manual generated changelog edits.'`
      6. Large-file rule: never Write or StrReplace a large mid-file patch.
         Reconstruct with `git merge-file` (ours=HEAD, base=upstream parent,
         theirs=upstream tip). Prove HEAD→worktree against parent→tip.
      7. Do not run `cargo test --workspace`. Format the touched languages,
         focused clippy (`-D warnings`) on affected packages, and focused
         tests that execute at least one test. Then run GitNexus
         `detect_changes` (scope all, and compare vs `$BASE_BRANCH`).
      8. Record immutable history only after path coverage and behavior
         validation succeed:
         `upstream-sync/commits/<full-sha>.json`
         `upstream-sync/reports/<full-sha>.md` (`--language en`).
      9. Copy the human report to `$ARTIFACTS_DIR/upstream-sync-report.md`
         so the PR node can read it.

      ## This workflow requests a commit

      After coverage verification and after writing the manifest + report,
      commit the ported sources, tests, `SOURCE_REV`, and `upstream-sync/`
      records. Stage named paths only — never `git add -A`.
      Do not stage `$ARTIFACTS_DIR`, `.archon/artifacts/`, `.archon/logs/`,
      or `.archon/state/`.

      Commit subject (imperative, matches recent history):

      `feat(native): port upstream <12-char-sha> <short feature group>`

      Body: GitHub issue URL, `Closes #<issue>`, upstream commit URL, parent
      SHA, intentional omissions, and validation evidence. Do not push.
      Do not run `gh pr create`.

      ## Completion

      Print the committed SHA, the manifest path, the report path, and a
      one-paragraph summary of what was ported vs omitted. Fail if coverage
      has an unexplained missing path, a forbidden added-line match, or
      HIGH/CRITICAL impact.
    depends_on:
      - setup
    effort: xhigh
    provider: codex
    model: gpt-5.6-terra
    context: fresh
    idle_timeout: 14400000

  - id: cargo-clean-before-pr
    bash: |
      set -euo pipefail
      if [ -f Cargo.toml ]; then
        cargo clean
      fi
    depends_on:
      - sync

  - id: create-pull-request
    command: archon-create-pr
    provider: codex
    effort: medium
    depends_on:
      - cargo-clean-before-pr
    context: fresh
    model: gpt-5.6-terra
    idle_timeout: 900000
    output_type: pull-request
