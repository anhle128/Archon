name: archon-ralph-dag-project-aware
description: |
  Use when: User wants a Ralph implementation loop whose per-iteration validation
            adapts to the target repo's own toolchain (cargo / bun / go / uv …),
            instead of the bun-hardcoded archon-ralph-dag.
  Triggers: "ralph project aware", "ralph dag project aware", "project-aware ralph".

  DAG workflow that:
  1. Detects input: existing prd.json, existing prd.md (needs stories), or raw idea
  2. Generates prd.md + prd.json if needed, without mutating Git lifecycle state
  3. Validates PRD files, reads project context, and installs dependencies
  4. Runs the project-aware Ralph loop, leaving validated changes uncommitted
  5. Reports completion only after every story passes

  Returns: The structured `implement` result with `done:true` only when every story
           passes, or `done:false` with blocker evidence for the caller.
  The caller owns staging, commits, push, pull request, and blocker handling.

  Accepts: An idea description, a path to an existing prd.md, or a directory with
           prd.md + prd.json.

provider: omp
returns: implement

nodes:
  # ═══════════════════════════════════════════════════════════════
  # NODE 1: DETECT INPUT
  # Determines what the user provided: full PRD, partial PRD, or idea.
  # ═══════════════════════════════════════════════════════════════

  - id: detect-input
    prompt: |
      # Detect Ralph Input

      **User input**: $ARGUMENTS

      Determine what the user provided and prepare the PRD directory. Follow these steps exactly:

      ## Step 1: Detect worktree

      Run `git worktree list --porcelain` to check if you're in a worktree.
      If you see multiple entries, you ARE in a worktree. The first entry (the one without "branch" pointing to your current branch) is the **main repo root**. Save it — you'll need it to find files.

      ## Step 2: Classify the input

      **Case A — Directory path**: check that both `prd.json` and `prd.md` exist
      there. Try locally first, then relative to the main repo root if in a worktree.

      **Case B — File path** (ends in `.md`): find it as written, as an absolute
      path, or relative to the main repo root. Read it to confirm it is a PRD.

      **Case C — Free text**: treat it as a feature idea.

      ## Step 3: Prepare the destination

      - Case A with both files: output `ready` and its existing directory.
      - Case B: derive a kebab-case slug, create a sibling `ralph/<slug>` directory
        (fallback `.archon/ralph/<slug>` for a repo-root file), copy the source to
        `<prd_dir>/prd.md`, and output `external_prd`.
      - Case C, or Case A with `prd.md` but no `prd.json`: derive or preserve the
        destination directory and output `needs_generation`.

      Do not stage, commit, push, or create a pull request.

      Your final output MUST be exactly one JSON object:
      ```json
      {"input_type": "ready|external_prd|needs_generation", "prd_dir": "<dir path>"}
      ```
    provider: claude
    effort: high
    model: sonnet
    output_format:
      type: object
      properties:
        input_type:
          type: string
          enum: [ready, external_prd, needs_generation]
        prd_dir:
          type: string
      required: [input_type, prd_dir]

  # ═══════════════════════════════════════════════════════════════
  # NODE 2: GENERATE PRD
  # Creates missing Ralph files while leaving them uncommitted.
  # ═══════════════════════════════════════════════════════════════

  - id: generate-prd
    depends_on: [detect-input]
    when: "$detect-input.output.input_type != 'ready'"
    context: fresh
    prompt: |
      # Generate Ralph PRD Files

      **User input**: $ARGUMENTS
      **Input type**: $detect-input.output.input_type
      **PRD directory**: $detect-input.output.prd_dir

      Autonomously create a production-quality Ralph PRD from the supplied idea or
      existing `prd.md`. Use the PRD directory above exactly; do not invent a second
      destination.

      1. Read the repository's applicable agent guidance and manifests.
      2. Explore the actual codebase before designing stories. Reference real files,
         symbols, patterns, and project validation commands.
      3. If `prd.md` already exists, preserve all its requirements and enrich only
         missing implementation context. Otherwise create it with problem, goals,
         non-goals, user flow, requirements, technical context, risks, and validation.
      4. Create `prd.json` with one flat `userStories` array. Each story must include
         `id`, `title`, `description`, `acceptanceCriteria`, `technicalNotes`,
         `dependsOn`, `priority`, `passes: false`, and `notes`.
      5. Size each story for one Ralph iteration. Dependencies must reference existing
         story IDs, remain acyclic, and never require a lower-priority story.
      6. Make every acceptance criterion observable and include the target project's
         actual checks rather than assuming Bun.
      7. Validate that both files exist and that `prd.json` parses before finishing.

      Do not stage, commit, push, stash, reset, clean, or create/update a pull request.
      Leave the generated files in the checkout for the caller-owned lifecycle.

      Finish with:
      ```
      PRD_DIR=$detect-input.output.prd_dir
      FILES_CREATED=prd.md,prd.json
      ```

  # Complements generate-prd so validation waits for the selected path to finish.
  - id: ready-prd
    depends_on: [detect-input]
    when: "$detect-input.output.input_type == 'ready'"
    bash: |
      set -e
      PRD_DIR=$detect-input.output.prd_dir
      test -f "$PRD_DIR/prd.md"
      test -f "$PRD_DIR/prd.json"
      echo "PRD ready: $PRD_DIR"

  # ═══════════════════════════════════════════════════════════════
  # NODE 3: VALIDATE & SETUP
  # Reads the detected PRD state and installs dependencies.
  # ═══════════════════════════════════════════════════════════════

  - id: validate-prd
    depends_on: [ready-prd, generate-prd]
    trigger_rule: one_success
    bash: |
      set -e

      # ── 1. Find PRD directory (passed from detect-input) ──────
      PRD_DIR=$detect-input.output.prd_dir
      if [ -z "$PRD_DIR" ] || [ ! -f "$PRD_DIR/prd.json" ]; then
        echo "ERROR: no prd.json in detect-input's prd_dir ('$PRD_DIR')." >&2
        exit 1
      fi

      if [ ! -f "$PRD_DIR/prd.md" ]; then
        echo "ERROR: prd.md not found in $PRD_DIR"
        exit 1
      fi

      # ── 2. Install dependencies (worktrees lack node_modules) ──
      if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
        echo "Installing dependencies (bun)..."
        bun install --frozen-lockfile 2>&1 | tail -3
      elif [ -f "package-lock.json" ]; then
        echo "Installing dependencies (npm)..."
        npm ci 2>&1 | tail -3
      elif [ -f "yarn.lock" ]; then
        echo "Installing dependencies (yarn)..."
        yarn install --frozen-lockfile 2>&1 | tail -3
      elif [ -f "pnpm-lock.yaml" ]; then
        echo "Installing dependencies (pnpm)..."
        pnpm install --frozen-lockfile 2>&1 | tail -3
      fi


      # ── 3. Output PRD context ─────────────────────────────────
      echo "PRD_DIR=$PRD_DIR"
      echo "=== PRD_JSON_START ==="
      cat "$PRD_DIR/prd.json"
      echo ""
      echo "=== PRD_JSON_END ==="
      echo "=== PRD_MD_START ==="
      cat "$PRD_DIR/prd.md"
      echo ""
      echo "=== PRD_MD_END ==="
      echo "=== PROGRESS_START ==="
      if [ -f "$PRD_DIR/progress.txt" ]; then
        cat "$PRD_DIR/progress.txt"
      else
        echo "(no progress yet)"
      fi
      echo ""
      echo "=== PROGRESS_END ==="

      # ── 5. Summary ────────────────────────────────────────────
      TOTAL=$(grep -c '"passes"' "$PRD_DIR/prd.json" || true)
      DONE=$(grep -c '"passes": true' "$PRD_DIR/prd.json" || true)
      TOTAL=${TOTAL:-0}
      DONE=${DONE:-0}
      echo "STORIES_TOTAL=$TOTAL"
      echo "STORIES_DONE=$DONE"
      echo "STORIES_REMAINING=$(( TOTAL - DONE ))"

  # ═══════════════════════════════════════════════════════════════
  # NODE 4: RALPH IMPLEMENTATION LOOP
  # Fresh context each iteration. Reads PRD state from disk.
  # One story per iteration. Validates and leaves changes for the parent.
  # ═══════════════════════════════════════════════════════════════

  - id: implement
    depends_on: [validate-prd]
    idle_timeout: 600000
    provider: omp
    effort: high
    model: xai-oauth/grok-4.5
    output_format:
      type: object
      properties:
        terminal:
          type: boolean
          description: true when all stories pass or a blocker must be handed to the parent; false when another child iteration should run.
        done:
          type: boolean
          description: true ONLY when every story in prd.json has passes:true.
        mode:
          type: string
          description: this iteration's mode — "implement" or "blocked".
        story_id:
          type: string
          description: the story worked this iteration, if any.
        note:
          type: string
          description: short carry-forward for the next iteration or the parent handoff.
      required:
        - terminal
        - done
    loop:
      prompt: |
        # Ralph Agent — Autonomous Story Implementation

        You are an autonomous coding agent in a FRESH session — you have no memory of previous iterations.
        Your job: Read state from disk, implement ONE story, validate, update tracking, exit.

        **Golden Rule**: If validation fails, fix it before marking the story passed. Never skip validation.
        Do not stage, commit, push, or create/update a pull request. The parent workflow owns that lifecycle.

        ---

        ## Phase 0: CONTEXT — Load Project State

        The upstream setup node produced this context:

        $validate-prd.output

        **User message**: $USER_MESSAGE

        **Previous iteration summary** (empty on the first iteration): $LOOP_PREV_OUTPUT
        Use it together with progress.txt to recover the prior mode, selected story, and blocker fingerprint/attempt before acting.

        ---

        ### 0.1 Parse PRD Directory

        Extract the `PRD_DIR=...` line from the context above. This is the directory containing your PRD files.
        Store this path — use it for ALL file operations below.

        ### 0.2 Read Current State (from disk, not from context above)

        The context above is a snapshot from before the loop started. Previous iterations may have changed files.
        Accumulated uncommitted changes from earlier iterations are expected and parent-owned.
        Preserve them; never discard, stage, commit, stash, reset, or clean them.
        **You MUST re-read from disk to get the current state:**

        1. **Read `{prd-dir}/progress.txt`** — your only link to previous iterations
           - Check the `## Codebase Patterns` section FIRST for learnings from prior iterations
           - Check recent entries for gotchas to avoid
        2. **Read `{prd-dir}/prd.json`** — the source of truth for story completion state
        3. **Read `{prd-dir}/prd.md`** — full requirements, technical patterns, acceptance criteria

        ### 0.3 Read Project Rules

        ```bash
        cat CLAUDE.md
        ```

        Note all coding standards, patterns, and rules. Follow them exactly.

        **PHASE_0_CHECKPOINT:**
        - [ ] PRD directory identified
        - [ ] progress.txt read (or noted as absent)
        - [ ] prd.json read — know which stories pass/fail
        - [ ] prd.md read — understand requirements
        - [ ] CLAUDE.md rules noted

        ---

        ## Phase 1: SELECT — Pick Next Story

        ### 1.1 Find Eligible Story

        From `prd.json`, find the **highest priority** story where:
        - `passes` is `false`
        - ALL stories in `dependsOn` have `passes: true`

        **If ALL stories have `passes: true`** → Skip to Phase 6 (Completion).

        **If no eligible stories exist** (every not-passing story is gated by a
        dependency that itself won't pass) → this is a blocker to RESOLVE, not a
        stopping point. Do NOT end idle. Run the **BLOCKER PROTOCOL** (below):
        usually a dependency was left `passes: false` though its code is done, or a
        `dependsOn` is wrong/circular. Fix the real state, then continue — the loop
        never idles on a blocker, it removes the blocker and keeps going.

        ### 1.2 Announce Selection

        ```
        ── Story Selected ──────────────────────────────────
        ID: {story-id}
        Title: {story-title}
        Priority: {priority}
        Dependencies: {deps or "none"}

        Acceptance Criteria:
        - {criterion 1}
        - {criterion 2}
        - ...
        ────────────────────────────────────────────────────
        ```

        After announcing the selected story, emit the story started event:
        ```bash
        archon workflow event emit --run-id $WORKFLOW_ID --type ralph_story_started --data '{"story_id":"{story-id}","title":"{story-title}"}' || true
        ```

        **PHASE_1_CHECKPOINT:**
        - [ ] Eligible story found (or all complete / all blocked)
        - [ ] Acceptance criteria understood
        - [ ] Dependencies verified as complete

        ---

        ## Phase 2: IMPLEMENT — Code the Story

        **Toolchain detection (do this once, reused by §2.3 and §3):** this loop is
        project-agnostic — NEVER assume a specific toolchain. Detect the project's
        own commands from CLAUDE.md / AGENTS.md and the manifest present:
        - Rust (`Cargo.toml`) → `cargo check` / `cargo clippy` / `cargo test` / `cargo fmt --all -- --check`
        - JS/TS (`package.json`) → the repo's `bun run` / `npm run` scripts (type-check, lint, test, format)
        - Go (`go.mod`) → `go build` / `go vet` / `go test ./...` / `gofmt -l`
        - Python (`pyproject.toml`) → the repo's configured typecheck / lint / test / format
        Prefer the exact commands the story's `acceptanceCriteria` / `technicalNotes`
        name. Follow the project's own build policy; do not introduce loop-specific
        commands.

        ### 2.1 Explore Before Coding

        Before writing any code:
        1. Read all files you plan to modify — understand current state
        2. Check `## Codebase Patterns` in progress.txt for discovered patterns
        3. Look for similar implementations in the codebase to mirror
        4. Read the `technicalNotes` field from the story in prd.json

        ### 2.2 Implementation Rules

        **DO:**
        - Implement ONLY the selected story — one story per iteration
        - Follow existing code patterns exactly (naming, structure, imports, error handling)
        - Match the project's coding standards from CLAUDE.md
        - Write or update tests as required by acceptance criteria
        - Keep changes minimal and focused

        **DON'T:**
        - Refactor unrelated code
        - Add improvements not in the acceptance criteria
        - Change formatting of lines you didn't modify
        - Install new dependencies without justification from prd.md
        - Touch files unrelated to this story
        - Over-engineer — do the simplest thing that satisfies the criteria

        **Blocked exception:** these DON'T rules (and "don't fix unrelated code" in
        Phase 3) govern normal implementation. If a blocker is outside the selected
        story, record it using the BLOCKER PROTOCOL below. Do not expand scope or
        mutate Git state to route around it.

        ### 2.3 Verify Build After Each File

        After modifying each file, run the project's fast build/type check (see
        Toolchain detection), scoped to what you changed where supported.

        **If it fails:**
        1. Read the error carefully
        2. Fix the issue in your code
        3. Re-run the check
        4. Do NOT proceed to the next file until it passes

        **PHASE_2_CHECKPOINT:**
        - [ ] Only the selected story was implemented
        - [ ] Project builds after each file change
        - [ ] Tests written/updated as needed
        - [ ] No unrelated changes

        ---

        ## Phase 3: VALIDATE — Full Verification

        ### 3.1 Static Analysis

        Run the project's static analysis — lint + typecheck (see Toolchain
        detection). Must pass with zero errors and zero warnings.

        **If it fails:** fix the reported issues (use the project's autofix only if
        it has one), then re-run until clean.

        ### 3.2 Tests

        Run the project's test suite (see Toolchain detection). Scope to the area
        you changed when the toolchain supports it.

        **All tests must pass.**

        **If tests fail:**
        1. Read the failure output
        2. Determine: bug in your implementation or pre-existing failure?
        3. If your bug → fix the implementation (not the test)
        4. If pre-existing → note it; don't fix unrelated tests. If it blocks this story's acceptance gate, use the BLOCKER PROTOCOL.
        5. Re-run tests
        6. Repeat until green

        ### 3.3 Format Check

        Run the project's format check (see Toolchain detection). If it reports
        problems, run the project's formatter to fix them, then re-check.

        ### 3.4 Verify Acceptance Criteria

        Go through EACH acceptance criterion from the story:
        - Is it satisfied by your implementation?
        - Can you verify it (read the code, run a command, check a file)?

        If a criterion is NOT met, go back to Phase 2 and fix it.

        **PHASE_3_CHECKPOINT:**
        - [ ] Project build/typecheck passes
        - [ ] Project lint passes (0 errors, 0 warnings)
        - [ ] All tests pass
        - [ ] Formatting is clean
        - [ ] Every acceptance criterion verified

        ---

        ## Phase 4: HANDOFF — Preserve Changes for the Parent

        Do not stage or commit any file. Leave the validated implementation and
        tracking-file changes in the checkout for the parent workflow.

        Record the exact files changed and the validation evidence in
        `progress.txt`. The parent uses that evidence when it commits and creates
        the pull request.

        **PHASE_4_CHECKPOINT:**
        - [ ] No Git staging, commit, push, or PR operation performed
        - [ ] Only files required by the selected story were changed
        - [ ] Validation evidence is ready for progress tracking

        ---

        ## Phase 5: TRACK — Update Progress Files

        ### 5.1 Update prd.json

        Set `passes: true` and add a note for the completed story:

        ```json
        {
          "id": "{story-id}",
          "passes": true,
          "notes": "Implemented in iteration {N}. Files: {list}."
        }
        ```

        After updating prd.json, emit the story completed event:
        ```bash
        archon workflow event emit --run-id $WORKFLOW_ID --type ralph_story_completed --data '{"story_id":"{story-id}","title":"{story-title}"}' || true
        ```

        ### 5.2 Update progress.txt

        **Append** to `{prd-dir}/progress.txt`:

        ```
        ## {ISO Date} — {story-id}: {story-title}

        **Status**: PASSED
        **Files changed**:
        - {file1} — {what changed}
        - {file2} — {what changed}

        **Acceptance criteria verified**:
        - [x] {criterion 1}
        - [x] {criterion 2}

        **Learnings**:
        - {Any pattern discovered}
        - {Any gotcha encountered}
        - {Any deviation from expected approach}

        ---
        ```

        ### 5.3 Update Codebase Patterns (if applicable)

        If you discovered a **reusable pattern** that future iterations should know about, **prepend** it to the `## Codebase Patterns` section at the TOP of progress.txt.

        Format:
        ```
        ## Codebase Patterns

        ### {Pattern Name}
        - **Where**: `{file:lines}`
        - **Pattern**: {description}
        - **Example**: `{code snippet}`
        ```

        If the `## Codebase Patterns` section doesn't exist yet, create it at the top of the file.

        **PHASE_5_CHECKPOINT:**
        - [ ] prd.json updated with `passes: true`
        - [ ] progress.txt appended with iteration details
        - [ ] Codebase patterns updated (if applicable)

        ---

        ## Phase 6: COMPLETE — Check All Stories

        ### 6.1 Re-read prd.json

        ```bash
        cat {prd-dir}/prd.json
        ```

        Count stories where `passes: false`.

        ### 6.2 If ALL Stories Pass

        Signal implementation completion via the structured output declared by this
        node. Set `terminal: true`, `done: true`, `mode: "implement"`, the finished
        `story_id`, and a short handoff note.

        Do not stage, commit, push, or create/update a pull request. The parent
        workflow performs those actions after any downstream review or convergence
        work completes.

        ### 6.3 If Stories Remain

        Report status, then end the iteration. Return `terminal: false`, `done: false`, `mode: "implement"`, the `story_id`, and the next-step note. Human-readable summary:
        ```
        ── Iteration Complete ──────────────────────────────
        Story completed: {story-id} — {story-title}
        Stories remaining: {count}
        Next eligible: {next-story-id} — {next-story-title}
        ────────────────────────────────────────────────────
        ```

        The loop engine will start the next iteration with a fresh context.

        ---

        ## Handling Edge Cases

        ### Validation fails repeatedly
        - If the project's checks or tests fail 3+ times on the SAME root cause, stop repeating the same attempt — you are blocked. Enter the **BLOCKER PROTOCOL** below.
        - Re-read the acceptance criteria first — confirm you are running the AC's EXACT command correctly (you may be misreading the requirement).

        ### Story is too large for one iteration
        - Implement the minimum viable subset that satisfies the most critical acceptance criteria
        - Set `passes: true` only if ALL criteria are met
        - If you can't meet all criteria, leave `passes: false` and note what's done in progress.txt
        - The next iteration will pick it up and continue

        ### Pre-existing test/lint failures
        - Note failures that are unrelated to the selected story; do not fix them.
        - If such a failure blocks an exact acceptance gate, use the BLOCKER
          PROTOCOL below and leave the story at `passes: false`.

        ### Dependency setup fails
        - JS installs deps from a lockfile; most other toolchains (cargo, go, …)
          fetch automatically on first build — there may be no separate install step.
        - If fetch/install fails, record the failure in progress.txt.

        ### Blocked stories — all remaining have unmet dependencies
        - This is a blocker to record, not a reason to alter unrelated code — enter the **BLOCKER PROTOCOL**.
        - Report the dependency chain; check whether a dependency was incorrectly left `passes: false`.
        - If a dependency's code genuinely satisfies its own gate, re-run THAT gate to confirm, then set its `passes: true` in prd.json. If a `dependsOn` is wrong/circular, correct it. Then continue.

        ---

        ## BLOCKER PROTOCOL — Record, Do Not Hide

        A story is blocked when an exact acceptance gate cannot pass because of a
        cause outside the story, missing credentials or services, or a contradictory
        requirement.

        When blocked:
        1. Capture the exact failing command and its stable error fingerprint.
        2. Confirm the failure is outside the selected story's files and criteria.
        3. Do not weaken acceptance criteria or fix unrelated code.
        4. Leave the story at `passes: false`.
        5. Append a `BLOCKER` entry to progress.txt with the evidence and required
           next action.
        6. Return `terminal: true`, `done: false`, `mode: "blocked"`, and a concise
           handoff note.

        `terminal: true` exits the child loop so the parent can resolve the blocker.

        ---

        ## File Format Reference

        ### prd.json Schema

        ```json
        {
          "feature": "Feature Name",
          "issueNumber": 123,
          "userStories": [
            {
              "id": "US-001",
              "title": "Short title",
              "description": "As a..., I want..., so that...",
              "acceptanceCriteria": ["criterion 1", "criterion 2"],
              "technicalNotes": "Implementation hints",
              "dependsOn": ["US-000"],
              "priority": 1,
              "passes": false,
              "notes": ""
            }
          ]
        }
        ```

        ### progress.txt Format

        ```
        ## Codebase Patterns

        ### {Pattern Name}
        - Where: `file:lines`
        - Pattern: description
        - Example: `code`

        ---

        ## {Date} — {story-id}: {title}

        **Status**: PASSED
        **Files changed**: ...
        **Acceptance criteria verified**: ...
        **Learnings**: ...

        ---
        ```

        ### Blocker Ledger (in progress.txt)

        Append one line per blocked encounter so the parent receives durable evidence:

        ```
        BLOCKER {story-id} | gate=<exact command> | cause=<root cause + proof> | action=<required parent action> | {date}
        ```

        ---
        ## Success Criteria


        - **ONE_STORY**: Exactly one story implemented per iteration
        - **VALIDATED**: the project's own checks (build/typecheck + lint + tests + format) pass before marking a story complete
        - **UNCOMMITTED_HANDOFF**: No staging, commit, push, or PR operation is performed
        - **TRACKED**: prd.json and progress.txt updated accurately
        - **PATTERNS_SHARED**: Discovered patterns added to progress.txt for future iterations
        - **NO_SCOPE_CREEP**: No unrelated changes, refactoring, or improvements
      until_field: terminal
      max_iterations: 35
      fresh_context: true


  # ═══════════════════════════════════════════════════════════════
  # NODE 5: COMPLETION REPORT
  # Reads final state and produces a summary.
  # ═══════════════════════════════════════════════════════════════

  - id: report
    depends_on: [implement]
    when: "$implement.output.done == true"
    provider: claude
    effort: medium
    model: sonnet
    prompt: |
      # Completion Report

      The Ralph implementation loop has finished. Generate a completion report.

      ## Context

      **Loop output (last iteration):**

      $implement.output

      **Setup context:**

      $validate-prd.output

      ---

      ## Instructions

      ### 1. Read Final State

      Extract the `PRD_DIR=...` from the setup context above.
      Read the CURRENT files from disk:

      ```bash
      cat {prd-dir}/prd.json
      cat {prd-dir}/progress.txt
      ```

      ### 2. Generate Report

      Output this format:

      ```
      ═══════════════════════════════════════════════════════
      RALPH DAG — IMPLEMENTATION REPORT
      ═══════════════════════════════════════════════════════

      Feature: {feature name from prd.json}
      PRD: {prd-dir}
      Lifecycle: implementation complete; parent owns commit, push, and PR

      ── Stories ─────────────────────────────────────────

      | ID | Title | Status |
      |----|-------|--------|
      {for each story from prd.json}

      Total: {N}/{M} stories passing

      ── Files Changed ───────────────────────────────────

      {from iteration entries in progress.txt, or "None"}

      ── Patterns Discovered ─────────────────────────────

      {from ## Codebase Patterns in progress.txt, or "None"}

      ═══════════════════════════════════════════════════════
      ```

      Keep it factual. No commentary — just the data.
