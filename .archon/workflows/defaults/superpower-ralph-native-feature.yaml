name: superpower-ralph-native-feature
description: |
  Use when: Manual Superpowers brainstorming is complete and the user wants the
            feature built with an in-parent Ralph loop plus Codex converge.
  Triggers: "superpower ralph native", "superpowers ralph", "ralph native superpowers",
            "superpower ralph feature".
  Does: Grok writes a Superpowers implementation plan, Codex repairs the plan,
        convert to a co-located Ralph PRD, run an in-parent project-aware Ralph
        loop (no workflow: child; iteration command is a no-PR adapted fork),
        Codex converge audits plan coverage AND hidden problems (speckit-converge
        gap types + no-mistakes review), appends tasks to the Superpowers plan,
        Plannotator HITL, sync new stories into prd.json, Ralph again (max 3).
        On exhaustion, sync + one final Ralph pass without HITL, then create a PR.
  NOT for: Brainstorming itself, speckit, ak-implement (existing plan),
        Codex writing the missing code, or review-only work.
  Input: The approved brainstorm result, product notes, design spec path, or
        requirements from the manual Superpowers brainstorming step.
provider: omp
interactive: true
tags:
  - Superpowers
  - Feature
  - Ralph
  - TDD

nodes:
  - id: setup
    description: Prepare Superpowers Ralph workflow artifacts.
    bash: |
      set -euo pipefail
      mkdir -p "$ARTIFACTS_DIR/superpowers" docs/superpowers/plans
      git rev-parse HEAD > "$ARTIFACTS_DIR/superpowers/base-sha.txt"
      {
        echo "Archon Superpowers Ralph native feature workflow"
        echo "Base SHA: $(cat "$ARTIFACTS_DIR/superpowers/base-sha.txt")"
        echo "Brainstorming is manual and must already be complete."
      } > "$ARTIFACTS_DIR/superpowers/setup.md"

  - id: write-plan
    description: Write the Superpowers implementation plan with Grok 4.6.
    provider: omp
    model: "xai-oauth/grok-4.6"
    effort: xhigh
    context: fresh
    depends_on:
      - setup
    prompt: |
      User input:
      $ARGUMENTS

      Use the Superpowers writing-plans method.
      Read the repository instructions before you plan.
      If the user input names a file or directory, read it before you plan.

      Write one complete implementation plan.
      Save it as docs/superpowers/plans/YYYY-MM-DD-<feature>.md.
      Use the current local date for YYYY-MM-DD.
      Use a short slug for <feature>.
      Return plan_path as that repo-relative path (no backticks).

      The plan must be executable by another agent.
      Include exact files to change, interfaces to add or change, tests to write, and commands to run.
      Include TDD red, green, and refactor steps for code changes.
      Include all known requirements from the approved brainstorm.
      Include acceptance criteria and validation commands.
      Do not leave placeholders.
      If a product decision is missing, add an Open Questions section and choose a safe provisional default.
      Keep each full Markdown sentence on its own physical line.

      Return only JSON.
    output_format:
      type: object
      required:
        - plan_path
        - task_count
        - summary
        - open_questions_count
        - validation_commands
      properties:
        plan_path:
          type: string
        task_count:
          type: number
        summary:
          type: string
        open_questions_count:
          type: number
        validation_commands:
          type: string

  - id: verify-and-fix-plan
    prompt: |
      Review and revise the complete plan at `$write-plan.output.plan_path`.
      Treat the current plan as an unverified draft.
      Do not trust its claims, assumptions, scope, file references, technical decisions, or conclusions.

      Independently inspect the repository, documentation, code, tests, configuration, and existing behavior.
      Use repository evidence to verify every material part of the plan.

      Determine:

      - What goal the plan is trying to achieve.
      - Whether that goal matches the actual project need.
      - Whether the proposed solution fully meets that goal.
      - Whether the scope is correct and complete.
      - Whether any requirements, decisions, or steps conflict.
      - Whether the plan conflicts with existing behavior, contracts, architecture, conventions, or repository rules.
      - Whether the design is correct, simple, maintainable, secure, scalable, and reliable.
      - Whether the named files, components, dependencies, and code paths are accurate.
      - Whether the implementation order is practical and complete.
      - Whether compatibility, migration, rollout, failure handling, and operational concerns are covered.
      - Whether the test and validation strategy can prove the result.
      - Whether the acceptance criteria are complete, measurable, and tied to the goal.
      - Whether the plan contains unsupported assumptions, gaps, unnecessary work, duplication, or premature abstractions.

      Trace the affected behavior end to end.
      Check direct and indirect effects outside the files named by the plan.
      Look for important cases that the plan author may have missed.

      Fix every verified problem directly in the plan.
      Add missing details that an implementing engineer needs.
      Remove incorrect, conflicting, redundant, or unnecessary content.
      Keep the solution focused and proportional to the goal.

      Do not implement production code.
      Your task is to make the plan ready for implementation.

      After revising the plan, review it again from these perspectives:

      1. Product goal and user outcome.
      2. Architecture and technical correctness.
      3. Public and internal contracts.
      4. Security, reliability, and data integrity.
      5. Performance and scalability.
      6. Implementation completeness.
      7. Testing and verification.
      8. Operations, compatibility, migration, and rollback.
      9. Simplicity and long-term maintainability.

      Finish with a concise report that states:

      - Your interpretation of the goal.
      - The evidence you inspected.
      - The important problems you found.
      - The changes you made.
      - Any remaining risks, assumptions, or unresolved questions.
      - Whether the plan is ready to implement.
    depends_on: [write-plan]
    provider: codex
    effort: xhigh
    model: gpt-5.6-sol
    context: fresh

  - id: build-ralph-prd
    description: Convert the Superpowers plan into a co-located Ralph PRD.
    depends_on:
      - verify-and-fix-plan
    provider: omp
    effort: xhigh
    model: openai-codex/gpt-5.5
    context: fresh
    prompt: |
      ## Persona

      You are a SHARP SOLUTION ARCHITECT who lives by KISS and YAGNI. You do not
      invent work that isn't in the plan, and you do not drop work that is.

      ## Headless mode — NO human is available

      Resolve every decision yourself from the plan plus the actual codebase.
      Do not stop to ask.

      ## Task

      The Superpowers plan to implement is the file:

        $review-fix-plan.output.plan_path

      Convert that ENTIRE plan into a Ralph PRD so an in-parent project-aware
      Ralph loop can implement it one story per iteration. Do NOT implement the
      feature itself — only produce the PRD files.

      1. Read the plan file. Confirm it exists.
      2. Derive `<name>` as the plan filename without `.md`
         (e.g. `docs/superpowers/plans/2026-09-02-foo.md` → `2026-09-02-foo`).
      3. Create the Ralph directory next to the plans folder:
         `docs/superpowers/ralph/<name>/` via `mkdir -p`. Never `.archon/ralph/`.
      4. Break the plan into right-sized Ralph user stories — each completable in a
         single fresh-context iteration. Map the plan's TDD structure into concrete,
         pass/fail acceptance criteria. Order stories by dependency (lower priority
         runs first) and set `dependsOn` to only lower-priority story ids. No cycles,
         no forward refs.
      5. Write `docs/superpowers/ralph/<name>/prd.md` — a self-contained context
         document (overview / problem / solution, goals + success metrics, non-goals,
         technical context with real file:line references drawn from the plan, and a
         story-overview table).
      6. Write `docs/superpowers/ralph/<name>/prd.json` using EXACTLY this schema
         (story-level `passes`, all `false` at start):

         ```json
         {
           "feature": "<feature name>",
           "userStories": [
             {
               "id": "US-001",
               "title": "<short title>",
               "description": "As a..., I want..., so that...",
               "acceptanceCriteria": ["<verifiable criterion>", "..."],
               "technicalNotes": "<real files, patterns, and plan refs to follow>",
               "dependsOn": [],
               "priority": 1,
               "passes": false,
               "notes": ""
             }
           ]
         }
         ```

      7. Verify both files exist and prd.json is valid JSON whose `userStories` is a
         non-empty array with every story `passes: false`.
      8. Resolve `prd_dir` with `realpath` so it is an absolute path.

      Return only JSON.
    output_format:
      type: object
      properties:
        prd_dir:
          type: string
        slug:
          type: string
        feature:
          type: string
        story_count:
          type: number
      required: [prd_dir, slug, story_count]

  - id: validate-prd
    description: Record PRD dir and confirm prd.json is ready for Ralph.
    depends_on:
      - build-ralph-prd
      - sync-plan-to-ralph
    trigger_rule: one_success
    bash: |
      set -euo pipefail
      PRD_DIR=$build-ralph-prd.output.prd_dir
      if [ -z "$PRD_DIR" ] || [ ! -f "$PRD_DIR/prd.json" ]; then
        echo "ERROR: no prd.json in build-ralph-prd prd_dir ('$PRD_DIR')." >&2
        exit 1
      fi
      if [ ! -f "$PRD_DIR/prd.md" ]; then
        echo "ERROR: prd.md not found in $PRD_DIR" >&2
        exit 1
      fi
      mkdir -p "$ARTIFACTS_DIR/superpowers"
      printf '%s\n' "$PRD_DIR" > "$ARTIFACTS_DIR/superpowers/prd-dir.txt"
      echo "PRD_DIR=$PRD_DIR"
      echo "BRANCH=$(git branch --show-current)"
      TOTAL=$(jq '.userStories | length' "$PRD_DIR/prd.json")
      DONE=$(jq '[.userStories[] | select(.passes == true)] | length' "$PRD_DIR/prd.json")
      echo "STORIES_TOTAL=$TOTAL"
      echo "STORIES_DONE=$DONE"
      echo "STORIES_REMAINING=$((TOTAL - DONE))"

  - id: ralph-loop-run
    description: In-parent project-aware Ralph loop (no PR).
    depends_on:
      - validate-prd
    idle_timeout: 3600000
    provider: omp
    effort: high
    model: xai-oauth/grok-4.5
    output_format:
      type: object
      properties:
        done:
          type: boolean
          description: true ONLY when every story in prd.json has passes true; false otherwise.
        mode:
          type: string
        story_id:
          type: string
        note:
          type: string
      required:
        - done
    loop:
      command: archon-ralph-project-aware-iteration
      fresh_context: true
      max_iterations: 35
      until_bash: |
        set -euo pipefail
        PRD_FILE="$ARTIFACTS_DIR/superpowers/prd-dir.txt"
        [ -f "$PRD_FILE" ] || exit 1
        PRD_DIR=$(cat "$PRD_FILE")
        [ -n "$PRD_DIR" ] && [ -f "$PRD_DIR/prd.json" ] || exit 1
        jq -e '.userStories | type == "array" and length > 0 and all(.[]; .passes == true)' "$PRD_DIR/prd.json" >/dev/null

  - id: converge-review
    description: Audit plan coverage and hidden problems; append tasks to the Superpowers plan.
    depends_on:
      - ralph-loop-run
    provider: codex
    effort: xhigh
    model: gpt-5.6-sol
    context: fresh
    prompt: |
      ## Persona

      You are a skeptical staff engineer doing a speckit-converge pass plus a
      no-mistakes hidden-problem review. Ralph claimed the work is done. You do
      NOT trust that claim. Do not implement production code.

      ## Headless mode — NO human is available

      Resolve every decision yourself. Do not stop to ask.

      ## Source of intent

      The Superpowers plan at `$review-fix-plan.output.plan_path` is the sole
      source of intent (plus repository AGENTS.md / constitution if present).
      prd.json and `$ralph-loop-run.output` are untrusted claims.

      ## GitNexus

      If `gitnexus` or `npx gitnexus` works in this checkout, use it before
      judging blast radius: `gitnexus query` for the changed concepts, then
      `gitnexus impact` / `gitnexus context` on symbols the plan or diff
      touches. If GitNexus is missing or the index is stale, inspect callers,
      callees, and shared helpers in source. Do not fail this node only because
      GitNexus is unavailable.

      ## Pass A — completeness

      This is not a git diff tool. Assess present code vs the plan.

      1. Read `$review-fix-plan.output.plan_path`. Build an intent inventory of
         concrete deliverables, acceptance criteria, tests, and plan decisions.
      2. Optionally read `$build-ralph-prd.output.prd_dir/prd.json` and
         `progress.txt` as hints. Treat `passes: true` as a claim, never proof.
      3. Bound scope to files/components the plan names, plus keyword search for
         the concepts each requirement describes. Do not invent extra product
         scope.
      4. Classify every gap:
         - `missing`: required work absent
         - `partial`: exists but does not fully satisfy the plan item
         - `contradicts`: code conflicts with stated intent or a MUST rule
         - `unrequested`: code not called for by the plan (awareness only —
           append a review/justify-or-remove task, do not delete code)
      5. Severity: CRITICAL (MUST-rule or blocks baseline behavior), HIGH (core
         requirement missing/partial), MEDIUM (secondary / unclear unrequested),
         LOW (polish).

      ## Pass B — hidden problems

      Completeness is not enough. Do a full review pass. Do not stop after the
      first finding. Do NOT run the project test suite here.

      - Focus on risks introduced by the changed code, but inspect surrounding
        code, call sites, shared helpers, tests, and invariants for root cause.
      - For any new or changed logic, construct at least one concrete input or
        state and trace it through the code looking for a case that produces a
        wrong result, label, or set without erroring.
      - For a claimed durable fix, reconstruct the failing sequence and required
        invariant; inspect sibling paths and shared state; ask whether the same
        authorized failure remains reachable. If it does, report the concrete
        path and the earliest shared boundary that would make the invariant hold.
      - Treat security issues, performance regressions, breaking changes,
        insufficient error handling, and silent wrong values as risks.
      - Simplification means reducing complexity (dedup, clearer control flow).
        It does NOT mean removing features or stripping intentional output.
      - Do not infer a systemic flaw from code shape or duplication alone.
        Do not demand a shared abstraction without a concrete reachable path,
        violated invariant, or competing semantic owner.
      - Do not expand user scope. Do not turn optional broader improvements
        into blockers. Do not report styling, formatting, lint, or typecheck.
      - Never add a plan task whose only proof would be grepping source for a
        string. Tasks must be observable behavior, tests, or typed contracts.
      - Anchor every hidden finding to file:line evidence when possible.

      ## Writes (append-only)

      The only write is appending tasks to `$review-fix-plan.output.plan_path`.
      Do not rewrite existing plan sections. Do not edit prd.json. Do not
      modify application code.

      If Pass A and Pass B have zero actionable findings: leave the plan
      byte-for-byte unchanged. `gate` = `PASS`, `tasks_added` = 0,
      `hidden_findings_count` = 0.

      If any actionable finding remains: APPEND a `## Convergence` section (or
      a new numbered one if one already exists) with concrete Ralph-ready
      tasks: exact files, tests, commands, acceptance criteria, TDD order,
      source-ref (plan item or hidden finding id), and gap-type. Order
      CRITICAL/HIGH first. `gate` = `FAIL`. `tasks_added` = count appended.
      `hidden_findings_count` = count of Pass B findings that produced a task.

      Write `$ARTIFACTS_DIR/superpowers/converge-audit.md` with both passes
      (checklist + hidden findings table with evidence).
      Return only JSON. `plan_path` is the repo-relative Superpowers plan file.

      Prefer FAIL when a gap cannot be decided from evidence.
    output_format:
      type: object
      properties:
        gate:
          type: string
          enum: [PASS, FAIL]
        tasks_added:
          type: number
        hidden_findings_count:
          type: number
        plan_path:
          type: string
        summary:
          type: string
      required: [gate, tasks_added, hidden_findings_count, plan_path, summary]

  - id: converge-gate
    depends_on: [converge-review]
    route_loop:
      condition: "$converge-review.output.gate == 'PASS'"
      max_iterations: 3
      routes:
        positive: create-pull-request
        negative: converge-review-gate
        exhausted: final-sync-plan-to-ralph

  - id: converge-review-gate
    plannotator_gate:
      document: "$converge-review.output.plan_path"
      message: |
        Codex converge added $converge-review.output.tasks_added task(s) to the
        Superpowers plan (coverage gaps + hidden problems:
        $converge-review.output.hidden_findings_count).

        Plan: $converge-review.output.plan_path
        Summary: $converge-review.output.summary

        Review the newly added tasks in the plan Markdown.
        - **Owner only:** Approve or Send Annotations.
        - Teammates may Close without ending the session (`--persist-session`).
        - After Approve: new tasks are synced into the Ralph PRD and Ralph runs again.

        Crash recovery: `archon workflow review-open <run-id>` (then `resume` if needed).
      capture_response: true
      rework:
        provider: codex
        model: gpt-5.5
        effort: xhigh
        prompt: |
          You are handling human Plannotator annotations on Superpowers plan tasks
          added by converge-review.

          Markdown path under review: $REVIEW_DOCUMENT
          Annotations:
          $REVIEW_ANNOTATIONS

          Converge context: tasks_added=$converge-review.output.tasks_added
          Canonical plan: $converge-review.output.plan_path

          ## Instructions
          1. Confirm `$REVIEW_DOCUMENT` is the Superpowers plan markdown.
          2. Apply each actionable annotation directly to the new or related tasks.
          3. Preserve unrelated, pre-existing, and completed plan content.
          4. Treat a pure approval or acknowledgement as a no-op.
          5. Do not implement production code. Do not edit prd.json.
          6. Do not generate HTML and do not start another Plannotator session.
          7. Print only the absolute path to the updated plan markdown.
             Do not add a Markdown fence or commentary.

  - id: sync-plan-to-ralph
    description: Append new plan tasks as passes-false Ralph stories; keep completed stories.
    depends_on:
      - converge-review-gate
    provider: omp
    effort: xhigh
    model: openai-codex/gpt-5.5
    context: fresh
    prompt: |
      ## Task

      Plannotator approved an updated Superpowers plan. Sync NEW tasks into the
      existing Ralph PRD without resetting completed stories.

      Plan file: `$converge-review.output.plan_path`
      PRD directory: `$build-ralph-prd.output.prd_dir`

      1. Read the plan and `$build-ralph-prd.output.prd_dir/prd.json`.
      2. Keep every existing story with `passes: true` unchanged (same id).
      3. For each new or still-open plan task that is not already a `passes: true`
         story, add or update a Ralph story with `passes: false`, concrete
         acceptance criteria, technicalNotes, dependsOn (only lower-priority
         existing or new ids), and the next free `US-00N` id for brand-new stories.
      4. Do not delete passing stories. Do not implement code.
      5. Write updated `prd.json` and refresh the story-overview table in `prd.md`.
      6. Verify prd.json is valid JSON with a non-empty userStories array.

      Return only JSON.
    output_format:
      type: object
      properties:
        prd_dir:
          type: string
        stories_added:
          type: number
        summary:
          type: string
      required: [prd_dir, stories_added, summary]

  - id: final-sync-plan-to-ralph
    description: Exhaustion path — sync plan tasks into the PRD with no HITL.
    depends_on:
      - converge-gate
    provider: omp
    effort: xhigh
    model: openai-codex/gpt-5.5
    context: fresh
    prompt: |
      ## Task

      The converge/Plannotator retry budget is exhausted. Sync remaining Superpowers
      plan tasks into the existing Ralph PRD with no human review, then stop.
      Do not implement production code.

      Plan file: `$converge-review.output.plan_path`
      PRD directory: `$build-ralph-prd.output.prd_dir`

      1. Read the plan and `$build-ralph-prd.output.prd_dir/prd.json`.
      2. Keep every existing story with `passes: true` unchanged (same id).
      3. For each new or still-open plan task that is not already a `passes: true`
         story, add or update a Ralph story with `passes: false`, concrete
         acceptance criteria, technicalNotes, dependsOn (only lower-priority
         ids), and the next free `US-00N` id for brand-new stories.
      4. Do not delete passing stories.
      5. Write updated `prd.json` and refresh the story-overview table in `prd.md`.
      6. Verify prd.json is valid JSON with a non-empty userStories array.

      Return only JSON.
    output_format:
      type: object
      properties:
        prd_dir:
          type: string
        stories_added:
          type: number
        summary:
          type: string
      required: [prd_dir, stories_added, summary]

  - id: final-validate-prd
    description: Record PRD dir before the final Ralph pass.
    depends_on:
      - final-sync-plan-to-ralph
    bash: |
      set -euo pipefail
      PRD_DIR=$build-ralph-prd.output.prd_dir
      if [ -z "$PRD_DIR" ] || [ ! -f "$PRD_DIR/prd.json" ]; then
        echo "ERROR: no prd.json in build-ralph-prd prd_dir ('$PRD_DIR')." >&2
        exit 1
      fi
      if [ ! -f "$PRD_DIR/prd.md" ]; then
        echo "ERROR: prd.md not found in $PRD_DIR" >&2
        exit 1
      fi
      mkdir -p "$ARTIFACTS_DIR/superpowers"
      printf '%s\n' "$PRD_DIR" > "$ARTIFACTS_DIR/superpowers/prd-dir.txt"
      echo "PRD_DIR=$PRD_DIR"
      echo "BRANCH=$(git branch --show-current)"
      TOTAL=$(jq '.userStories | length' "$PRD_DIR/prd.json")
      DONE=$(jq '[.userStories[] | select(.passes == true)] | length' "$PRD_DIR/prd.json")
      echo "STORIES_TOTAL=$TOTAL"
      echo "STORIES_DONE=$DONE"
      echo "STORIES_REMAINING=$((TOTAL - DONE))"

  - id: final-ralph-loop-run
    description: Final in-parent Ralph pass with no HITL.
    depends_on:
      - final-validate-prd
    idle_timeout: 3600000
    provider: omp
    effort: high
    model: xai-oauth/grok-4.5
    output_format:
      type: object
      properties:
        done:
          type: boolean
          description: true ONLY when every story in prd.json has passes true; false otherwise.
        mode:
          type: string
        story_id:
          type: string
        note:
          type: string
      required:
        - done
    loop:
      command: archon-ralph-project-aware-iteration
      fresh_context: true
      max_iterations: 35
      until_bash: |
        set -euo pipefail
        PRD_FILE="$ARTIFACTS_DIR/superpowers/prd-dir.txt"
        [ -f "$PRD_FILE" ] || exit 1
        PRD_DIR=$(cat "$PRD_FILE")
        [ -n "$PRD_DIR" ] && [ -f "$PRD_DIR/prd.json" ] || exit 1
        jq -e '.userStories | type == "array" and length > 0 and all(.[]; .passes == true)' "$PRD_DIR/prd.json" >/dev/null

  - id: create-pull-request
    description: Create the pull request after converge PASS.
    command: archon-create-pr
    provider: codex
    model: gpt-5.5
    effort: medium
    context: fresh
    idle_timeout: 900000
    depends_on:
      - converge-gate
    output_type: pull-request

  - id: create-pull-request-final
    description: Create the pull request after the exhausted final Ralph pass.
    command: archon-create-pr
    provider: codex
    model: gpt-5.5
    effort: medium
    context: fresh
    idle_timeout: 900000
    depends_on:
      - final-ralph-loop-run
    output_type: pull-request
