name: speckit-ralph-native-feature-new
description: |
  Use when: User wants the Speckit SDD pipeline whose Ralph implement step is
            archon-ralph-dag-project-aware, one tasks.md Tnnn per iteration.
  Triggers: "speckit ralph native new", "speckit ralph one task",
            "ralph one task per loop", "speckit project-aware ralph".
  Does: Specify → clarify (Plannotator when questions exist) → red-team
        (Plannotator) → plan → tasks → analyze → convert each unchecked Tnnn
        into one Ralph userStory → archon-ralph-dag-project-aware
        (isolation: inherit; one story per loop) → sync-back → converge.
        Converge FAIL: review tasks in Plannotator, then rerun the same Ralph chain.
        The parent workflow owns the final commit, push, and pull request.
  NOT for: The batch Ralph loop (speckit-ralph-native-feature / tasks-to-prd.sh).
  NOT for: Quick one-file fixes, bug fixes, PR reviews.
  NOT for: When a spec already exists (use archon-speckit-plan-to-tasks instead).
  NOT for: Spec generation only without planning (use archon-speckit-spec instead).
provider: codex
model: gpt-5.5
effort: xhigh
# Human gates (plannotator_gate) require foreground on web so the live annotate URL is usable.
interactive: true

nodes:
  - id: setup
    bash: |
      echo "=== SPECKIT SDD PIPELINE ==="
      echo "Feature: $ARGUMENTS"
      FEATURE_SLUG=$(echo "$ARGUMENTS" | tr '[:upper:]' '[:lower:]' | tr -s ' ' '-' | sed 's/[^a-z0-9-]//g' | sed 's/--*/-/g' | cut -c1-60)
      echo "FEATURE_SLUG=$FEATURE_SLUG"
      echo "PROJECT_ROOT=$(pwd)"
      echo "HEAD=$(git rev-parse --short HEAD 2>/dev/null || echo 'no-git')"
      git fetch --all --prune 2>/dev/null || true
      echo "ARTIFACTS_DIR=$ARTIFACTS_DIR"
      echo ""
      echo "Artifacts will be saved to: $ARTIFACTS_DIR"
      echo "Starting Step 1 of 7: Generating feature specification..."
  
  - id: specify
    prompt: |
      /speckit-specify create detail spec for $ARGUMENTS, 
      read related documents for understand the origin context and purpose, 
      save references document to let the next phases know the origin purpose, 
      read deeply to understand before writing, 
      don't guess, spawn sub-agents for help
    depends_on:
      - setup
    effort: xhigh
    provider: claude
    model: "fable"
    context: fresh

  - id: clarify
    prompt: |
      $speckit-clarifybatch --turn 10
    depends_on:
      - specify
    effort: xhigh
    provider: codex
    model: gpt-5.6-sol
    context: fresh

  - id: clarify-file-check
    bash: |
      set -euo pipefail
      source .specify/scripts/bash/common.sh

      repo_root=$(get_repo_root)
      feature_dir=$(read_feature_json_feature_directory "$repo_root")
      if [ -z "$feature_dir" ]; then
        echo "clarify-file-check: .specify/feature.json has no valid feature_directory" >&2
        exit 1
      fi
      if [[ "$feature_dir" != /* ]]; then
        feature_dir="$repo_root/$feature_dir"
      fi
      if [ ! -d "$feature_dir" ]; then
        echo "clarify-file-check: feature directory does not exist: $feature_dir" >&2
        exit 1
      fi

      questions_file="$feature_dir/clarification-questions.md"
      if [ -f "$questions_file" ]; then
        printf 'HAS_QUESTIONS\n'
      elif [ -e "$questions_file" ]; then
        echo "clarify-file-check: expected a regular file: $questions_file" >&2
        exit 1
      else
        printf 'NO_QUESTIONS\n'
      fi
    depends_on:
      - clarify

  - id: clarify-respond
    prompt: |
      ## Persona

      You are a SHARP SOLUTION ARCHITECT who lives by KISS and YAGNI. You
      DO NOT overthink. You DO NOT invent problems that don't exist. Your
      first instinct on any question is "is this a real problem?" — most
      aren't, and you skip those without ceremony. When the problem IS real,
      you pick the SIMPLEST durable answer that matches the feature intent and
      local project constraints — never the most elaborate architecture you can imagine. 
      You think in invariants and contracts because they keep things simple long-term,
      not because complexity impresses anyone. You push back on weak
      questions, reject band-aids, and reject over-engineering with equal
      force. You name trade-offs explicitly. No speculative abstractions.
      No feature flags or "TODO: revisit" comments. No future-proofing for
      requirements nobody has asked for.

      ## Task

      Draft answers to clarification questions in the file produced by the
      previous `clarify` node. The file is the single source of truth —
      no chat-only Q&A drafts.
      Run all commands from the current working directory; use only relative paths.

      ## Instructions
      1. Read .specify/feature.json to resolve <feature_directory>.
      2. If there is a grill-me reference, read it and follow all decisions.
      3. Read <feature_directory>/clarification-questions.md. Confirm it
         exists and has `Status: PENDING`. If missing or already ARCHIVED,
         STOP and report BLOCKED — do NOT fabricate questions.
      4. trigger speckit-clarification-answer-review skill
    depends_on:
      - clarify-file-check
    when: "$clarify-file-check.output == 'HAS_QUESTIONS'"
    effort: xhigh
    provider: omp
    model: "xai-oauth/grok-4.6"
    context: fresh

  - id: clarify-gate
    plannotator_gate:
      prepare:
        prompt: |
          ## Goal
          Using vietnamese
          Produce a self-contained HTML explainer for the clarification-questions file,
          then hand a **stable absolute path** to the next node (`plannotator_gate`).

          ## Steps
          1. Read `.specify/feature.json` to resolve `<feature_directory>`.
          2. Confirm `<feature_directory>/clarification-questions.md` exists (Status PENDING
             or drafted answers present). If missing, STOP and report BLOCKED.
          3. Generate a visual explainer for that file using
             `/plannotator-visual-explainer` (or equivalent). Content must:
             - Describe the feature and end-to-end flow (UML/sequence style) at
               function/class level where useful.
             - For each step, state what it does.
             - For each open clarification / issue: where it sits in the flow, why it
               is a problem, and the proposed resolution.
          4. **Persist the final HTML** at this exact path (overwrite OK):
             `<feature_directory>/visual/speckit-clarify-explainer.html`
             - Copy from wherever visual-explainer wrote the file if needed
               (`cp` / write).
             - Do **not** rely on an annotate session inside this node as the human
               gate — the next node opens a supervised live Plannotator review.
          5. Verify the file exists and is non-empty.

          ## Final output (contract — required)
          Print **ONLY**
          (no markdown fence, no extra commentary after the path):
          `<feature_directory>/visual/speckit-clarify-explainer.html`.
        effort: medium
        provider: claude
        model: sonnet
        allowed_tools:
          - Read
          - Edit
          - Glob
          - Grep
          - Bash
      message: |
        Clarification answers + explainer are ready for live Plannotator review.

        - Open the live annotate URL (Ask AI, annotations).
        - **Owner only:** Approve or Send Annotations.
        - Teammates may Close without ending the session (`--persist-session`).
        - After Approve, next step runs `$speckit-clarifybatch --apply`.

        Crash recovery: `archon workflow review-open <run-id>` (then `resume` if the process died).
      capture_response: true
      rework:
        provider: codex
        model: gpt-5.5
        effort: xhigh
        prompt: |
          You are handling human Plannotator annotations on clarification artifacts.
          Annotations are freeform reviewer notes. Classify each one before editing.

          HTML path under review: $REVIEW_DOCUMENT
          Annotations:
          $REVIEW_ANNOTATIONS

          Canonical source MD (answers live here — not under visual/):
          `<feature_directory>/clarification-questions.md`

          ## Two annotation kinds (pick exactly one per note)

          1. **content change** — reviewer wants different answer, status, wording, or
             missing content in the *source of truth*.
             → Edit `<feature_directory>/clarification-questions.md`, then regenerate HTML.

          2. **visual clarify / explain** — reviewer asks to explain, expand, or make
             something clearer in the *explainer* (questions like "what does this mean?",
             "show the flow in more detail", "elaborate here") without changing the
             committed answers/status in the MD.
             → Update/regenerate the HTML only. Do **not** edit the source MD.

          Pure LGTM / "looks good" / ack with no ask → no MD and no HTML rewrite.
          If ambiguous between (1) and (2), prefer **visual clarify** (HTML only) —
          never invent source-MD edits.

          ## Instructions
          1. Read `.specify/feature.json` for `<feature_directory>`.
          2. Read the source MD and the current HTML under review.
          3. Classify every annotation as content change, visual clarify, or no-op.
          4. Apply **content change** notes only to the source MD.
          5. If any content change or visual-clarify note needs work (or HTML is stale
             after an MD edit), write the explainer HTML to:
             `<feature_directory>/visual/speckit-clarify-explainer.html` (overwrite OK).
             Visual-clarify work may add diagrams, callouts, or deeper explanations in
             the HTML while keeping MD answers/status unchanged.
          6. Print ONLY the absolute path to that HTML for the next annotate session
             (one line, no fence). Prefer the stable path above, resolved absolute.
    depends_on:
      - clarify-respond

  - id: clarify-apply
    prompt: |
      $speckit-clarifybatch --apply
    depends_on:
      - clarify-gate
    provider: claude
    effort: xhigh
    model: sonnet
    context: fresh

    skills: [speckit-clarifybatch]
  - id: red-team
    prompt: |
      Read .specify/feature.json to resolve <feature_directory>, then run:
      $speckit.red-team.run <feature_directory> --yes
    depends_on:
      - clarify-file-check
      - clarify-respond
      - clarify-gate
      - clarify-apply
    trigger_rule: none_failed_min_one_success
    effort: high
    provider: claude
    model: "claude-opus-4-8[1M]"
    context: fresh
    skills: [speckit-red-team-run]
    denied_tools:
      - Bash

  - id: red-team-respond
    prompt: |
      ## Persona

      You are a SHARP SOLUTION ARCHITECT who lives by KISS and YAGNI. You
      DO NOT overthink. You DO NOT invent problems that don't exist. Your
      first instinct on any finding is "is this a real problem?" — most
      aren't, and you skip those without ceremony. When the problem IS real,
      you pick the SIMPLEST durable fix that matches the feature intent and
      local project constraints — never the most elaborate architecture you can imagine. You think in
      invariants and contracts because they keep things simple long-term,
      not because complexity impresses anyone. You push back on weak
      findings, reject band-aids, and reject over-engineering with equal
      force. You name trade-offs explicitly. No speculative abstractions.
      No feature flags or "TODO: revisit" comments. No future-proofing for
      requirements nobody has asked for.

      ## Task

      Draft per-finding resolutions for a red-team findings file produced by
      the previous `red-team` node. The file is the single source of truth —
      no chat-only RECAP drafts. Mirror of the `clarify-respond` flow above
      (file-centric, in-place edits).
      Run all commands from the current working directory; use only relative paths.

      ## Stance: critical-thinking, bounded-verification, long-term-only

      A red-team finding is an ACCUSATION, not a verdict. Treat each finding as
      a hypothesis to be tested against the feature artifacts before picking a
      resolution category. Do not auto-accept the reviewer's framing; do not
      auto-apply their proposed fix. Your job is to:
        (a) verify the finding's premise against the actual spec,
        (b) inspect narrowly relevant local code/docs only when needed to
            resolve an existing contract, API, data shape, or integration point,
        (c) propose the LONG-TERM resolution — never a work-around / band-aid.

      ## Instructions

      1. Read .specify/feature.json to resolve <feature_directory>.
      2. Glob `<feature_directory>/red-team-findings-*.md` and pick the MOST
         RECENT file whose filename does NOT contain `-applied-` (highest
         YYYY-MM-DD, then highest -NN). Confirm the file's §2 Findings table
         has `Status` blank (not yet resolved). If file missing, or already
         archived (filename contains `-applied-`), STOP and report BLOCKED —
         do NOT fabricate findings.
      3. Read `<feature_directory>/spec.md` for context.
      4. If there is a grill-me reference, read it and follow all decisions.

      5. trigger speckit-red-team-answer-review skill
    depends_on:
      - red-team
    effort: xhigh
    provider: codex
    model: "gpt-5.6-sol"
    context: fresh

  - id: red-team-gate
    plannotator_gate:
      prepare:
        prompt: |
          ## Goal
          Using vietnamese
          Produce a self-contained HTML explainer for the latest red-team findings
          file, then hand a **stable absolute path** to `red-team-gate`.

          ## Steps
          1. Read `.specify/feature.json` to resolve `<feature_directory>`.
          2. Glob `<feature_directory>/red-team-findings-*.md` and pick the MOST
             RECENT file whose name does NOT contain `-applied-`. If missing, STOP
             and report BLOCKED.
          3. Generate a visual explainer with `/plannotator-visual-explainer` for that
             file. Cover:
             - Feature + end-to-end flow (UML/sequence) at function/class level
             - Each step's purpose
             - **Only** findings with Status `spec-fix` or `new-OQ` (or blank Status
               still being resolved as those categories): where they sit in the flow,
               why they matter, proposed fix
          4. Persist final HTML at:
             `<feature_directory>/visual/speckit-red-team-explainer.html` (overwrite OK).
             Do not use this node's annotate session as the human gate.
          5. Verify the file exists and is non-empty.

          ## Final output (contract — required)
          Print **ONLY** `<feature_directory>/visual/speckit-red-team-explainer.html` (one line, no fence).
        effort: medium
        provider: claude
        model: sonnet
        allowed_tools:
          - Read
          - Edit
          - Glob
          - Grep
          - Bash
      message: |
        Red-team resolutions + explainer are ready for live Plannotator review.

        - **Owner only:** Approve or Send Annotations.
        - Teammates may Close without ending the session (`--persist-session`).
        - After Approve: `/speckit.red-team.apply --allow-historical-edits`.

        Crash recovery: `archon workflow review-open <run-id>` (then `resume` if needed).
      capture_response: true
      rework:
        provider: codex
        model: gpt-5.5
        effort: xhigh
        prompt: |
          You are handling human Plannotator annotations on red-team findings.
          Annotations are freeform reviewer notes. Classify each one before editing.

          HTML path under review: $REVIEW_DOCUMENT
          Annotations:
          $REVIEW_ANNOTATIONS

          Canonical source MD (findings / Status / Resolutions Log — not under visual/):
          latest non-applied `red-team-findings-*.md` under `<feature_directory>/`

          ## Two annotation kinds (pick exactly one per note)

          1. **content change** — reviewer wants different status, resolution text,
             severity, or other source-of-truth edits in the findings MD.
             → Edit that MD file, then regenerate HTML.

          2. **visual clarify / explain** — reviewer asks to explain, expand, or make
             a finding/resolution clearer in the *explainer* without changing the
             committed Status / Resolutions Log in the MD.
             → Update/regenerate the HTML only. Do **not** edit the findings MD.

          Pure LGTM / "looks good" / ack with no ask → no MD and no HTML rewrite.
          If ambiguous between (1) and (2), prefer **visual clarify** (HTML only) —
          never invent source-MD edits.

          ## Instructions
          1. Read `.specify/feature.json` for `<feature_directory>`.
          2. Open the latest non-applied findings MD and the current HTML under review.
          3. Classify every annotation as content change, visual clarify, or no-op.
          4. Apply **content change** notes only to the findings MD.
          5. If any content change or visual-clarify note needs work (or HTML is stale
             after an MD edit), write the explainer HTML to:
             `<feature_directory>/visual/speckit-red-team-explainer.html` (overwrite OK).
             Visual-clarify work may add diagrams, callouts, or deeper explanations in
             the HTML while keeping MD Status / Resolutions Log unchanged.
          6. Print ONLY the absolute path to that HTML for the next annotate session
             (one line, no fence). Prefer the stable path above, resolved absolute.
    depends_on:
      - red-team-respond

  - id: red-team-apply
    prompt: |
      /speckit.red-team.apply --allow-historical-edits
    depends_on:
      - red-team-gate
    provider: claude
    effort: xhigh
    model: sonnet
    context: fresh
    skills: [speckit-red-team-apply]

  - id: plan
    prompt: |
      Read .specify/feature.json to resolve <feature_directory>, then run:
      /speckit-plan create detail plan <feature_directory>
    depends_on:
      - red-team-apply
    effort: xhigh
    provider: codex
    model: "gpt-6-astra"
    context: fresh

  - id: tasks
    prompt: |
      Read .specify/feature.json to resolve <feature_directory>, then run:
      /speckit-tasks <feature_directory>
    depends_on:
      - plan
    effort: xhigh
    provider: omp
    model: "xai-oauth/grok-4.6"
    context: fresh

  - id: analyze
    prompt: |
      Read .specify/feature.json to resolve <feature_directory>.
      If there is a grill-me reference, read it and follow all decisions.
      Then run:
      /speckit-analyzebatch <feature_directory>
    depends_on:
      - tasks
    provider: codex
    effort: xhigh
    model: gpt-5.6-sol
    context: fresh

  - id: analyze-respond
    prompt: |
      ## Persona

      You are a SHARP SOLUTION ARCHITECT who lives by KISS and YAGNI. You
      DO NOT overthink. You DO NOT invent problems that don't exist. Your
      first instinct on any finding is "is this a real problem?" — most
      aren't, and you skip those without ceremony. When the problem IS real,
      you pick the SIMPLEST durable fix that matches the feature intent and
      local project constraints — never the most elaborate architecture you can imagine. You think in
      invariants and contracts because they keep things simple long-term,
      not because complexity impresses anyone. You push back on weak
      findings, reject band-aids, and reject over-engineering with equal
      force. You name trade-offs explicitly. No speculative abstractions.
      No feature flags or "TODO: revisit" comments. No future-proofing for
      requirements nobody has asked for.

      ## Task

      Draft per-finding resolutions for the analyze findings file produced
      by the previous `analyze` node. The file is the single source of
      truth — no chat-only RECAP drafts.
      Run all commands from the current working directory; use only relative paths.

      ## Instructions

      1. Read .specify/feature.json to resolve <feature_directory>.
      2. Glob `<feature_directory>/analyze-findings-*.md` and pick the MOST
         RECENT file whose filename does NOT contain `-applied-` (highest
         YYYY-MM-DD, then highest -NN). Confirm the file's header has
         `Status: PENDING` and §2 Findings table has the `Status` column blank.
         If the file is missing, or already archived (filename contains
         `-applied-`), STOP and report BLOCKED — do NOT fabricate findings.
      3. Read `<feature_directory>/spec.md`, `plan.md`, and `tasks.md` for context.
      4. For EACH finding row in §2 Findings, INVESTIGATE FIRST — do not punt
         ambiguity to a human when the answer is available in bounded local
         context. Start with spec.md / plan.md / tasks.md. Inspect code only
         when the finding depends on an existing API, data model, integration
         point, workflow, or documented behavior. Do NOT inspect sibling or
         external repositories unless the user's feature request explicitly
         names them.

         **Scope-preservation invariant (read first):** if the finding asks
         for a broader redesign outside this feature's stated scope, do not
         route it to `spec-fix`. Use `skipped`, `out-of-scope`, or
         `accepted-risk` as appropriate and cite the local evidence you used.

         Only then choose ONE resolution category:
           - spec-fix       finding is valid AND you derived the correct answer
                            from requirements, feature artifacts, or narrowly
                            relevant local code/docs. Propose a concrete diff
                            to spec.md / plan.md / tasks.md (the artifact named
                            in the §2 Location column) and explain WHY that
                            answer is correct in the `Rationale:` line.
           - accepted-risk  acknowledge but do not edit; record under
                            `## Accepted Risks` of the relevant artifact.
           - out-of-scope   cross-reference only; no artifact edit.
           - skipped        Use when ANY of:
                              (a) finding's premise is wrong (the artifact
                                  doesn't actually say what the finding claims,
                                  or the inconsistency dissolves on read);
                              (b) recommended fix CONFLICTS with verified
                                  requirements or a required local contract;
                              (c) the finding asks the spec to expand beyond
                                  the feature scope without evidence that the
                                  broader redesign is required.
                            Reason MUST cite the verification source
                            (file:line + quoted snippet, or the artifact
                            path:line that disproves the premise).
      5. Edit the findings file IN-PLACE using the Edit tool. For EACH finding ID:
         a. §2 Findings table — fill the `Status` column with the chosen category.
         b. §3 Resolutions Log block — fill the payload per category:
              - spec-fix: `Target: <path>` (typically `<feature_directory>/spec.md`,
                `plan.md`, or `tasks.md`), then a `Before:` / `After:` snippet pair.

                LITERAL-SUBSTRING CONTRACT (CRITICAL — apply will reject anything
                else with `Before-snippet not found in <target>`):
                  * `Before:` MUST be a VERBATIM SUBSTRING of `Target:` —
                    literal text COPIED from the file using the Read tool.
                    NOT a paraphrase. NOT a description of the gap.
                    NOT a directive like "FR-X is missing …".
                  * `After:` MUST be the intended replacement of that exact
                    `Before:` text (so apply can do `target.replace(before, after)`
                    mechanically).
                  * `Before:` MUST appear EXACTLY ONCE in `Target:`. After
                    drafting, run `grep -c -F "<Before>" <Target>` and confirm
                    the result is `1`. If `0`, you paraphrased — re-read
                    `Target:` and copy literal text. If `>1`, expand `Before:`
                    with surrounding context until unique.

                WRONG (will fail apply):
                  Before: FR-021 is missing a result-subtype mapping for max_tokens.
                  After:  Add a row stating max_tokens maps to error_during_execution.

                RIGHT (passes apply):
                  Before: | error_during_execution | runtime errors | errors[0] populated |
                  After:  | error_during_execution | runtime errors, max_tokens, model_context_window_exceeded | errors[0] populated |

                After the Before/After pair, ALSO emit a `Rationale:` line
                (one paragraph) explaining HOW you derived the After text:
                cite the file paths, symbols, table rows, or local docs
                that prove this is the correct answer. The maintainer reads
                this to verify your reasoning, not just your diff.

              - accepted-risk: `Rationale:` (one paragraph) + optional `Tags:`
                line. Include `[regulatory-review]` tag when the finding touches
                money path / regulatory path / compliance / disclosure / KYC /
                AML / SEC / SFC / FCA / GDPR signals (apply phase will also
                auto-tag, but be explicit when obvious).
              - out-of-scope: `Cross-reference: <spec path or ID>` + `Reason:`.
              - skipped: `Reason: <why>`.
      6. Do NOT modify finding ID, category, severity, location, summary, or
         recommendation in §2. Do NOT touch §1 Session Summary or §5 Session
         Metadata YAML — `/speckit-analyzebatch --apply` manages those at apply time.
      7. After editing, print "RESOLUTIONS_DRAFTED" and the absolute path of
         the findings file, then STOP.
    depends_on:
      - analyze
    effort: xhigh
    provider: omp
    model: "xai-oauth/grok-4.6"
    context: fresh

  - id: analyze-apply
    prompt: |
      $speckit-analyzebatch --apply --allow-historical-edits
    depends_on:
      - analyze-respond
    provider: claude
    effort: xhigh
    model: sonnet
    context: fresh

    skills: [speckit-analyzebatch]
    
  # One unchecked Tnnn → one project-aware userStory. Do NOT call tasks-to-prd.sh
  # (that script batches by Phase/###). The same chain runs initially and after
  # each approved convergence review.
  - id: ralph-tasks-to-ralph
    script: &speckit_tasks_to_ralph |
      import { existsSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
      import { isAbsolute, join, resolve } from "node:path";
      
      interface SpeckitTask {
        id: string;
        text: string;
        parallel: boolean;
        done: boolean;
        phaseTitle: string;
        subgroupTitle: string;
      }
      
      interface RalphStory {
        id: string;
        title: string;
        description: string;
        acceptanceCriteria: string[];
        technicalNotes: string;
        dependsOn: string[];
        priority: number;
        passes: boolean;
        notes: string;
      }
      
      interface FeatureJson {
        feature_directory?: unknown;
        ralph_prd_file?: string;
        ralph_progress_file?: string;
        [key: string]: unknown;
      }
      
      interface ConvertResult {
        prd_dir: string;
        story_count: number;
        has_tasks: boolean;
      }
      
      function spawnText(cmd: string, args: string[]): string {
        const r = Bun.spawnSync([cmd, ...args], { stdout: "pipe", stderr: "pipe" });
        const err = typeof r.stderr === "string" ? r.stderr : new TextDecoder().decode(r.stderr || new Uint8Array());
        const out = typeof r.stdout === "string" ? r.stdout : new TextDecoder().decode(r.stdout || new Uint8Array());
        if (r.exitCode !== 0) throw new Error(err.trim() || cmd + " failed");
        return out.trim();
      }
      
      function relFromRoot(root: string, abs: string): string {
        const resolvedRoot = resolve(root);
        const resolvedAbs = resolve(abs);
        if (resolvedAbs === resolvedRoot) return ".";
        if (resolvedAbs.startsWith(resolvedRoot + "/")) return resolvedAbs.slice(resolvedRoot.length + 1);
        return resolvedAbs;
      }
      
      function parseTasksMd(text: string): SpeckitTask[] {
        const lines = text.split(/\r?\n/);
        let phase = 0;
        let phaseTitle = "";
        let subgroupTitle = "";
        const tasks: SpeckitTask[] = [];
        for (const line of lines) {
          if (/^##\s+Phase\s+\d+/i.test(line)) {
            phase += 1;
            subgroupTitle = "";
            phaseTitle = line.replace(/^##\s+/, "").replace(/\t/g, "    ").trim();
            continue;
          }
          if (/^###\s+/.test(line)) {
            if (phase === 0) continue;
            subgroupTitle = line.replace(/^###\s+/, "").replace(/\t/g, "    ").trim();
            continue;
          }
          const m = line.match(/^(\s*)-\s+\[([ xX])\]\s+(T\d{3})\b(.*)$/);
          if (!m) continue;
          const textRest = m[4].replace(/^\s+/, "").replace(/\t/g, "    ");
          if (phase === 0) {
            phase = 1;
            phaseTitle = "Phase 1";
          }
          tasks.push({
            id: m[3],
            text: textRest,
            parallel: /(^|\s)\[P\](\s|$)/.test(textRest),
            done: m[2] !== " ",
            phaseTitle,
            subgroupTitle,
          });
        }
        return tasks;
      }
      
      function computeDepends(all: SpeckitTask[]): Map<string, string[]> {
        const depends = new Map<string, string[]>();
        let checkpoint: string[] = [];
        let parallelGroup: string[] = [];
        for (const t of all) {
          if (t.parallel) {
            depends.set(t.id, checkpoint.slice());
            parallelGroup.push(t.id);
          } else {
            const prev = parallelGroup.length > 0 ? parallelGroup.slice() : checkpoint.slice();
            depends.set(t.id, prev);
            checkpoint = [t.id];
            parallelGroup = [];
          }
        }
        return depends;
      }
      
      const root = spawnText("git", ["rev-parse", "--show-toplevel"]);
      const featureJsonPath = join(root, ".specify/feature.json");
      if (!existsSync(featureJsonPath)) throw new Error("missing .specify/feature.json");
      const feature = JSON.parse(readFileSync(featureJsonPath, "utf8")) as FeatureJson;
      let featureDir = feature.feature_directory;
      if (typeof featureDir !== "string" || featureDir.length === 0) {
        throw new Error("feature.json has no feature_directory");
      }
      if (!isAbsolute(featureDir)) featureDir = join(root, featureDir);
      const tasksPath = join(featureDir, "tasks.md");
      if (!existsSync(tasksPath)) throw new Error("tasks.md missing at " + tasksPath);
      const raw = readFileSync(tasksPath, "utf8");
      const specRel = relFromRoot(root, featureDir);
      let project = specRel.split("/").pop() || "feature";
      const fm = raw.match(/^---\n([\s\S]*?)\n---/);
      if (fm) {
        const d = fm[1].match(/^description:\s*(.*)$/m);
        if (d) {
          const desc = d[1].replace(/^["']|["']$/g, "").trim();
          if (desc) project = desc;
        }
      }
      let description = project;
      const header = raw.match(/^# Tasks:\s*(.+)$/m);
      if (header) description = header[1].trim();
      
      const all = parseTasksMd(raw);
      const dependsAll = computeDepends(all);
      const emitted = all.filter((t: SpeckitTask) => !t.done);
      const emittedIds = new Set(emitted.map((t: SpeckitTask) => t.id));
      const userStories: RalphStory[] = emitted.map((t: SpeckitTask, i: number) => {
        const title = t.text.replace(/(^|\s)\[P\](\s|$)/g, " ").replace(/\s+/g, " ").trim().slice(0, 80);
        const ac: string[] = ["Implement " + t.id + " exactly as specified in tasks.md"];
        if (/test|spec/i.test(t.text)) ac.push("Tests pass");
        ac.push("Typecheck passes");
        if (/(^|\s)\[GATE\](\s|$)/.test(t.text)) ac.push("Named gate commands in the task text exit 0");
        const noteParts = [
          "Phase: " + t.phaseTitle,
          t.subgroupTitle ? "Slice: " + t.subgroupTitle : "",
          "Read " + specRel + "/spec.md, " + specRel + "/plan.md, and the " + t.id + " line in " + specRel + "/tasks.md.",
          "Implement ONLY this task. Finish, update prd.json passes, and hand the validated changes to the parent.",
        ].filter((part: string) => part.length > 0);
        return {
          id: t.id,
          title: title || t.id,
          description: t.text,
          acceptanceCriteria: ac,
          technicalNotes: noteParts.join(" "),
          dependsOn: (dependsAll.get(t.id) || []).filter((id: string) => emittedIds.has(id)),
          priority: i + 1,
          passes: false,
          notes: "",
        };
      });
      
      const prdPath = join(featureDir, "prd.json");
      const mdPath = join(featureDir, "prd.md");
      const progressPath = join(featureDir, "progress.txt");
      writeFileSync(prdPath, JSON.stringify({ feature: description, userStories }, null, 2) + "\n");
      const rows = userStories.map((s: RalphStory) => {
        const deps = s.dependsOn.length > 0 ? s.dependsOn.join(", ") : "—";
        return "| " + s.id + " | " + s.priority + " | " + s.title.replace(/\|/g, "/") + " | " + deps + " |";
      });
      writeFileSync(
        mdPath,
        [
          "# " + description,
          "",
          project,
          "",
          "Spec directory: `" + specRel + "`",
          "",
          "Each Ralph iteration implements **exactly one** `tasks.md` task (one `userStories[]` row).",
          "Do not batch Phase or slice groups. Finish the selected story, update `prd.json`, and leave Git lifecycle work to the parent.",
          "",
          "## Stories",
          "",
          "| ID | Priority | Title | Depends on |",
          "|----|----------|-------|------------|",
          rows.length ? rows.join("\n") : "| — | — | (no unchecked Tnnn tasks) | — |",
          "",
        ].join("\n"),
      );
      writeFileSync(progressPath, "");
      feature.ralph_prd_file = relFromRoot(root, prdPath);
      feature.ralph_progress_file = relFromRoot(root, progressPath);
      writeFileSync(featureJsonPath, JSON.stringify(feature, null, 2) + "\n");
      
      const artifactsDir = process.env.ARTIFACTS_DIR;
      if (!artifactsDir) throw new Error("ARTIFACTS_DIR is required");
      mkdirSync(join(artifactsDir, "speckit"), { recursive: true });
      writeFileSync(join(artifactsDir, "speckit", "prd-dir.txt"), resolve(featureDir) + "\n");
      
      const result: ConvertResult = {
        prd_dir: resolve(featureDir),
        story_count: userStories.length,
        has_tasks: userStories.length > 0,
      };
      process.stderr.write("converted " + String(userStories.length) + " unchecked Tnnn task(s) to one-story Ralph PRD\n");
      process.stdout.write(JSON.stringify(result) + "\n");
    runtime: bun
    timeout: 60000
    depends_on:
      - analyze-apply
      - speckit-converge-review-gate
    trigger_rule: one_success


  - id: ralph-implement
    workflow: archon-ralph-dag-project-aware
    input: '$ralph-tasks-to-ralph.output.prd_dir'
    isolation: inherit
    depends_on:
      - ralph-tasks-to-ralph
    when: "$ralph-tasks-to-ralph.output.has_tasks == true"

  - id: ralph-implementation-complete
    depends_on: [ralph-implement]
    when: "$ralph-implement.output.done == true"
    bash: |
      echo "Ralph implementation complete; continuing parent convergence."

  - id: ralph-implementation-blocked
    depends_on: [ralph-implement]
    when: "$ralph-implement.output.done == false"
    bash: |
      echo "Ralph implementation returned a blocker; stopping before convergence and PR." >&2
      exit 1

  - id: ralph-sync-back
    script: &speckit_ralph_sync |
      import { appendFileSync, existsSync, mkdirSync, readFileSync, renameSync, writeFileSync } from "node:fs";
      import { isAbsolute, join } from "node:path";
      
      function spawnText(cmd: string, args: string[]): string {
        const r = Bun.spawnSync([cmd, ...args], { stdout: "pipe", stderr: "pipe" });
        const err = typeof r.stderr === "string" ? r.stderr : new TextDecoder().decode(r.stderr || new Uint8Array());
        const out = typeof r.stdout === "string" ? r.stdout : new TextDecoder().decode(r.stdout || new Uint8Array());
        if (r.exitCode !== 0) throw new Error(err.trim() || cmd + " failed");
        return out.trim();
      }
      
      function resolveFromRoot(root: string, value: string): string {
        if (!value) return value;
        return isAbsolute(value) ? value : join(root, value);
      }
      
      const artifactsDir = process.env.ARTIFACTS_DIR;
      if (!artifactsDir) throw new Error("ARTIFACTS_DIR is required");
      
      const root = spawnText("git", ["rev-parse", "--show-toplevel"]);
      const featureJsonPath = join(root, ".specify/feature.json");
      if (!existsSync(featureJsonPath)) throw new Error("Missing " + featureJsonPath);
      const feature = JSON.parse(readFileSync(featureJsonPath, "utf8")) as {
        ralph_prd_file?: unknown;
        ralph_progress_file?: unknown;
        feature_directory?: unknown;
      };
      if (typeof feature.feature_directory !== "string" || feature.feature_directory.length === 0) {
        throw new Error("feature.json has no feature_directory");
      }
      const featureDir = resolveFromRoot(root, feature.feature_directory);
      const tasksPath = join(featureDir, "tasks.md");
      if (!existsSync(tasksPath)) throw new Error("Missing " + tasksPath);
      
      const prdRel = typeof feature.ralph_prd_file === "string" ? feature.ralph_prd_file : "";
      const prdPath = resolveFromRoot(root, prdRel);
      if (!prdRel || !existsSync(prdPath)) {
        console.log("[info] no prd.json; nothing to sync");
        process.exit(0);
      }
      const progressRel = typeof feature.ralph_progress_file === "string" ? feature.ralph_progress_file : "";
      const progressPath = progressRel ? resolveFromRoot(root, progressRel) : "";
      
      const prd = JSON.parse(readFileSync(prdPath, "utf8")) as {
        userStories?: Array<{ passes?: boolean; id?: string; tasks?: Array<{ passes?: boolean; id?: string }> }>;
      };
      const passed = new Set<string>();
      for (const story of prd.userStories ?? []) {
        if (story.passes === true && typeof story.id === "string") passed.add(story.id);
        for (const task of story.tasks ?? []) {
          if (task.passes === true && typeof task.id === "string") passed.add(task.id);
        }
      }
      
      const taskLines = readFileSync(tasksPath, "utf8").split(/\r?\n/);
      let flipped = 0;
      const next = taskLines.map((line) => {
        if (!/^\s*-\s+\[ \]\s+T\d{3}\b/.test(line)) return line;
        const parts = line.trim().split(/\s+/);
        const id = parts.find((p) => /^T\d{3}$/.test(p));
        if (!id || !passed.has(id)) return line;
        flipped += 1;
        console.error("[flip] " + id);
        return line.replace("[ ]", "[X]");
      });
      writeFileSync(tasksPath, next.join("\n"));
      console.error("[summary] flipped " + String(flipped) + " task(s)");
      
      const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
      let archiveDir = join(featureDir, "archive", stamp);
      if (existsSync(archiveDir)) archiveDir = archiveDir + "-" + String(process.pid);
      mkdirSync(archiveDir, { recursive: true });
      renameSync(prdPath, join(archiveDir, "prd.json"));
      if (progressPath && existsSync(progressPath)) renameSync(progressPath, join(archiveDir, "progress.txt"));
      const mdPath = join(featureDir, "prd.md");
      if (existsSync(mdPath)) renameSync(mdPath, join(archiveDir, "prd.md"));
      mkdirSync(join(artifactsDir, "speckit"), { recursive: true });
      appendFileSync(join(artifactsDir, "speckit", "archive-dirs.txt"), archiveDir + "\n");
      console.log("[archive] " + archiveDir);
    runtime: bun
    timeout: 60000
    depends_on:
      - ralph-implementation-complete
      - ralph-no-tasks
    trigger_rule: one_success

  - id: ralph-no-tasks
    bash: |
      echo "no unchecked Tnnn tasks; skipping Ralph implement"
    depends_on:
      - ralph-tasks-to-ralph
    when: "$ralph-tasks-to-ralph.output.has_tasks == false"

  - id: speckit-converge
    prompt: |
      Read .specify/feature.json to resolve <feature_directory>.
      run speckit-converge
      Return PASS only when there are no any problem.
      Return FAIL when it added one or more tasks to tasks.md .
    depends_on:
      - ralph-sync-back
    provider: codex
    effort: xhigh
    model: gpt-5.6-sol
    context: fresh
    output_format:
      type: object
      properties:
        gate:
          type: string
          enum: [PASS, FAIL]
        tasks_added:
          type: number
      required:
        - gate
        - tasks_added
    output_type: speckit-convergence

  # PASS → PR preparation; FAIL → reviewed rerun of the same Ralph chain; exhausted → one final Ralph pass.
  - id: speckit-converge-gate
    depends_on: [speckit-converge]
    route_loop:
      condition: "$speckit-converge.output.gate == 'PASS'"
      max_iterations: 3
      routes:
        positive: cargo-clean-before-pr
        negative: speckit-converge-review-gate
        exhausted: speckit-final-ralph-tasks-to-ralph

  - id: speckit-converge-review-gate
    plannotator_gate:
      prepare:
        prompt: |
          ## Goal
          Open the active feature's `tasks.md` directly in the supervised
          `speckit-converge-review-gate` session.

          Converge reported:
          - gate: $speckit-converge.output.gate
          - tasks_added: $speckit-converge.output.tasks_added

          ## Steps
          1. Read `.specify/feature.json` to resolve `<feature_directory>`.
          2. Confirm `<feature_directory>/tasks.md` exists, is a regular file, and is readable.
          3. Resolve it to an absolute path.
          4. Do not generate HTML and do not start a separate Plannotator session.
             The supervised gate opens the returned Markdown file.

          ## Final output (contract — required)
          Print only the absolute path to `<feature_directory>/tasks.md`.
          Do not add a Markdown fence or commentary.
        effort: medium
        provider: claude
        model: sonnet
        allowed_tools:
          - Read
          - Bash
      message: |
        Speckit convergence added $speckit-converge.output.tasks_added task(s) to `tasks.md`.

        Review the tasks added by this converge pass directly in `tasks.md`.
        - **Owner only:** Approve or Send Annotations.
        - Teammates may Close without ending the session (`--persist-session`).
        - After Approve: re-run `ralph-tasks-to-ralph` and the Ralph implementation loop.

        Crash recovery: `archon workflow review-open <run-id>` (then `resume` if needed).
      capture_response: true
      rework:
        provider: codex
        model: gpt-5.5
        effort: xhigh
        prompt: |
          You are handling human Plannotator annotations on the tasks added by
          this `speckit-converge` pass.

          Markdown path under review: $REVIEW_DOCUMENT
          Annotations:
          $REVIEW_ANNOTATIONS

          Converge context: tasks_added=$speckit-converge.output.tasks_added

          ## Instructions
          1. Read `.specify/feature.json` for `<feature_directory>`.
          2. Confirm `$REVIEW_DOCUMENT` is that feature's `tasks.md`.
          3. Apply each actionable annotation directly to the new or related tasks.
          4. Preserve unrelated, pre-existing, and completed tasks.
          5. Treat a pure approval or acknowledgement as a no-op.
          6. Do not generate HTML and do not start another Plannotator session.
          7. Print only the absolute path to the updated `tasks.md`.
             Do not add a Markdown fence or commentary.


  - id: speckit-final-ralph-tasks-to-ralph
    script: *speckit_tasks_to_ralph
    runtime: bun
    timeout: 60000
    depends_on: [speckit-converge-gate]


  - id: speckit-final-ralph-implement
    workflow: archon-ralph-dag-project-aware
    input: '$speckit-final-ralph-tasks-to-ralph.output.prd_dir'
    isolation: inherit
    depends_on: [speckit-final-ralph-tasks-to-ralph]
    when: "$speckit-final-ralph-tasks-to-ralph.output.has_tasks == true"

  - id: speckit-final-ralph-implementation-complete
    depends_on: [speckit-final-ralph-implement]
    when: "$speckit-final-ralph-implement.output.done == true"
    bash: |
      echo "Final Ralph implementation complete; continuing parent finalization."

  - id: speckit-final-ralph-implementation-blocked
    depends_on: [speckit-final-ralph-implement]
    when: "$speckit-final-ralph-implement.output.done == false"
    bash: |
      echo "Final Ralph implementation returned a blocker; stopping before PR." >&2
      exit 1

  - id: speckit-final-ralph-sync-back
    script: *speckit_ralph_sync
    runtime: bun
    timeout: 60000
    depends_on:
      - speckit-final-ralph-implementation-complete
      - speckit-final-ralph-no-tasks
    trigger_rule: one_success

  - id: speckit-final-ralph-no-tasks
    bash: |
      echo "no unchecked Tnnn tasks; skipping final Ralph implement"
    depends_on:
      - speckit-final-ralph-tasks-to-ralph
    when: "$speckit-final-ralph-tasks-to-ralph.output.has_tasks == false"

  - id: cargo-clean-before-pr
    bash: |
      if [ -f Cargo.toml ]; then
        cargo clean
      fi
    depends_on: [speckit-converge-gate]


  - id: speckit-final-cargo-clean-before-pr
    bash: |
      if [ -f Cargo.toml ]; then
        cargo clean
      fi
    depends_on:
      - speckit-final-ralph-sync-back


  - id: update-bmad-sprint-status
    prompt: |
      Read `.specify/feature.json` and the active feature's `spec.md` to identify the
      corresponding BMAD story.
      Read `_bmad-output/implementation-artifacts/sprint-status.yaml` completely.
      Match the feature to exactly one story under `development_status` by its story
      identifier and title, not only by its current status.
      If exactly one matching story is `backlog`, change only that status to `done`.
      If the matching story is already `done`, make no change and succeed.
      If the file is missing, the match is absent or ambiguous, or the matching story
      has any other status, stop with a clear error and do not modify the file.
      Verify the final status before completing.
    provider: codex
    effort: medium
    depends_on: [cargo-clean-before-pr, speckit-final-cargo-clean-before-pr]
    trigger_rule: one_success
    context: fresh
    model: gpt-5.6-terra

  - id: finalize-parent-commits
    bash: |
      set -euo pipefail
      ROOT=$(git rev-parse --show-toplevel)
      cd "$ROOT"
      add_if_exists() {
        local p
        for p in "$@"; do
          if [ -e "$p" ]; then
            git add -- "$p"
          fi
        done
      }
      add_if_exists .specify/feature.json
      add_if_exists _bmad-output/implementation-artifacts/sprint-status.yaml
      FEATURE_DIR=$(jq -r '.feature_directory // empty' .specify/feature.json 2>/dev/null || true)
      if [ -n "$FEATURE_DIR" ]; then
        case "$FEATURE_DIR" in /*) : ;; *) FEATURE_DIR="$ROOT/$FEATURE_DIR" ;; esac
        add_if_exists "$FEATURE_DIR/tasks.md" "$FEATURE_DIR/spec.md" "$FEATURE_DIR/plan.md"
        git add -u -- "$FEATURE_DIR/prd.json" "$FEATURE_DIR/progress.txt" "$FEATURE_DIR/prd.md" 2>/dev/null || true
      fi
      ARCHIVE_LIST="$ARTIFACTS_DIR/speckit/archive-dirs.txt"
      if [ -f "$ARCHIVE_LIST" ]; then
        while IFS= read -r archive_dir; do
          [ -n "$archive_dir" ] || continue
          [ -d "$archive_dir" ] || { echo "missing recorded archive dir: $archive_dir" >&2; exit 1; }
          git add -- "$archive_dir"
        done < "$ARCHIVE_LIST"
      fi
      git diff --cached --name-status
      if git diff --cached --quiet; then
        echo "no parent-owned metadata changes to commit"
      else
        git commit -m "chore: speckit ralph sync-back and sprint status"
      fi
      git push -u origin HEAD
      OWNED=".specify/feature.json _bmad-output/implementation-artifacts/sprint-status.yaml"
      if [ -n "${FEATURE_DIR:-}" ]; then
        OWNED="$OWNED $FEATURE_DIR/tasks.md $FEATURE_DIR/spec.md $FEATURE_DIR/plan.md $FEATURE_DIR/prd.json $FEATURE_DIR/progress.txt $FEATURE_DIR/prd.md"
      fi
      if [ -f "$ARCHIVE_LIST" ]; then
        while IFS= read -r archive_dir; do
          [ -n "$archive_dir" ] || continue
          OWNED="$OWNED $archive_dir"
        done < "$ARCHIVE_LIST"
      fi
      # shellcheck disable=SC2086
      leftover=$(git status --porcelain -- $OWNED)
      if [ -n "$leftover" ]; then
        echo "parent-owned metadata paths still dirty after finalize:" >&2
        printf '%s\n' "$leftover" >&2
        exit 1
      fi
    depends_on: [update-bmad-sprint-status]

  - id: create-pull-request
    command: archon-create-pr
    depends_on: [finalize-parent-commits]
    context: fresh
    provider: omp
    model: cursor/composer-2.5
    effort: high
    idle_timeout: 900000
    output_type: pull-request

