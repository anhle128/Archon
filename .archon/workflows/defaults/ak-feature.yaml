name: ak-feature
description: |
  Use when: User wants to build a feature end-to-end with the Claude Kit (ck)
  pipeline running fully unattended in a worktree.
  Triggers: "ck feature", "claudekit feature", "ck plan and cook", "ck deep tdd",
            "plan then cook", "ck pipeline", "claude kit feature".
  Does: deep TDD planning (/ak:plan --deep --tdd) -> independent Codex gpt-5.6-sol
        verify + fix of the plan (answers any questions the planner could not
        decide, and writes verification-report.md beside the plan) ->
        conversion of the verified plan into a Ralph PRD (prd.md + prd.json
        stories) -> autonomous story-by-story implementation via the
        archon-ralph-dag sub-run (fresh context per story, validate + commit
        each), then a pushed branch, draft PR, and completion report.
  NOT for: quick one-file fixes, bug fixes, PR reviews, or running an existing plan
        (use archon-plan-to-pr for an existing plan).

# Default provider for ck:plan (Claude Opus). The verify-fix and build-ralph-prd
# nodes override to codex. The ralph-implement node runs the archon-ralph-dag
# sub-run as authored (its own per-node providers). Codex reasoning effort may be
# set with workflow/node `effort`; legacy assistants.codex.modelReasoningEffort
# remains the provider default.
provider: claude

nodes:
  # ───────────────────────────────────────────────────────────────────
  # STEP 1 / 5 — Setup
  # ───────────────────────────────────────────────────────────────────
  - id: setup
    bash: |
      set -euo pipefail
      echo "=== CLAUDE KIT FEATURE PIPELINE ==="
      echo "Feature: $ARGUMENTS"
      echo "PROJECT_ROOT=$(pwd)"
      echo "HEAD=$(git rev-parse --short HEAD 2>/dev/null || echo 'no-git')"
      echo "ARTIFACTS_DIR=$ARTIFACTS_DIR"
      git fetch --all --prune 2>/dev/null || true
      mkdir -p plans
      echo ""
      echo "Pipeline: /ak:plan --deep --tdd  ->  codex gpt-5.6-sol verify+fix  ->  plan->Ralph PRD  ->  archon-ralph-dag (loop + PR)"
      echo "Starting Step 1 of 5: deep TDD planning..."

  # ───────────────────────────────────────────────────────────────────
  # STEP 2 / 5 — Deep TDD plan (Claude + ck:plan), fully autonomous
  # ───────────────────────────────────────────────────────────────────
  - id: plan
    prompt: |
      /ak:plan --deep --tdd $ARGUMENTS
      When finished, print `PLAN_DIR=<absolute path to the plan directory>`.
    depends_on: [setup]
    provider: claude
    model: opus
    context: fresh
    denied_tools:
      - AskUserQuestion

  # ───────────────────────────────────────────────────────────────────
  # STEP 3a — Resolve the freshly created plan directory
  # The active-plan pointer ck:plan writes is session-scoped and does not survive
  # across workflow nodes, so locate the newest plan dir by mtime. Diagnostics go
  # to stderr; stdout is ONLY the absolute path so downstream nodes can consume it
  # via $resolve-plan.output.
  # ───────────────────────────────────────────────────────────────────
  - id: resolve-plan
    bash: |
      set -euo pipefail
      PLAN_DIR="$(ls -dt plans/*/ 2>/dev/null | head -1 || true)"
      if [ -z "$PLAN_DIR" ] || [ ! -f "${PLAN_DIR}plan.md" ]; then
        echo "ERROR: no plan directory with plan.md found under ./plans/" >&2
        exit 1
      fi
      ABS_PLAN_DIR="$(cd "$PLAN_DIR" && pwd)"
      echo "Resolved plan dir: $ABS_PLAN_DIR" >&2
      ls -la "$ABS_PLAN_DIR" >&2
      printf '%s' "$ABS_PLAN_DIR"
    depends_on: [plan]
    always_run: true

  # ───────────────────────────────────────────────────────────────────
  # STEP 3b / 5 — Independent Codex gpt-5.6-sol verify + fix (replaces ck:plan's
  # human review gates) and answers the planner's open questions.
  # ───────────────────────────────────────────────────────────────────
  - id: verify-fix
    prompt: |
      Review and revise the complete plan at `$resolve-plan.output`.
      Treat the current plan as an unverified draft.
      Do not trust its claims, assumptions, scope, file references, technical decisions, or conclusions.

      Independently inspect the repository, documentation, code, tests, configuration, and existing behavior.
      Use repository evidence to verify every material part of the plan.

      Determine:

      - What goal the plan is trying to achieve.
      - Whether that goal matches the actual project need.
      - Whether the proposed solution fully meets that goal.
      - Whether the scope is correct and complete.
      - Whether any requirements, decisions, or steps conflict.
      - Whether the plan conflicts with existing behavior, contracts, architecture, conventions, or repository rules.
      - Whether the design is correct, simple, maintainable, secure, scalable, and reliable.
      - Whether the named files, components, dependencies, and code paths are accurate.
      - Whether the implementation order is practical and complete.
      - Whether compatibility, migration, rollout, failure handling, and operational concerns are covered.
      - Whether the test and validation strategy can prove the result.
      - Whether the acceptance criteria are complete, measurable, and tied to the goal.
      - Whether the plan contains unsupported assumptions, gaps, unnecessary work, duplication, or premature abstractions.

      Trace the affected behavior end to end.
      Check direct and indirect effects outside the files named by the plan.
      Look for important cases that the plan author may have missed.

      Fix every verified problem directly in the plan.
      Add missing details that an implementing engineer needs.
      Remove incorrect, conflicting, redundant, or unnecessary content.
      Keep the solution focused and proportional to the goal.

      Do not implement production code.
      Your task is to make the plan ready for implementation.

      After revising the plan, review it again from these perspectives:

      1. Product goal and user outcome.
      2. Architecture and technical correctness.
      3. Public and internal contracts.
      4. Security, reliability, and data integrity.
      5. Performance and scalability.
      6. Implementation completeness.
      7. Testing and verification.
      8. Operations, compatibility, migration, and rollback.
      9. Simplicity and long-term maintainability.

      Finish with a concise report that states:

      - Your interpretation of the goal.
      - The evidence you inspected.
      - The important problems you found.
      - The changes you made.
      - Any remaining risks, assumptions, or unresolved questions.
      - Whether the plan is ready to implement.
    depends_on: [resolve-plan]
    provider: codex
    effort: xhigh
    model: gpt-5.6-sol
    context: fresh

  # ───────────────────────────────────────────────────────────────────
  # STEP 4 / 5 — Convert the verified ck plan into a Ralph PRD
  # Reads the WHOLE verified plan dir (plan.md + every phase-*.md +
  # verification-report.md) and writes a Ralph PRD (prd.md + prd.json) under
  # .archon/ralph/<slug>/ so archon-ralph-dag implements it story-by-story.
  # ───────────────────────────────────────────────────────────────────
  - id: build-ralph-prd
    prompt: |
      ## Persona

      You are a SHARP SOLUTION ARCHITECT who lives by KISS and YAGNI. You do not
      invent work that isn't in the plan, and you do not drop work that is.

      ## Headless mode — NO human is available

      Resolve every decision yourself from the verified plan plus the actual
      codebase. Do not stop to ask.

      ## Task

      A verified deep-TDD implementation plan lives at:

        $resolve-plan.output

      Convert that ENTIRE plan into a Ralph PRD so the archon-ralph-dag loop can
      implement it one story per iteration. Do NOT implement the feature itself —
      only produce the PRD files.

      1. Read `plan.md`, EVERY `phase-*.md`, and `verification-report.md` in that
         directory. The phase files carry the real implementation detail — do not
         rely on plan.md alone. Fold in every fix the verification report applied.
      2. Derive a kebab-case `<slug>` (max 50 chars) from the plan's feature name.
      3. Create the Ralph directory: `mkdir -p .archon/ralph/<slug>`.
      4. Break the plan into right-sized Ralph user stories — each completable in a
         single fresh-context iteration (roughly one phase or one coherent unit of
         work per story). Map the plan's TDD structure (tests-before / implement /
         tests-after / regression gate) into concrete, pass/fail acceptance
         criteria. Order stories by dependency (lower priority runs first) and set
         `dependsOn` to only lower-priority story ids. No cycles, no forward refs.
      5. Write `.archon/ralph/<slug>/prd.md` — a self-contained context document
         (overview / problem / solution, goals + success metrics, non-goals,
         technical context with real file:line references drawn from the plan, and
         a story-overview table). A fresh-context agent re-reads this each iteration.
      6. Write `.archon/ralph/<slug>/prd.json` using EXACTLY this schema
         (story-level `passes`, all `false` at start):

         ```json
         {
           "feature": "<feature name>",
           "userStories": [
             {
               "id": "US-001",
               "title": "<short title>",
               "description": "As a..., I want..., so that...",
               "acceptanceCriteria": ["<verifiable criterion>", "..."],
               "technicalNotes": "<real files, patterns, and phase refs to follow>",
               "dependsOn": [],
               "priority": 1,
               "passes": false,
               "notes": ""
             }
           ]
         }
         ```

      7. Verify both files exist and prd.json is valid JSON whose `userStories` is a
         non-empty array with every story `passes: false`.

      Report the ABSOLUTE path of the Ralph directory as `prd_dir` (resolve it with
      `realpath` so it is stable regardless of cwd).
    depends_on: [verify-fix]
    provider: codex
    effort: xhigh
    model: gpt-5.6-sol
    context: fresh
    output_format:
      type: object
      properties:
        prd_dir:
          type: string
        slug:
          type: string
        feature:
          type: string
        story_count:
          type: number
      required: [prd_dir, slug, story_count]

  # ───────────────────────────────────────────────────────────────────
  # STEP 5 / 5 — Implement via archon-ralph-dag (sub-run)
  # Runs archon-ralph-dag as a governed child run in this SAME worktree
  # (isolation: inherit). It sees a ready Ralph PRD (detect-input -> "ready",
  # so its own generation is skipped), loops one story per iteration (fresh
  # context, validate + commit each), pushes the branch, opens a draft PR, and
  # writes a completion report. The child's report threads back as this
  # node's output.
  # ───────────────────────────────────────────────────────────────────
  - id: ralph-implement
    workflow: archon-ralph-dag
    input: '$build-ralph-prd.output.prd_dir'
    depends_on: [build-ralph-prd]
