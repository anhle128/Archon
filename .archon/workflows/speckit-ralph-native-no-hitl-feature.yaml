{name: speckit-ralph-native-no-hitl-feature,description: "Use when: User wants Speckit SDD with Archon-native Ralph iterations and no\n          Plannotator HITL on clarify/red-team.\nTriggers: \"speckit ralph native no hitl\", \"native ralph no hitl\",\n          \"speckit native no-hitl\", \"ralph native without plannotator\",\n          \"speckit ralph native unattended clarify\".\nDoes: Specify → clarify → red-team → plan → tasks → analyze → tasks-to-ralph →\n      native Ralph loop → sync-back →\n      converge gate → human review before retry → final Ralph pass on exhaustion →\n      BMAD sprint status update → PR creation.\nNOT for: Speckit feature requests that need Plannotator review on clarify/red-team\n         (use speckit-ralph-native-feature instead).\nNOT for: Quick one-file fixes, bug fixes, PR reviews.\nNOT for: When a spec already exists (use archon-speckit-plan-to-tasks instead).\nNOT for: Spec generation only without planning (use archon-speckit-spec instead).\n",interactive: true,effort: xhigh,provider: codex,model: gpt-5.5,nodes: [{id: setup,bash: "echo \"=== SPECKIT SDD PIPELINE ===\"\necho \"Feature: $ARGUMENTS\"\nFEATURE_SLUG=$(echo \"$ARGUMENTS\" | tr '[:upper:]' '[:lower:]' | tr -s ' ' '-' | sed 's/[^a-z0-9-]//g' | sed 's/--*/-/g' | cut -c1-60)\necho \"FEATURE_SLUG=$FEATURE_SLUG\"\necho \"PROJECT_ROOT=$(pwd)\"\necho \"HEAD=$(git rev-parse --short HEAD 2>/dev/null || echo 'no-git')\"\ngit fetch --all --prune 2>/dev/null || true\necho \"ARTIFACTS_DIR=$ARTIFACTS_DIR\"\necho \"\"\necho \"Artifacts will be saved to: $ARTIFACTS_DIR\"\necho \"Starting Step 1 of 7: Generating feature specification...\""},{id: specify,depends_on: [setup],model: xai-oauth/grok-4.6,provider: omp,context: fresh,prompt: "/speckit-specify create detail spec for $ARGUMENTS, \nread related documents for understand the origin context and purpose, \nsave references document to let the next phases know the origin purpose, \nread deeply to understand before writing, \ndon't guess, spawn sub-agents for help"},{id: clarify,depends_on: [specify],model: gpt-5.6-sol,provider: codex,context: fresh,prompt: $speckit-clarifybatch --turn 10},{id: clarify-file-check,depends_on: [clarify],bash: "set -euo pipefail\nsource .specify/scripts/bash/common.sh\n\nrepo_root=$(get_repo_root)\nfeature_dir=$(read_feature_json_feature_directory \"$repo_root\")\nif [ -z \"$feature_dir\" ]; then\n  echo \"clarify-file-check: .specify/feature.json has no valid feature_directory\" >&2\n  exit 1\nfi\nif [[ \"$feature_dir\" != /* ]]; then\n  feature_dir=\"$repo_root/$feature_dir\"\nfi\nif [ ! -d \"$feature_dir\" ]; then\n  echo \"clarify-file-check: feature directory does not exist: $feature_dir\" >&2\n  exit 1\nfi\n\nquestions_file=\"$feature_dir/clarification-questions.md\"\nif [ -f \"$questions_file\" ]; then\n  printf 'HAS_QUESTIONS\\n'\nelif [ -e \"$questions_file\" ]; then\n  echo \"clarify-file-check: expected a regular file: $questions_file\" >&2\n  exit 1\nelse\n  printf 'NO_QUESTIONS\\n'\nfi"},{id: clarify-respond,depends_on: [clarify-file-check],when: "$clarify-file-check.output == 'HAS_QUESTIONS'",model: xai-oauth/grok-4.6,provider: omp,context: fresh,prompt: "## Persona\n\nYou are a SHARP SOLUTION ARCHITECT who lives by KISS and YAGNI. You\nDO NOT overthink. You DO NOT invent problems that don't exist. Your\nfirst instinct on any question is \"is this a real problem?\" — most\naren't, and you skip those without ceremony. When the problem IS real,\nyou pick the SIMPLEST durable answer that matches the feature intent and\nlocal project constraints — never the most elaborate architecture you can imagine. \nYou think in invariants and contracts because they keep things simple long-term,\nnot because complexity impresses anyone. You push back on weak\nquestions, reject band-aids, and reject over-engineering with equal\nforce. You name trade-offs explicitly. No speculative abstractions.\nNo feature flags or \"TODO: revisit\" comments. No future-proofing for\nrequirements nobody has asked for.\n\n## Task\n\nDraft answers to clarification questions in the file produced by the\nprevious `clarify` node. The file is the single source of truth —\nno chat-only Q&A drafts.\nRun all commands from the current working directory; use only relative paths.\n\n## Instructions\n1. Read .specify/feature.json to resolve <feature_directory>.\n2. If there is a grill-me reference, read it and follow all decisions.\n3. Read <feature_directory>/clarification-questions.md. Confirm it\n   exists and has `Status: PENDING`. If missing or already ARCHIVED,\n   STOP and report BLOCKED — do NOT fabricate questions.\n4. trigger clarification-answer-review skill"},{id: clarify-apply,depends_on: [clarify-respond],model: sonnet,provider: claude,context: fresh,skills: [speckit-clarifybatch],prompt: $speckit-clarifybatch --apply},{id: red-team,depends_on: [clarify-file-check,clarify-respond,clarify-apply],trigger_rule: none_failed_min_one_success,model: "claude-opus-4-8[1M]",provider: claude,context: fresh,denied_tools: [Bash],skills: [speckit-red-team-run],prompt: "Read .specify/feature.json to resolve <feature_directory>, then run:\n$speckit.red-team.run <feature_directory> --yes"},{id: red-team-respond,depends_on: [red-team],model: xai-oauth/grok-4.6,provider: omp,context: fresh,prompt: "## Persona\n\nYou are a SHARP SOLUTION ARCHITECT who lives by KISS and YAGNI. You\nDO NOT overthink. You DO NOT invent problems that don't exist. Your\nfirst instinct on any finding is \"is this a real problem?\" — most\naren't, and you skip those without ceremony. When the problem IS real,\nyou pick the SIMPLEST durable fix that matches the feature intent and\nlocal project constraints — never the most elaborate architecture you can imagine. You think in\ninvariants and contracts because they keep things simple long-term,\nnot because complexity impresses anyone. You push back on weak\nfindings, reject band-aids, and reject over-engineering with equal\nforce. You name trade-offs explicitly. No speculative abstractions.\nNo feature flags or \"TODO: revisit\" comments. No future-proofing for\nrequirements nobody has asked for.\n\n## Task\n\nDraft per-finding resolutions for a red-team findings file produced by\nthe previous `red-team` node. The file is the single source of truth —\nno chat-only RECAP drafts. Mirror of the `clarify-respond` flow above\n(file-centric, in-place edits).\nRun all commands from the current working directory; use only relative paths.\n\n## Stance: critical-thinking, bounded-verification, long-term-only\n\nA red-team finding is an ACCUSATION, not a verdict. Treat each finding as\na hypothesis to be tested against the feature artifacts before picking a\nresolution category. Do not auto-accept the reviewer's framing; do not\nauto-apply their proposed fix. Your job is to:\n  (a) verify the finding's premise against the actual spec,\n  (b) inspect narrowly relevant local code/docs only when needed to\n      resolve an existing contract, API, data shape, or integration point,\n  (c) propose the LONG-TERM resolution — never a work-around / band-aid.\n\n## Instructions\n\n1. Read .specify/feature.json to resolve <feature_directory>.\n2. Glob `<feature_directory>/red-team-findings-*.md` and pick the MOST\n   RECENT file whose filename does NOT contain `-applied-` (highest\n   YYYY-MM-DD, then highest -NN). Confirm the file's §2 Findings table\n   has `Status` blank (not yet resolved). If file missing, or already\n   archived (filename contains `-applied-`), STOP and report BLOCKED —\n   do NOT fabricate findings.\n3. Read `<feature_directory>/spec.md` for context.\n4. If there is a grill-me reference, read it and follow all decisions.\n\n5. trigger red-team-answer-review skill"},{id: red-team-apply,depends_on: [red-team-respond],model: sonnet,provider: claude,context: fresh,skills: [speckit-red-team-apply],prompt: /speckit.red-team.apply --allow-historical-edits},{id: plan,depends_on: [red-team-apply],model: xai-oauth/grok-4.6,provider: omp,context: fresh,prompt: "Read .specify/feature.json to resolve <feature_directory>, then run:\n/speckit-plan create detail plan <feature_directory>"},{id: tasks,depends_on: [plan],model: gpt-5.6-sol,provider: codex,context: fresh,prompt: "Read .specify/feature.json to resolve <feature_directory>, then run:\n/speckit-tasks <feature_directory>"},{id: analyze,depends_on: [tasks],model: gpt-5.6-sol,provider: codex,context: fresh,prompt: "Read .specify/feature.json to resolve <feature_directory>.\nIf there is a grill-me reference, read it and follow all decisions.\nThen run:\n/speckit-analyzebatch <feature_directory>"},{id: analyze-respond,depends_on: [analyze],model: xai-oauth/grok-4.6,provider: omp,context: fresh,prompt: "## Persona\n\nYou are a SHARP SOLUTION ARCHITECT who lives by KISS and YAGNI. You\nDO NOT overthink. You DO NOT invent problems that don't exist. Your\nfirst instinct on any finding is \"is this a real problem?\" — most\naren't, and you skip those without ceremony. When the problem IS real,\nyou pick the SIMPLEST durable fix that matches the feature intent and\nlocal project constraints — never the most elaborate architecture you can imagine. You think in\ninvariants and contracts because they keep things simple long-term,\nnot because complexity impresses anyone. You push back on weak\nfindings, reject band-aids, and reject over-engineering with equal\nforce. You name trade-offs explicitly. No speculative abstractions.\nNo feature flags or \"TODO: revisit\" comments. No future-proofing for\nrequirements nobody has asked for.\n\n## Task\n\nDraft per-finding resolutions for the analyze findings file produced\nby the previous `analyze` node. The file is the single source of\ntruth — no chat-only RECAP drafts.\nRun all commands from the current working directory; use only relative paths.\n\n## Instructions\n\n1. Read .specify/feature.json to resolve <feature_directory>.\n2. Glob `<feature_directory>/analyze-findings-*.md` and pick the MOST\n   RECENT file whose filename does NOT contain `-applied-` (highest\n   YYYY-MM-DD, then highest -NN). Confirm the file's header has\n   `Status: PENDING` and §2 Findings table has the `Status` column blank.\n   If the file is missing, or already archived (filename contains\n   `-applied-`), STOP and report BLOCKED — do NOT fabricate findings.\n3. Read `<feature_directory>/spec.md`, `plan.md`, and `tasks.md` for context.\n4. For EACH finding row in §2 Findings, INVESTIGATE FIRST — do not punt\n   ambiguity to a human when the answer is available in bounded local\n   context. Start with spec.md / plan.md / tasks.md. Inspect code only\n   when the finding depends on an existing API, data model, integration\n   point, workflow, or documented behavior. Do NOT inspect sibling or\n   external repositories unless the user's feature request explicitly\n   names them.\n\n   **Scope-preservation invariant (read first):** if the finding asks\n   for a broader redesign outside this feature's stated scope, do not\n   route it to `spec-fix`. Use `skipped`, `out-of-scope`, or\n   `accepted-risk` as appropriate and cite the local evidence you used.\n\n   Only then choose ONE resolution category:\n     - spec-fix       finding is valid AND you derived the correct answer\n                      from requirements, feature artifacts, or narrowly\n                      relevant local code/docs. Propose a concrete diff\n                      to spec.md / plan.md / tasks.md (the artifact named\n                      in the §2 Location column) and explain WHY that\n                      answer is correct in the `Rationale:` line.\n     - accepted-risk  acknowledge but do not edit; record under\n                      `## Accepted Risks` of the relevant artifact.\n     - out-of-scope   cross-reference only; no artifact edit.\n     - skipped        Use when ANY of:\n                        (a) finding's premise is wrong (the artifact\n                            doesn't actually say what the finding claims,\n                            or the inconsistency dissolves on read);\n                        (b) recommended fix CONFLICTS with verified\n                            requirements or a required local contract;\n                        (c) the finding asks the spec to expand beyond\n                            the feature scope without evidence that the\n                            broader redesign is required.\n                      Reason MUST cite the verification source\n                      (file:line + quoted snippet, or the artifact\n                      path:line that disproves the premise).\n5. Edit the findings file IN-PLACE using the Edit tool. For EACH finding ID:\n   a. §2 Findings table — fill the `Status` column with the chosen category.\n   b. §3 Resolutions Log block — fill the payload per category:\n        - spec-fix: `Target: <path>` (typically `<feature_directory>/spec.md`,\n          `plan.md`, or `tasks.md`), then a `Before:` / `After:` snippet pair.\n\n          LITERAL-SUBSTRING CONTRACT (CRITICAL — apply will reject anything\n          else with `Before-snippet not found in <target>`):\n            * `Before:` MUST be a VERBATIM SUBSTRING of `Target:` —\n              literal text COPIED from the file using the Read tool.\n              NOT a paraphrase. NOT a description of the gap.\n              NOT a directive like \"FR-X is missing …\".\n            * `After:` MUST be the intended replacement of that exact\n              `Before:` text (so apply can do `target.replace(before, after)`\n              mechanically).\n            * `Before:` MUST appear EXACTLY ONCE in `Target:`. After\n              drafting, run `grep -c -F \"<Before>\" <Target>` and confirm\n              the result is `1`. If `0`, you paraphrased — re-read\n              `Target:` and copy literal text. If `>1`, expand `Before:`\n              with surrounding context until unique.\n\n          WRONG (will fail apply):\n            Before: FR-021 is missing a result-subtype mapping for max_tokens.\n            After:  Add a row stating max_tokens maps to error_during_execution.\n\n          RIGHT (passes apply):\n            Before: | error_during_execution | runtime errors | errors[0] populated |\n            After:  | error_during_execution | runtime errors, max_tokens, model_context_window_exceeded | errors[0] populated |\n\n          After the Before/After pair, ALSO emit a `Rationale:` line\n          (one paragraph) explaining HOW you derived the After text:\n          cite the file paths, symbols, table rows, or local docs\n          that prove this is the correct answer. The maintainer reads\n          this to verify your reasoning, not just your diff.\n\n        - accepted-risk: `Rationale:` (one paragraph) + optional `Tags:`\n          line. Include `[regulatory-review]` tag when the finding touches\n          money path / regulatory path / compliance / disclosure / KYC /\n          AML / SEC / SFC / FCA / GDPR signals (apply phase will also\n          auto-tag, but be explicit when obvious).\n        - out-of-scope: `Cross-reference: <spec path or ID>` + `Reason:`.\n        - skipped: `Reason: <why>`.\n6. Do NOT modify finding ID, category, severity, location, summary, or\n   recommendation in §2. Do NOT touch §1 Session Summary or §5 Session\n   Metadata YAML — `/speckit-analyzebatch --apply` manages those at apply time.\n7. After editing, print \"RESOLUTIONS_DRAFTED\" and the absolute path of\n   the findings file, then STOP."},{id: analyze-apply,depends_on: [analyze-respond],model: sonnet,provider: claude,context: fresh,skills: [speckit-analyzebatch],prompt: $speckit-analyzebatch --apply --allow-historical-edits},{id: ralph-tasks-to-ralph,depends_on: [analyze-apply,speckit-converge-review-gate],trigger_rule: one_success,bash: "set -euo pipefail\nbash .specify/extensions/ralph-loop/scripts/bash/tasks-to-prd.sh"},{id: ralph-native-preflight,depends_on: [ralph-tasks-to-ralph],bash: "set -euo pipefail\nRLN_ROOT=$(git rev-parse --show-toplevel)\nRLN_FEATURE=\"$RLN_ROOT/.specify/feature.json\"\nRLN_RULES=\"$RLN_ROOT/.specify/extensions/ralph-loop/AGENTS.md\"\n[ -f \"$RLN_FEATURE\" ] || { echo \"Missing $RLN_FEATURE\" >&2; exit 1; }\n[ -f \"$RLN_RULES\" ] || { echo \"Missing $RLN_RULES\" >&2; exit 1; }\nRLN_PRD=$(jq -er '.ralph_prd_file | select(type == \"string\" and length > 0)' \"$RLN_FEATURE\")\nRLN_PROGRESS=$(jq -er '.ralph_progress_file | select(type == \"string\" and length > 0)' \"$RLN_FEATURE\")\ncase \"$RLN_PRD\" in /*) : ;; *) RLN_PRD=\"$RLN_ROOT/$RLN_PRD\" ;; esac\ncase \"$RLN_PROGRESS\" in /*) : ;; *) RLN_PROGRESS=\"$RLN_ROOT/$RLN_PROGRESS\" ;; esac\n[ -f \"$RLN_PRD\" ] || { echo \"Missing $RLN_PRD\" >&2; exit 1; }\n[ -f \"$RLN_PROGRESS\" ] || { echo \"Missing $RLN_PROGRESS\" >&2; exit 1; }\njq -e '\n  type == \"object\" and\n  (.userStories | type == \"array\" and length > 0) and\n  all(.userStories[];\n    (.completed | type == \"boolean\") and\n    (.tasks | type == \"array\" and length > 0) and\n    all(.tasks[]; .passes | type == \"boolean\")\n  )\n' \"$RLN_PRD\" >/dev/null || { echo \"Invalid Ralph PRD: $RLN_PRD\" >&2; exit 1; }"},{id: ralph-loop-run,depends_on: [ralph-native-preflight],model: anthropic/claude-sonnet-5,provider: omp,effort: xhigh,loop: {max_iterations: 100,fresh_context: true,until_bash: "set -euo pipefail\nRLN_ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\nRLN_PRD=$(jq -r '.ralph_prd_file // empty' \"$RLN_ROOT/.specify/feature.json\" 2>/dev/null)\n[ -n \"$RLN_PRD\" ] || exit 1\ncase \"$RLN_PRD\" in /*) : ;; *) RLN_PRD=\"$RLN_ROOT/$RLN_PRD\" ;; esac\n[ -f \"$RLN_PRD\" ] || exit 1\nif jq -e '[.userStories[] | select(.completed==false)] | length == 0' \"$RLN_PRD\" >/dev/null 2>&1; then\n  exit 0\nfi\njq -e '[.userStories[].tasks[]? | select(.passes==false)] | length == 0' \"$RLN_PRD\" >/dev/null 2>&1\n",command: archon-speckit-ralph-iteration}},{id: ralph-sync-back,depends_on: [ralph-loop-run],model: gpt-5.6-terra,provider: codex,context: fresh,prompt: "Read .specify/feature.json to resolve <feature_directory>, then run:\n/speckit.ralph-loop.sync-back <feature_directory>"},{id: speckit-converge,depends_on: [ralph-sync-back],model: gpt-5.6-sol,provider: codex,context: fresh,output_format: {type: object,properties: {gate: {type: string,enum: [PASS,FAIL]},tasks_added: {type: number}},required: [gate,tasks_added]},prompt: "Read .specify/feature.json to resolve <feature_directory>.\nrun speckit-converge\nReturn PASS only when there are no any problem.\nReturn FAIL when it added one or more tasks to tasks.md ."},{id: speckit-converge-gate,depends_on: [speckit-converge],route_loop: {condition: "$speckit-converge.output.gate == 'PASS'",max_iterations: 3,routes: {positive: cargo-clean-before-pr,negative: speckit-converge-review-gate,exhausted: speckit-final-ralph-tasks-to-ralph}}},{id: speckit-converge-review-gate,plannotator_gate: {prepare: {prompt: "## Goal\nOpen the active feature's `tasks.md` directly in the supervised\n`speckit-converge-review-gate` session.\n\nConverge reported:\n- gate: $speckit-converge.output.gate\n- tasks_added: $speckit-converge.output.tasks_added\n\n## Steps\n1. Read `.specify/feature.json` to resolve `<feature_directory>`.\n2. Confirm `<feature_directory>/tasks.md` exists, is a regular file, and is readable.\n3. Resolve it to an absolute path.\n4. Do not generate HTML and do not start a separate Plannotator session.\n   The supervised gate opens the returned Markdown file.\n\n## Final output (contract — required)\nPrint only the absolute path to `<feature_directory>/tasks.md`.\nDo not add a Markdown fence or commentary.\n",provider: claude,model: sonnet,effort: medium,allowed_tools: [Read,Bash]},message: "Speckit convergence added $speckit-converge.output.tasks_added task(s) to `tasks.md`.\n\nReview the tasks added by this converge pass directly in `tasks.md`.\n- **Owner only:** Approve or Send Annotations.\n- Teammates may Close without ending the session (`--persist-session`).\n- After Approve: re-run `ralph-tasks-to-ralph` and the Ralph implementation loop.\n\nCrash recovery: `archon workflow review-open <run-id>` (then `resume` if needed).\n",capture_response: true,rework: {prompt: "You are handling human Plannotator annotations on the tasks added by\nthis `speckit-converge` pass.\n\nMarkdown path under review: $REVIEW_DOCUMENT\nAnnotations:\n$REVIEW_ANNOTATIONS\n\nConverge context: tasks_added=$speckit-converge.output.tasks_added\n\n## Instructions\n1. Read `.specify/feature.json` for `<feature_directory>`.\n2. Confirm `$REVIEW_DOCUMENT` is that feature's `tasks.md`.\n3. Apply each actionable annotation directly to the new or related tasks.\n4. Preserve unrelated, pre-existing, and completed tasks.\n5. Treat a pure approval or acknowledgement as a no-op.\n6. Do not generate HTML and do not start another Plannotator session.\n7. Print only the absolute path to the updated `tasks.md`.\n   Do not add a Markdown fence or commentary.\n",provider: codex,model: gpt-5.5,effort: xhigh}}},{id: speckit-final-ralph-tasks-to-ralph,bash: "set -euo pipefail\nbash .specify/extensions/ralph-loop/scripts/bash/tasks-to-prd.sh"},{id: speckit-final-ralph-native-preflight,depends_on: [speckit-final-ralph-tasks-to-ralph],bash: "set -euo pipefail\nRLN_ROOT=$(git rev-parse --show-toplevel)\nRLN_FEATURE=\"$RLN_ROOT/.specify/feature.json\"\nRLN_RULES=\"$RLN_ROOT/.specify/extensions/ralph-loop/AGENTS.md\"\n[ -f \"$RLN_FEATURE\" ] || { echo \"Missing $RLN_FEATURE\" >&2; exit 1; }\n[ -f \"$RLN_RULES\" ] || { echo \"Missing $RLN_RULES\" >&2; exit 1; }\nRLN_PRD=$(jq -er '.ralph_prd_file | select(type == \"string\" and length > 0)' \"$RLN_FEATURE\")\nRLN_PROGRESS=$(jq -er '.ralph_progress_file | select(type == \"string\" and length > 0)' \"$RLN_FEATURE\")\ncase \"$RLN_PRD\" in /*) : ;; *) RLN_PRD=\"$RLN_ROOT/$RLN_PRD\" ;; esac\ncase \"$RLN_PROGRESS\" in /*) : ;; *) RLN_PROGRESS=\"$RLN_ROOT/$RLN_PROGRESS\" ;; esac\n[ -f \"$RLN_PRD\" ] || { echo \"Missing $RLN_PRD\" >&2; exit 1; }\n[ -f \"$RLN_PROGRESS\" ] || { echo \"Missing $RLN_PROGRESS\" >&2; exit 1; }\njq -e '\n  type == \"object\" and\n  (.userStories | type == \"array\" and length > 0) and\n  all(.userStories[];\n    (.completed | type == \"boolean\") and\n    (.tasks | type == \"array\" and length > 0) and\n    all(.tasks[]; .passes | type == \"boolean\")\n  )\n' \"$RLN_PRD\" >/dev/null || { echo \"Invalid Ralph PRD: $RLN_PRD\" >&2; exit 1; }"},{id: speckit-final-ralph-loop-run,depends_on: [speckit-final-ralph-native-preflight],model: cursor/cursor-grok-4.5,provider: omp,effort: xhigh,loop: {max_iterations: 100,fresh_context: true,until_bash: "set -euo pipefail\nRLN_ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\nRLN_PRD=$(jq -r '.ralph_prd_file // empty' \"$RLN_ROOT/.specify/feature.json\" 2>/dev/null)\n[ -n \"$RLN_PRD\" ] || exit 1\ncase \"$RLN_PRD\" in /*) : ;; *) RLN_PRD=\"$RLN_ROOT/$RLN_PRD\" ;; esac\n[ -f \"$RLN_PRD\" ] || exit 1\nif jq -e '[.userStories[] | select(.completed==false)] | length == 0' \"$RLN_PRD\" >/dev/null 2>&1; then\n  exit 0\nfi\njq -e '[.userStories[].tasks[]? | select(.passes==false)] | length == 0' \"$RLN_PRD\" >/dev/null 2>&1\n",command: archon-speckit-ralph-iteration}},{id: speckit-final-ralph-sync-back,depends_on: [speckit-final-ralph-loop-run],model: gpt-5.6-terra,provider: codex,context: fresh,prompt: "Read .specify/feature.json to resolve <feature_directory>, then run:\n/speckit.ralph-loop.sync-back <feature_directory>"},{id: cargo-clean-before-pr,bash: "if [ -f Cargo.toml ]; then\n  cargo clean\nfi"},{id: speckit-final-cargo-clean-before-pr,depends_on: [speckit-final-ralph-sync-back],bash: "if [ -f Cargo.toml ]; then\n  cargo clean\nfi"},{id: update-bmad-sprint-status,depends_on: [cargo-clean-before-pr,speckit-final-cargo-clean-before-pr],trigger_rule: one_success,model: gpt-5.6-terra,provider: codex,context: fresh,prompt: "Read `.specify/feature.json` and the active feature's `spec.md` to identify the\ncorresponding BMAD story.\nRead `_bmad-output/implementation-artifacts/sprint-status.yaml` completely.\nMatch the feature to exactly one story under `development_status` by its story\nidentifier and title, not only by its current status.\nIf exactly one matching story is `backlog`, change only that status to `done`.\nIf the matching story is already `done`, make no change and succeed.\nIf the file is missing, the match is absent or ambiguous, or the matching story\nhas any other status, stop with a clear error and do not modify the file.\nVerify the final status before completing."},{id: create-pull-request,depends_on: [update-bmad-sprint-status],model: gpt-5.6-terra,provider: codex,context: fresh,command: archon-create-pr}]}