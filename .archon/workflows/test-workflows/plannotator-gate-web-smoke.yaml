name: plannotator-gate-web-smoke
description: |
  Use when: A maintainer wants to verify the stabilized Plannotator gate lifecycle from Archon Web UI.
  Triggers: "test plannotator gate web", "plannotator web smoke", "verify live review flow".
  Does: Exercises annotation rework and Plannotator approval, then exercises Web UI approval while the live supervisor owns continuation, and proves downstream execution happened once.
  NOT for: Production document review or unattended automation.

provider: codex
model: gpt-5.6-terra
effort: medium
interactive: true
worktree:
  enabled: false
mutates_checkout: false
tags: [Test, Plannotator, Web UI]

nodes:
  - id: create-rework-review
    bash: |
      set -euo pipefail

      review_file="$ARTIFACTS_DIR/plannotator-rework-review.html"
      cat > "$review_file" <<'HTML'
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>Archon Plannotator Gate — Rework Test</title>
          <style>
            :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
            body { max-width: 760px; margin: 48px auto; padding: 0 24px; background: #09090b; color: #fafafa; }
            .card { margin-top: 24px; padding: 24px; border: 1px solid #3f3f46; border-radius: 16px; background: #18181b; }
            code { color: #fbbf24; }
          </style>
        </head>
        <body>
          <h1>Gate 1: annotation → rework → Plannotator approval</h1>
          <div class="card">
            <p id="review-target">This card intentionally starts gray.</p>
            <ol>
              <li>Annotate the sentence above.</li>
              <li>Use this exact note: <code>WEB_SMOKE_REWORK_OK: make this card blue.</code></li>
              <li>Choose <strong>Send Annotations</strong>.</li>
              <li>Wait for the updated document to reopen, verify it is blue, then approve inside Plannotator.</li>
            </ol>
          </div>
        </body>
      </html>
      HTML

      printf '%s\n' "$review_file"

  - id: annotation-rework-gate
    depends_on: [create-rework-review]
    plannotator_gate:
      document: "$create-rework-review.output"
      message: |
        Gate 1/2 tests the child annotation and rework path.

        In Plannotator, annotate the gray card with:
        `WEB_SMOKE_REWORK_OK: make this card blue.`

        Choose **Send Annotations**, wait for the updated HTML to reopen, verify the card is blue, then approve inside Plannotator.
      capture_response: true
      rework:
        prompt: |
          You are executing the deterministic rework step of an Archon Plannotator smoke test.

          HTML path: $REVIEW_DOCUMENT
          Reviewer annotations:
          $REVIEW_ANNOTATIONS

          Requirements:
          1. Read the existing HTML file.
          2. Update the `.card` background to a clearly blue color and its border to a lighter blue.
          3. Add `data-rework="applied"` to the `<body>` element.
          4. Add a visible line containing `WEB_SMOKE_REWORK_OK` without removing the test instructions.
          5. Write valid standalone HTML back to the same path.
          6. Verify the file contains `data-rework="applied"`.
          7. Print exactly the absolute HTML path on one line and no other text.

  - id: create-web-approval-review
    depends_on: [annotation-rework-gate]
    bash: |
      set -euo pipefail

      first_review="$ARTIFACTS_DIR/plannotator-rework-review.html"
      grep -q 'data-rework="applied"' "$first_review"
      grep -q 'WEB_SMOKE_REWORK_OK' "$first_review"

      review_file="$ARTIFACTS_DIR/plannotator-web-approval-review.html"
      cat > "$review_file" <<'HTML'
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>Archon Plannotator Gate — Web Approval Test</title>
          <style>
            :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
            body { max-width: 760px; margin: 48px auto; padding: 0 24px; background: #07111f; color: #e0f2fe; }
            .card { margin-top: 24px; padding: 24px; border: 1px solid #0284c7; border-radius: 16px; background: #0c4a6e; }
          </style>
        </head>
        <body>
          <h1>Gate 2: approve from Archon Web UI</h1>
          <div class="card">
            <p>Leave this Plannotator window open.</p>
            <p>Return to the Archon Web UI and click <strong>Approve</strong> on this paused workflow.</p>
            <p>Do not approve inside Plannotator for this gate.</p>
          </div>
        </body>
      </html>
      HTML

      printf '%s\n' "$review_file"

  - id: web-approval-gate
    depends_on: [create-web-approval-review]
    plannotator_gate:
      document: "$create-web-approval-review.output"
      message: |
        Gate 2/2 tests external Web UI approval with supervisor-owned continuation.

        Leave the Plannotator window open.
        Return to this workflow in Archon Web UI and click **Approve**.
        Do not approve inside Plannotator.

        Expected result: Web UI records the decision, the live supervisor closes the child, and downstream runs once without a second executor.
      capture_response: true
      rework:
        prompt: |
          This smoke-test gate normally expects approval from Archon Web UI.
          If annotations were sent accidentally, update the HTML at $REVIEW_DOCUMENT to address them:
          $REVIEW_ANNOTATIONS

          Preserve valid standalone HTML and the Web UI approval instructions.
          Print exactly the absolute HTML path on one line and no other text.

  - id: prove-downstream-once
    depends_on: [web-approval-gate]
    bash: |
      set -euo pipefail

      marker="$ARTIFACTS_DIR/plannotator-web-smoke-downstream.log"
      printf 'downstream_completed\n' >> "$marker"
      count="$(wc -l < "$marker" | tr -d ' ')"
      if [ "$count" -ne 1 ]; then
        printf 'Expected exactly one downstream execution, got %s\n' "$count" >&2
        exit 1
      fi

      printf 'PLANNOTATOR_WEB_SMOKE_PASS\n'
      printf 'Downstream executions: %s\n' "$count"
      printf 'Marker: %s\n' "$marker"
