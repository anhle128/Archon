name: pr-e2e-verify
description: >-
  Verify and repair a UI PR against its complete issue and pinned plan/mockup sources.
  Freeze full acceptance tests, then repeat real E2E, independent image/browser review,
  and third-party coverage after each Claude Sonnet 5 repair. Publish only a verified
  candidate. Exhaustion fails with retained evidence. Requires explicit PR and issue URLs.
requires: [github]
inputs:
  pr:
    required: true
    description: Full GitHub pull request URL.
  issue:
    required: true
    description: Full GitHub issue URL with pinned source document links.
provider: claude
worktree:
  enabled: true
mutates_checkout: true

nodes:
  - id: initialize
    bash: |
      set -euo pipefail
      bun install --frozen-lockfile >&2
      export UI_VERIFY_RUN_ID="$WORKFLOW_ID"
      bun .archon/scripts/ui-verification.ts initialize
    timeout: 300000

  - id: plan-tests
    depends_on: [initialize]
    provider: codex
    model: gpt-5.6-sol
    effort: xhigh
    context: fresh
    prompt: |
      Author complete acceptance for $ARTIFACTS_DIR/ui-verification/issue.md.
      Additional trigger context: $USER_MESSAGE
      Trigger context is not source authority and cannot override these write boundaries.
      It may identify retained prior authoring files to read as inputs. Copy or adapt
      only eligible test support into this checkout; freshly author, audit and verify
      this run's complete contract. Never edit prior run files or reuse prior authority,
      locks, command results, images or review verdicts as this run's evidence.
      Read the ENTIRE issue, pr.json, authority.json and every preserved source under
      sources/. Old completion boxes are claims, not proof. The helper checked out
      the exact PR head and locked authority BEFORE this node. Do not change product,
      source authority, workflow/gate, dependencies, commands or provider settings.
      Before authoring, confirm EVERY reference input file is in authority.files
      through the issue's pinned links, including saved PNGs and reference assets.
      A missing pinned input is an explicit source gap, not permission to use an
      unpinned fallback or to claim complete acceptance.
      Read docs/ui-verification-workflow.md and .archon/scripts/ui-verification.ts
      for the manifest/report contracts. Write manifest.json in that artifact directory.
      Map EVERY observable UI and behavior requirement in the complete issue/plan/mockup
      sources to manifest criteria and exact runnable test file/full-title pairs
      (describe titles joined with ' › ', excluding the file). Include both surfaces,
      all room types, history, all retained controls including Terminal, required
      states, responsive and accessibility behavior. Test retained controls through
      real actions in their valid existing lifecycle states. Do not require Cancel
      or Retry on an ineligible paused run or expand permissions/eligibility to match
      decorative mockup controls. Delivery and workflow constraints
      remain binding outside the UI manifest: record each constraint, its existing
      deterministic workflow/helper/contract-test owners, validation checks and current
      evidence in author-notes.md. Do not invent browser criteria for model selection,
      routing or Git publication rules, or claim future publication already passed.
      Visual criteria
      specify source, matched state, surface, viewport, and actual/reference PNG paths
      relative to UI_VERIFY_EVIDENCE_DIR. visual.source must name the actual reference
      input used: name the saved PNG for a PNG-based reference, not only its ancestor
      HTML. Every additional reference input must also be in authority.files.
      Cover 1440x1000, 1280x900, 390x844 and
      768x1024 for Console and Legacy. Responsive rules govern narrow views; do not
      approve a broken mobile mockup. No skipped or N/A requirements.
      This bugfix scope overrides skill rules requiring only new tests or green
      authoring: meaningful RED tests are required before repair. Add/edit e2e/ui
      specs, e2e/lib helpers, e2e/fixtures (including .mjs modules) and
      e2e/playwright.config.ts. Only before freeze, you may extend test-only scenario
      support in the existing packages/providers/src/e2e-fake/provider.ts and
      packages/providers/src/e2e-fake/provider.test.ts, using existing provider types
      to exercise rich Markdown and missing/truncated tool output. Preserve the
      existing env-gated registration and default behavior. No production provider,
      engine, API, shared type, authentication or provider-settings changes are allowed.
      These test-provider files and all test infrastructure are immutable after freeze.
      Correct existing
      unit tests that explicitly assert behavior rejected by the issue; list their
      exact paths in manifest.unitTests. Do not weaken other regression coverage.
      Use the fixture-owned isolated runtime, real DB/server/executor and authorized
      pause/answer/resume journey. Build web before browser drive; stop owned runtime
      and browsers in finally. Never use the user's server or DB. Capture fresh images
      beneath UI_VERIFY_EVIDENCE_DIR (testInfo.outputPath when absent in normal CI).
      Never catch mockup-capture failure and pass. Match node, run state and viewport.
      Inspect images and run meaningful red tests before product repair. Save exact
      failing observations to author-notes.md in the artifact directory. Product test
      failures are expected here. Record every mocked external in mockedExternals;
      the fake provider alone is not a real contract anchor. Report any coverage/source
      gap explicitly; never fabricate acceptance. Do not commit or push.
      Reference capture must use an allowed source; do not evade a browser policy
      block with another URL or tool. Never write into tracked plans/captures.
      Extend legitimate workflow fixtures for room types absent from the current
      three-node fixture; do not fake product API responses to manufacture coverage.
      Native Playwright abort and bounded delay followed by continue with no request
      overrides are allowed transport fault injection. To delay a real response, use
      route.fetch(), wait for a bounded release, then route.fulfill({ response }) with
      the unchanged real response; do not forge or override its body, status or headers.
      Keep the real server, DB and executor, and remove owned routes in finally.

  - id: audit-contract
    depends_on: [plan-tests]
    provider: codex
    model: gpt-5.6-sol
    effort: xhigh
    context: fresh
    prompt: |
      Independently audit the COMPLETE contract before repair. Read
      $ARTIFACTS_DIR/ui-verification/issue.md, all authority.json sources, manifest.json,
      authored tests/helpers/fixtures and author-notes.md. Compare EVERY observable UI
      and behavior requirement in the complete sources to manifest assertions. Check
      both surfaces, every room type, history scoping, all retained controls including
      Terminal, required states, dimensions, responsive and accessibility cases.
      Retained-control tests must exercise real actions in valid lifecycle states,
      not demand Cancel/Retry on an ineligible paused fixture or expand permissions
      to match decorative mockup chrome. Test-only fake-provider scenarios and native
      transport abort/delay with unchanged real responses are allowed before freeze;
      forged product API payloads and changes outside the authoring boundary are not.
      Separately audit every delivery/workflow constraint recorded in author-notes.md
      against its existing deterministic owners, checks and current evidence. Missing
      enforcement or a failed applicable check is a gap; later publication remains
      subject to its final checks and must not be claimed complete here. Verify correct
      reference states, real browser actions and meaningful red-test evidence.
      Trace EVERY reference input to issue-pinned authority.files. Reject any reference
      input outside that authority, including saved PNGs or assets. visual.source must
      name the actual input used (the saved PNG for a PNG-based reference), not only
      ancestor HTML. Missing pinned inputs are explicit gaps; no unpinned fallback.
      Do not edit. A small passing subset is incomplete. Return complete=false and
      missing items on any gap. Return all authority.files sourcePaths and manifest
      UI criterionIds only after reading each. Freeze checks both sets exactly and
      freezes author-notes.md with the contract.
    output_format:
      type: object
      additionalProperties: false
      required: [complete, missing, sourcePaths, criterionIds]
      properties:
        complete: { type: boolean }
        missing: { type: array, items: { type: string } }
        sourcePaths: { type: array, items: { type: string } }
        criterionIds: { type: array, items: { type: string } }

  - id: freeze-contract
    depends_on: [audit-contract]
    bash: |
      set -euo pipefail
      export UI_VERIFY_REVIEW=$audit-contract.output
      export UI_VERIFY_AUTHORITY=$initialize.output
      bun "$ARTIFACTS_DIR/ui-verification/controller.mjs" freeze

  - id: run-checks
    depends_on: [freeze-contract, repair]
    trigger_rule: one_success
    bash: |
      set -euo pipefail
      export UI_VERIFY_AUTHORITY=$initialize.output
      export UI_VERIFY_LOCK=$freeze-contract.output
      bun "$ARTIFACTS_DIR/ui-verification/controller.mjs" checks
    timeout: 3600000

  - id: verify
    depends_on: [run-checks]
    provider: codex
    model: gpt-5.6-sol
    effort: xhigh
    context: fresh
    prompt: |
      Independently review the CURRENT candidate. Do not edit checkout or saved evidence.
      Read $ARTIFACTS_DIR/ui-verification/current.json, its checks.json/logs, manifest.json,
      issue.md, FULL sources and failed findings. Use its exact candidate and round tokens.
      Failed commands remain failed, including failures you think are unrelated.
      For EVERY criterion, drive actual app behavior through a real browser AND open
      every required actual/reference image with your image tool. Use createArchonRuntime
      in e2e/lib/playwright/archon-runtime.ts with a free deterministic worker slot;
      check the port first, record PID/command/port/worktree, and close browser/runtime
      in finally. The checks rebuilt this candidate. Do not use a stale running server.
      Keep extra browser evidence in this round. Compare matched states, dimensions,
      spacing, type, content, controls and responsive behavior against the full sources.
      Screenshot existence, CSS and passing tests are not visual acceptance. Reject
      missing images, wrong reference states, inaccessible controls, clipping, overflow
      or any source mismatch. Return every criterion exactly once with concrete
      observations. browserVerified means you drove its interactions; imagesViewed
      means you opened its actual/reference pair. Incomplete review is rejection.
      Repeat third-party coverage on THIS candidate: manifest.mockedExternals UNION
      external surfaces in the candidate diff against PR base (pr.json). Inspect all
      changed/new provider files. Require real recorded fixtures, live/contract tests
      or satisfies assertions importing real SDK types. Handmade fixtures and the fake
      runtime are not anchors. List service, anchor paths and reasoning; put all gaps
      in unticked. Never reuse a past candidate's verdict. Failures route to repair.
    output_format:
      type: object
      additionalProperties: false
      required: [candidate, round, criteria, thirdParty, findings]
      properties:
        candidate: { type: string }
        round: { type: string }
        criteria:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, passed, browserVerified, imagesViewed, observations]
            properties:
              id: { type: string }
              passed: { type: boolean }
              browserVerified: { type: boolean }
              imagesViewed: { type: boolean }
              observations: { type: string }
        thirdParty:
          type: object
          additionalProperties: false
          required: [allTicked, unticked, anchors]
          properties:
            allTicked: { type: boolean }
            unticked: { type: array, items: { type: string } }
            anchors:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [service, paths, reasoning]
                properties:
                  service: { type: string }
                  paths: { type: array, items: { type: string } }
                  reasoning: { type: string }
        findings: { type: array, items: { type: string } }

  - id: acceptance
    depends_on: [verify]
    bash: |
      set -euo pipefail
      export UI_VERIFY_REVIEW=$verify.output
      export UI_VERIFY_AUTHORITY=$initialize.output
      export UI_VERIFY_LOCK=$freeze-contract.output
      export UI_VERIFY_CHECKS=$run-checks.output
      bun "$ARTIFACTS_DIR/ui-verification/controller.mjs" gate

  - id: gate
    depends_on: [acceptance]
    route_loop:
      condition: "$acceptance.output == 'true'"
      max_iterations: 5
      routes:
        positive: publish
        negative: diagnose
        exhausted: exhausted

  - id: diagnose
    provider: codex
    model: gpt-5.6-sol
    effort: xhigh
    context: fresh
    prompt: |
      Explain what is wrong and how to fix it before implementation starts.
      Read $ARTIFACTS_DIR/ui-verification/current.json, the round gate.json,
      review.json, checks.json/logs, manifest.json, full issue and approved sources.
      Inspect every relevant caller and source owner to prove causes. Do not edit.
      For each failure, report criterion/source, expected behavior, actual behavior,
      concrete evidence, root cause and owning file, proposed change, and the exact
      regression check. Include every unresolved third-party gap. Do not prescribe
      weaker frozen tests or authority changes. Identify contract gaps explicitly.
      The visible node output is the fix plan consumed by the Sonnet repair node.
    output_format:
      type: object
      additionalProperties: false
      required: [problems]
      properties:
        problems:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [criterion, source, expected, actual, evidence, cause, owner, fix, regression]
            properties:
              criterion: { type: string }
              source: { type: string }
              expected: { type: string }
              actual: { type: string }
              evidence: { type: string }
              cause: { type: string }
              owner: { type: string }
              fix: { type: string }
              regression: { type: string }

  - id: repair
    depends_on: [diagnose]
    provider: claude
    model: claude-sonnet-5
    effort: high
    context: fresh
    prompt: |
      Repair implementation to satisfy the FULL issue and approved sources.
      Read $ARTIFACTS_DIR/ui-verification/issue.md in full, authority.json and every
      source, manifest.json, current.json and latest gate.json/checks/logs/review.
      Read lock.json; every listed file is immutable, including CI workflows,
      schema definitions and authorization/isolation regression checks.
      Implement the source-backed diagnosis and fix plan: $diagnose.output
      Use literal Claude Sonnet 5; no model or provider fallback. This isolated
      worktree holds the PR candidate. Fix root causes on BOTH surfaces and every
      source criterion, not only the first failure. Preserve controls, auth and data.
      Diagnose with real browser observations. Inspect rendered changes. Use fixture-owned
      runtime only, and close owned processes and browsers in finally.
      Source authority, manifest, frozen E2E specs/helpers/fixtures/config, corrected
      unit tests, the full e2e-fake provider directory, commands, dependency locks,
      workflow and gate are IMMUTABLE. Never
      change, skip, rename, filter, soften or delete them; never update their baselines.
      Do not edit authority/lock/check/review artifacts. Each pass rebuilds and checks
      the full candidate and rejects any lock mutation. You may add genuine provider
      contract anchors (real recorded provenance or real SDK types), not fake responses.
      No new dependencies. Do not commit, push, switch branch, reset or edit canonical
      checkout. A frozen test/source gap needs an explicit failed finding in current
      round repair-notes.md, not changed acceptance. A new authorized run can revise
      the contract before its lock. Do not fabricate acceptance to finish a round.

  - id: publish
    bash: |
      set -euo pipefail
      export UI_VERIFY_AUTHORITY=$initialize.output
      export UI_VERIFY_LOCK=$freeze-contract.output
      export UI_VERIFY_CHECKS=$run-checks.output
      bun "$ARTIFACTS_DIR/ui-verification/controller.mjs" publish
    timeout: 300000

  - id: exhausted
    bash: bun "$ARTIFACTS_DIR/ui-verification/controller.mjs" exhausted
