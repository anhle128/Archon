# Keep one stable UI gate. Draft and non-UI PRs skip inside the job.
# Automatic runs use the immutable PR base; manual runs use the selected ref.
# Never substitute the PR-head workflow when the trusted base needs an upgrade.

name: PR E2E Verify

on:
  pull_request:
    branches: [dev, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR number to verify
        required: true
        type: string
      issue_url:
        description: Full GitHub issue URL with approved, pinned plan/mockup sources
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  verify:
    name: PR E2E Verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The operator explicitly selects a reviewed ref for manual dispatch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect UI path changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'packages/web/**'
              - 'e2e/**'
              - '.github/workflows/pr-e2e-verify.yml'
              - '.archon/workflows/pr-e2e-verify.yaml'
              - '.archon/scripts/ui-verification.ts'
              - 'scripts/ui-verification.test.ts'
              - 'scripts/pr-e2e-verify-ci.test.ts'
              - '.claude/skills/web-automation-test-pr/**'
              - '.claude/skills/verify-thirdparties-e2e-test-pr/**'

      - name: Decide whether to run the DAG
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          UI_CHANGED: ${{ steps.filter.outputs.ui }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — always run pr-e2e-verify."
          elif [ "$IS_DRAFT" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Draft PR; skip-succeeds until ready_for_review (avoids burning AI credits on WIP)."
          elif [ "${UI_CHANGED:-}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "UI paths changed — run pr-e2e-verify."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No UI paths changed; skip-succeeds so a required check never stays pending."
          fi

      - name: Resolve trusted PR and issue inputs
        id: inputs
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          ISSUE_URL: ${{ inputs.issue_url }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive PR number." >&2
            exit 1
          fi
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json url,state,headRepository,headRepositoryOwner,headRefOid,baseRefName,closingIssuesReferences)
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" '
            .state == "OPEN" and
            ((.headRepositoryOwner.login + "/" + .headRepository.name) == $repo)
          ' <<< "$PR_JSON" >/dev/null; then
            echo "::error::Only open, same-repository PRs can run with write credentials. Fork heads are not supported." >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$(jq -r '.headRefOid' <<< "$PR_JSON")" != "$EVENT_HEAD" ]; then
              echo "::error::PR head changed after this event. Use the current PR run." >&2
              exit 1
            fi
            if [ "$(jq '.closingIssuesReferences | length' <<< "$PR_JSON")" -ne 1 ]; then
              echo "::error::Automatic verification requires exactly one closing issue reference. Link one issue, or dispatch manually with issue_url." >&2
              exit 1
            fi
            ISSUE_URL=$(jq -r '.closingIssuesReferences[0].url' <<< "$PR_JSON")
          fi
          if ! [[ "$ISSUE_URL" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[1-9][0-9]*$ ]]; then
            echo "::error::issue_url must be a full GitHub issue URL." >&2
            exit 1
          fi
          echo "pr_url=$(jq -r '.url' <<< "$PR_JSON")" >> "$GITHUB_OUTPUT"
          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r '.baseRefName' <<< "$PR_JSON")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.headRefOid' <<< "$PR_JSON")" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'true'
        with:
          bun-version: 1.3.11

      - name: Check trusted workflow contract
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          bun -e '
            const fs = require("node:fs");
            const workflow = Bun.YAML.parse(fs.readFileSync(".archon/workflows/pr-e2e-verify.yaml", "utf8"));
            if (!fs.existsSync(".archon/scripts/ui-verification.ts") ||
                workflow.inputs?.pr?.required !== true || workflow.inputs?.issue?.required !== true ||
                !workflow.nodes?.some(node => node.id === "publish")) {
              console.error("::error::Trusted workflow upgrade is not present in this checkout. Run the reviewed workflow locally, or explicitly dispatch a reviewed branch; do not load the PR-head workflow automatically.");
              process.exit(1);
            }
          '

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Pin Claude binary to glibc variant
        if: steps.gate.outputs.run == 'true'
        # Bun installs both glibc and musl optional-dep variants; the SDK resolver
        # picks musl first, which fails on glibc Ubuntu runners. Mirror
        # marketplace-auto-review.yml / docker entrypoint (PR #1521).
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)  SUFFIX="linux-x64" ;;
            aarch64) SUFFIX="linux-arm64" ;;
            *) echo "ERROR: Unsupported arch $ARCH for Claude binary pinning" >&2; exit 1 ;;
          esac
          CLAUDE_BIN=$(find node_modules -type f -name claude -path "*claude-agent-sdk-${SUFFIX}/*" -not -path "*musl*" 2>/dev/null | head -1)
          if [ -x "$CLAUDE_BIN" ]; then
            ABS_PATH=$(realpath "$CLAUDE_BIN")
            echo "CLAUDE_BIN_PATH=$ABS_PATH" >> "$GITHUB_ENV"
            echo "Pinned Claude binary: $ABS_PATH"
          else
            echo "ERROR: glibc Claude binary not found under node_modules for $SUFFIX" >&2
            find node_modules -type d -name "claude-agent-sdk-*" 2>/dev/null | head -10 >&2
            exit 1
          fi

      - name: Install Codex CLI
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @openai/codex

      - name: Install Chromium system dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          npm ci --prefix e2e
          cd e2e
          npx --no-install playwright install --with-deps chromium

      - name: Fail fast if required secrets are missing
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            missing+=("ANTHROPIC_API_KEY (repair / Claude Sonnet 5)")
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            missing+=("OPENAI_API_KEY (plan-tests, audit-contract, verify, diagnose / Codex)")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "::error::pr-e2e-verify cannot start; missing Actions secrets:"
              for s in "${missing[@]}"; do echo "  - $s"; done
              echo "Set them under Settings → Secrets and variables → Actions."
            } >&2
            exit 1
          fi

      - name: Verify gh authentication
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh auth status; then
            echo "::error::GITHUB_TOKEN did not authenticate gh. Check the job's permissions block (needs pull-requests: write, contents: write)." >&2
            exit 1
          fi

      - name: Configure Git credentials
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git

      - name: Run pr-e2e-verify
        id: run
        if: steps.gate.outputs.run == 'true'
        env:
          ARCHON_HOME: ${{ runner.temp }}/archon-home-${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          PR_URL: ${{ steps.inputs.outputs.pr_url }}
          ISSUE_URL: ${{ steps.inputs.outputs.issue_url }}
          BASE_REF: ${{ steps.inputs.outputs.base_ref }}
          EXPECTED_HEAD: ${{ steps.inputs.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$ARCHON_HOME"
          echo "log_path=$ARCHON_HOME/workflow.log" >> "$GITHUB_OUTPUT"
          # Start the managed worktree from this trusted source, not the PR head.
          set +e
          bun run cli workflow run pr-e2e-verify \
            --from "$(git rev-parse HEAD)" --base "$BASE_REF" \
            --input "pr=$PR_URL" --input "issue=$ISSUE_URL" 2>&1 | tee "$ARCHON_HOME/workflow.log"
          wf_code=${PIPESTATUS[0]}
          set -e
          RUNS_JSON=$(bun run cli workflow runs --json --all --limit 20)
          RUN_JSON=$(jq -ce '[.runs[]? | select(.workflow_name == "pr-e2e-verify")] |
            if length == 1 then .[0] else error("Expected exactly one workflow run in this isolated ARCHON_HOME") end' <<< "$RUNS_JSON")
          RUN_ID=$(jq -r '.id' <<< "$RUN_JSON")
          OUTPUT_ROOT=$(jq -er '.output_root | select(type == "string" and length > 0)' <<< "$RUN_JSON")
          ART_DIR=$(realpath "$OUTPUT_ROOT/artifacts/runs/$RUN_ID")
          case "$ART_DIR" in
            "$ARCHON_HOME"/workspaces/*/artifacts/runs/"$RUN_ID") ;;
            *) echo "::error::Run artifacts are outside this run's ARCHON_HOME." >&2; exit 1 ;;
          esac
          echo "artifact_dir=$ART_DIR" >> "$GITHUB_OUTPUT"
          GET_JSON=$(bun run cli workflow get "$RUN_ID" --json --verbose)
          printf '%s\n' "$GET_JSON" > "$ART_DIR/ci-result.json"
          jq '{state: .result.state, terminal: .result.terminal, nodes: .result.nodes}' <<< "$GET_JSON"
          if [ "$wf_code" -ne 0 ] || ! jq -e '
            .result.terminal == true and .result.state == "completed" and
            ([.result.nodes[]? | select(.nodeId == "publish" and .state == "completed")] | length == 1)
          ' <<< "$GET_JSON" >/dev/null; then
            echo "::error::pr-e2e-verify did not complete publication (workflow exit $wf_code)." >&2
            exit 1
          fi
          EVIDENCE_DIR="$ART_DIR/ui-verification"
          CURRENT_DIR=$(jq -er '.directory' "$EVIDENCE_DIR/current.json")
          case "$CURRENT_DIR" in
            "$EVIDENCE_DIR"/rounds/*) ;;
            *) echo "::error::Current evidence is outside this run." >&2; exit 1 ;;
          esac
          jq -en --arg run "$RUN_ID" --arg pr "$PR_URL" --arg issue "$ISSUE_URL" --arg head "$EXPECTED_HEAD" \
            --slurpfile authority "$EVIDENCE_DIR/authority.json" \
            --slurpfile current "$EVIDENCE_DIR/current.json" \
            --slurpfile gate "$CURRENT_DIR/gate.json" \
            --slurpfile published "$EVIDENCE_DIR/published.json" '
            $authority[0].runId == $run and $authority[0].head == $head and
            $published[0].pr == $pr and $published[0].issue == $issue and
            ($published[0].commit | test("^[0-9a-f]{40}$")) and
            $published[0].candidate == $current[0].candidate and
            $published[0].round == $current[0].round and
            $gate[0].candidate == $current[0].candidate and $gate[0].round == $current[0].round and
            $gate[0].directory == $current[0].directory and $gate[0].passed == true
          ' >/dev/null
          COMMIT=$(jq -r '.commit' "$EVIDENCE_DIR/published.json")
          CANDIDATE=$(jq -r '.candidate' "$EVIDENCE_DIR/published.json")
          test "$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')" = "$COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$COMMIT" | jq -e --arg tree "$CANDIDATE" --arg head "$EXPECTED_HEAD" \
            '.tree.sha == $tree and [.parents[].sha] == [$head]' >/dev/null
          echo "Verified published commit $COMMIT from Archon run $RUN_ID."

      - name: Upload pr-e2e-verify artifacts
        if: ${{ always() && steps.gate.outputs.run == 'true' && steps.run.outputs.log_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-e2e-verify-${{ github.event.pull_request.number || inputs.pr_number }}
          path: |
            ${{ steps.run.outputs.artifact_dir }}
            ${{ steps.run.outputs.log_path }}
          if-no-files-found: error
          retention-days: 7
