# Single UI merge-gate on PRs into `dev`.
#
# Stable GitHub check name: **PR E2E Verify** (this job's `name:`). Pin that
# exact string in a `dev` ruleset when Kevin wants it required. Do not rename
# after pinning — required checks bind the check-run name.
#
# Trigger choice: `pull_request` (not `pull_request_target`).
# marketplace-auto-review.yml uses `pull_request_target` because it must
# approve/merge with write secrets even for the marketplace path. This gate
# also comments and may push evidence, but it does that with the
# `pull_request` GITHUB_TOKEN + explicit write permissions — same-repo PRs
# into `dev` get write; fork PRs stay read-only (evidence push is already
# non-fatal in the DAG; a comment failure fails the job). We do **not** use
# `pull_request_target` so a fork PR cannot run this YAML against write
# secrets. The runner checkouts the *base* SHA (trusted CLI + DAG) and the
# Archon workflow fetches the PR head into its own worktree.
#
# Path filter is on the job, not `on.pull_request.paths`. A top-level paths
# filter skips the workflow entirely and leaves a required check pending.
# Non-UI and draft PRs still run this job and skip-succeed so the check name
# stays green/stable.
#
# Replaces closed PR #126 / `e2e-ui.yml` (cheap Playwright-only GHA). Do not
# add that workflow back.

name: PR E2E Verify

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to verify (same fetch-pr contract as the DAG)
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    name: PR E2E Verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Trusted base: run the CLI and `.archon/workflows/pr-e2e-verify.yaml`
      # from the destination branch, not the PR head. The DAG's resolve-paths
      # node fetches the PR head into the engine worktree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Detect UI path changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'packages/web/**'
              - 'e2e/**'
              - '.github/workflows/pr-e2e-verify.yml'
              - '.archon/workflows/pr-e2e-verify.yaml'
              - '.claude/skills/web-automation-test-pr/**'
              - '.claude/skills/chrome-devtools-axi/**'
              - '.claude/skills/verify-thirdparties-e2e-test-pr/**'
            web:
              - 'packages/web/**'

      - name: Decide whether to run the DAG
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          UI_CHANGED: ${{ steps.filter.outputs.ui }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — always run pr-e2e-verify."
          elif [ "$IS_DRAFT" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Draft PR; skip-succeeds until ready_for_review (avoids burning AI credits on WIP)."
          elif [ "${UI_CHANGED:-}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "UI paths changed — run pr-e2e-verify."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No UI paths changed; skip-succeeds so a required check never stays pending."
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'true'
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Pin Claude binary to glibc variant
        if: steps.gate.outputs.run == 'true'
        # Bun installs both glibc and musl optional-dep variants; the SDK resolver
        # picks musl first, which fails on glibc Ubuntu runners. Mirror
        # marketplace-auto-review.yml / docker entrypoint (PR #1521).
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)  SUFFIX="linux-x64" ;;
            aarch64) SUFFIX="linux-arm64" ;;
            *) echo "ERROR: Unsupported arch $ARCH for Claude binary pinning" >&2; exit 1 ;;
          esac
          CLAUDE_BIN=$(find node_modules -type f -name claude -path "*claude-agent-sdk-${SUFFIX}/*" -not -path "*musl*" 2>/dev/null | head -1)
          if [ -x "$CLAUDE_BIN" ]; then
            ABS_PATH=$(realpath "$CLAUDE_BIN")
            echo "CLAUDE_BIN_PATH=$ABS_PATH" >> "$GITHUB_ENV"
            echo "Pinned Claude binary: $ABS_PATH"
          else
            echo "ERROR: glibc Claude binary not found under node_modules for $SUFFIX" >&2
            find node_modules -type d -name "claude-agent-sdk-*" 2>/dev/null | head -10 >&2
            exit 1
          fi

      - name: Install Codex CLI
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @openai/codex

      - name: Install xvfb (AXI / Chrome on a headless runner)
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Fail fast if required secrets are missing
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            missing+=("ANTHROPIC_API_KEY (plan-tests / provider: claude)")
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            missing+=("OPENAI_API_KEY (verify / provider: codex)")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "::error::pr-e2e-verify cannot start; missing Actions secrets:"
              for s in "${missing[@]}"; do echo "  - $s"; done
              echo "Set them under Settings → Secrets and variables → Actions."
              echo "Optional for the resolve self-heal path: XAI_API_KEY + grok CLI (provider: grok)."
            } >&2
            exit 1
          fi
          if [ -z "${XAI_API_KEY:-}" ]; then
            echo "::warning::XAI_API_KEY is unset. The grok resolve node will fail if verify finds coverage gaps."
          fi

      - name: Install Grok CLI when XAI_API_KEY is set
        if: steps.gate.outputs.run == 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${XAI_API_KEY:-}" ]; then
            echo "XAI_API_KEY unset; skipping grok CLI install (resolve self-heal unavailable)."
            exit 0
          fi
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify gh authentication
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh auth status; then
            echo "::error::GITHUB_TOKEN did not authenticate gh. Check the job's permissions block (needs pull-requests: write, contents: write)." >&2
            exit 1
          fi

      - name: Rewrite git SSH remotes to HTTPS + token
        if: steps.gate.outputs.run == 'true'
        # pr-e2e-verify resolve-paths / commit-evidence prefer `gh repo view --json sshUrl`.
        # GitHub-hosted runners have no deploy key; map SSH and HTTPS to the job token.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add safe.directory '*'

      - name: Run pr-e2e-verify
        id: run
        if: steps.gate.outputs.run == 'true'
        env:
          ARCHON_HOME: ${{ runner.temp }}/archon-home
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PR_REF: ${{ github.event.pull_request.html_url || inputs.pr_number }}
          REQUIRE_AXI_SCREENSHOTS: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.web }}
        run: |
          set -euo pipefail
          mkdir -p "$ARCHON_HOME"

          # worktree.enabled: true on the DAG — do not pass --no-worktree.
          # xvfb-run gives chrome-devtools-axi a DISPLAY on ubuntu-latest.
          set +e
          xvfb-run -a bun run cli workflow run pr-e2e-verify "$PR_REF"
          wf_code=$?
          set -e

          echo "workflow_exit=$wf_code" >> "$GITHUB_OUTPUT"

          RUNS_JSON=$(bun run cli workflow runs --json --limit 20)
          RUN_ID=$(printf '%s' "$RUNS_JSON" | jq -r '[.runs[]? | select(.workflow_name == "pr-e2e-verify")][0].id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          if [ -z "$RUN_ID" ]; then
            echo "::error::pr-e2e-verify did not create a run (workflow exit $wf_code)." >&2
            exit 1
          fi

          GET_JSON=$(bun run cli workflow get "$RUN_ID" --json --verbose)
          printf '%s\n' "$GET_JSON" | jq '{state: .result.state, nodes: .result.nodes}'

          if [ "$wf_code" -ne 0 ]; then
            echo "::error::pr-e2e-verify workflow failed (exit $wf_code). plan-tests / verify / a bash node did not complete." >&2
            exit 1
          fi

          COMMENT_DONE=$(printf '%s' "$GET_JSON" | jq -r '[.result.nodes[]? | select(.nodeId == "comment-pr" and .state == "completed")] | length')
          if [ "$COMMENT_DONE" -gt 0 ]; then
            echo "::error::third-party coverage exhausted (comment-pr). Missing anchors must be added before merge." >&2
            exit 1
          fi

          STATUS_FILE=$(find "$ARCHON_HOME/workspaces" -name e2e-status.txt -path '*/artifacts/runs/*' 2>/dev/null | sort | tail -1 || true)
          if [ -z "$STATUS_FILE" ]; then
            echo "::error::no e2e-status.txt under ARCHON_HOME — run-e2e did not record a Playwright verdict." >&2
            exit 1
          fi
          status=$(tr -d '[:space:]' < "$STATUS_FILE")
          echo "e2e-status=$status (from $STATUS_FILE)"
          if [ "$status" != "passed" ]; then
            echo "::error::Playwright run-e2e $status. See e2e-result.log in uploaded artifacts." >&2
            exit 1
          fi

          ART_DIR=$(dirname "$STATUS_FILE")
          SHOTS=$(find "$ART_DIR/plan-tests" -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) 2>/dev/null | wc -l | tr -d ' ')
          echo "AXI screenshots in plan-tests/: $SHOTS"
          if [ "${REQUIRE_AXI_SCREENSHOTS}" = "true" ] && [ "${SHOTS:-0}" -lt 1 ]; then
            echo "::error::packages/web changed (or manual dispatch) but plan-tests wrote no AXI screenshots. Fail-closed." >&2
            exit 1
          fi

      - name: Upload pr-e2e-verify artifacts
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-e2e-verify-${{ github.event.pull_request.number || inputs.pr_number }}
          path: ${{ runner.temp }}/archon-home/workspaces/**/artifacts/runs/**
          if-no-files-found: ignore
          retention-days: 7
