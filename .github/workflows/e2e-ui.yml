# Gate C1 — committed Playwright UI e2e as a stable required-check candidate.
#
# Check name (branch protection): "UI Playwright e2e"
# Do not rename the job `name:` — GitHub required checks pin that string.
#
# The job ALWAYS runs on PRs/pushes to `dev`. Path filters live in a step, not
# on `on.pull_request.paths`, so a required check never stays pending on a
# non-UI PR. When no UI paths change, the job reports success after the filter.
#
# Out of scope: C2 (required AXI `pr-e2e-verify`) and D (validate-pr AXI swap).

name: UI Playwright e2e

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-playwright-e2e:
    name: UI Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'packages/web/**'
              - 'e2e/**'
              - '.github/workflows/e2e-ui.yml'

      - name: Decide whether to run Playwright
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.filter.outputs.ui }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "UI paths changed (or manual dispatch); running Playwright."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No UI-related paths changed; reporting success so required checks are not pending."
          fi

      - name: Setup Bun
        if: steps.gate.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install monorepo dependencies
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Build web UI
        if: steps.gate.outputs.run == 'true'
        run: bun run build:web

      - name: Install e2e dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.gate.outputs.run == 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Full suite (not test:ui:p0). Today that is 8 specs + 1 fixme skip —
      # cheap enough for CI; revisit only if the suite grows enough to time out.
      - name: Run UI Playwright e2e
        if: steps.gate.outputs.run == 'true'
        working-directory: e2e
        run: npm run test:ui

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/ui/reports/
          if-no-files-found: ignore
          retention-days: 7
